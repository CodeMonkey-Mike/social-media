<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LangGraph — LinkedIn lanes</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      /* Page system: inherited from the existing dashboard, not invented here. */
      --bg:        #f0f2f5;
      --surface:   #ffffff;
      --line:      #e4e6ea;
      --ink:       #1a1a1a;
      --ink-2:     #65676b;
      --ink-muted: #8a8d91;
      --accent:    #1877f2;
      --accent-wash: #e7f0fd;

      /* Status palette — fixed, never themed. `serious` is deliberately unused:
         it measures ΔE 13.6 from `warning` and both sit under 3:1 on white, so
         they are hard to tell apart. Every status below ships an ICON + a TEXT
         LABEL, so colour never carries the meaning alone. */
      --st-good:     #0ca30c;
      --st-warning:  #fab219;
      --st-critical: #d03b3b;

      /* Sequential blue ramp (one hue, light -> dark) for the volume meter. */
      --seq-100: #cde2fb;
      --seq-450: #2a78d6;
      --seq-600: #184f95;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--ink);
      display: flex;
      min-height: 100vh;
    }

    /* ── left nav (shared with index.html) ───────────────────────────────── */
    .sidenav {
      width: 190px;
      flex: 0 0 190px;
      background: var(--surface);
      border-right: 1px solid var(--line);
      padding: 16px 0;
      position: sticky;
      top: 0;
      height: 100vh;
    }
    .sidenav .brand {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .06em;
      text-transform: uppercase;
      color: var(--ink-muted);
      padding: 0 18px 12px;
    }
    .sidenav a {
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 9px 18px;
      font-size: 13.5px;
      font-weight: 500;
      color: var(--ink-2);
      text-decoration: none;
      border-left: 3px solid transparent;
    }
    .sidenav a:hover { background: #f5f6f7; color: var(--ink); }
    .sidenav a.active {
      color: var(--accent);
      border-left-color: var(--accent);
      background: var(--accent-wash);
      font-weight: 600;
    }
    .sidenav a .ico { width: 16px; text-align: center; font-size: 13px; }

    .main { flex: 1; min-width: 0; }
    header {
      background: var(--surface);
      border-bottom: 1px solid var(--line);
      padding: 14px 24px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    header h1 { font-size: 17px; font-weight: 600; }
    header .sub { font-size: 12.5px; color: var(--ink-muted); }
    header .refresh { margin-left: auto; font-size: 11.5px; color: var(--ink-muted); }

    .wrap { padding: 20px 24px 60px; max-width: 1100px; }
    section { margin-bottom: 26px; }
    h2 {
      font-size: 11.5px;
      font-weight: 700;
      letter-spacing: .07em;
      text-transform: uppercase;
      color: var(--ink-muted);
      margin-bottom: 10px;
    }
    .card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 16px 18px;
    }

    /* ── status pills: colour + icon + label, never colour alone ─────────── */
    .pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 11.5px;
      font-weight: 700;
      padding: 2px 9px 2px 7px;
      border-radius: 11px;
      white-space: nowrap;
      border: 1px solid transparent;
    }
    .pill .dot { font-size: 10px; line-height: 1; }
    .pill.running  { color: #0b57c2; background: var(--accent-wash); border-color: #c5dcfa; }
    .pill.done     { color: #067806; background: #e8f6e8; border-color: #c3e6c3; }
    .pill.failed   { color: #8a6100; background: #fdf3dc; border-color: #f3dfae; }
    .pill.halted   { color: #a52a2a; background: #fbe9e9; border-color: #f1c9c9; }
    .pill.idle     { color: var(--ink-muted); background: #f0f1f3; border-color: var(--line); }
    .pill.past     { color: var(--ink-muted); background: #f0f1f3; border-color: var(--line); }
    .pill.stale    { color: #8a6100; background: #fdf3dc; border-color: #f3dfae; }

    @keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: .35 } }
    .pill.running .dot { animation: pulse 1.4s ease-in-out infinite; }

    /* ── live strip ──────────────────────────────────────────────────────── */
    .live { display: flex; gap: 20px; align-items: flex-start; flex-wrap: wrap; }
    .live .who { min-width: 210px; }
    .live .lane-title { font-size: 19px; font-weight: 700; margin: 4px 0 2px; }
    .live .meta { font-size: 12.5px; color: var(--ink-2); }
    .live .event {
      flex: 1;
      min-width: 260px;
      font-family: 'Cascadia Code', Consolas, monospace;
      font-size: 12px;
      color: var(--ink-2);
      background: #f7f8fa;
      border: 1px solid var(--line);
      border-radius: 7px;
      padding: 9px 11px;
      word-break: break-word;
    }
    .live .event .lbl {
      display: block;
      font-family: inherit;
      font-size: 10px;
      letter-spacing: .06em;
      text-transform: uppercase;
      color: var(--ink-muted);
      margin-bottom: 3px;
    }

    .progbar {
      height: 6px;
      background: var(--seq-100);
      border-radius: 3px;
      overflow: hidden;
      margin-top: 9px;
    }
    .progbar > i { display: block; height: 100%; background: var(--seq-450); border-radius: 3px; }

    .warnbox {
      margin-top: 12px;
      font-size: 12.5px;
      padding: 9px 12px;
      border-radius: 7px;
      background: #fdf3dc;
      border: 1px solid #f3dfae;
      color: #7a5600;
    }
    .warnbox.crit { background: #fbe9e9; border-color: #f1c9c9; color: #8f2525; }

    /* ── lane diagram ────────────────────────────────────────────────────── */
    .lanes { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; }
    @media (max-width: 900px) { .lanes { grid-template-columns: repeat(2, 1fr); } }
    .lane {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 12px 13px;
      position: relative;
    }
    .lane.is-running { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-wash); }
    /* Tabs — one per automation. Same look as the Social page's tab bar. */
    .tabs {
      background: #fff; border-bottom: 1px solid var(--line);
      padding: 0 24px; display: flex; flex-wrap: wrap;
    }
    .tab {
      background: none; border: none; border-bottom: 2px solid transparent;
      cursor: pointer; padding: 13px 14px; font-size: 13px; font-weight: 500;
      color: var(--ink-muted); white-space: nowrap;
      display: flex; align-items: center; gap: 7px; transition: color .15s;
    }
    .tab:hover { color: var(--ink); }
    .tab.active { color: var(--accent); border-bottom-color: var(--accent); }
    /* A tab's dot is how a run — or an interrupt waiting on a human — stays visible
       while you are looking at a DIFFERENT automation's tab. */
    .tab .tdot { font-size: 9px; line-height: 1; }
    .tab .tdot.running { color: var(--accent); animation: pulse 1.4s ease-in-out infinite; }
    .tab .tdot.attn    { color: #a52a2a; }
    .tab .tdot.warn    { color: #8a6100; }
    .tab .tdot.idle    { color: #c9ccd1; }
    .tab .tcount {
      background: #eef0f2; color: var(--ink-muted); font-size: 11px; font-weight: 700;
      padding: 1px 6px; border-radius: 10px; min-width: 20px; text-align: center;
    }
    .tab.active .tcount { background: var(--accent-wash); color: var(--accent); }
    /* A blocked graph is the loudest state on this page — it stays stopped until a
       human answers, so the tab says so in WORDS and keeps saying it while active. */
    .tab .tcount.attn { background: #fbe9e9; color: #a52a2a; }
    .tab .tcount.warn { background: #fdf3dc; color: #8a6100; }
    .tab.needs, .tab.needs:hover { color: #a52a2a; }
    .tab.needs .tdot { animation: pulse 1.4s ease-in-out infinite; }
    .tab.needs.active { border-bottom-color: #a52a2a; }

    .lane.retired { opacity: .55; }
    /* While one lane is live, the others recede so the running one is the only
       thing reading as present-tense. */
    .lane { transition: opacity .35s ease; }
    .lane.dimmed { opacity: .55; }
    .lane .n {
      font-size: 10.5px;
      font-weight: 700;
      letter-spacing: .06em;
      color: var(--ink-muted);
      text-transform: uppercase;
    }
    .lane .nm { font-size: 15px; font-weight: 700; margin: 1px 0 8px; }
    .lane .when { font-size: 11px; color: var(--ink-muted); margin-top: 8px; }
    .lane .headline { font-size: 11.5px; color: var(--ink-2); margin-top: 6px; line-height: 1.45; }

    /* the inner 2-node pipeline every lane graph actually is */
    .nodes { display: flex; align-items: center; gap: 4px; margin-top: 9px; }
    .node {
      flex: 1;
      font-size: 9.5px;
      font-weight: 700;
      text-align: center;
      padding: 4px 2px;
      border-radius: 5px;
      background: #f0f1f3;
      color: var(--ink-muted);
      border: 1px solid var(--line);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .node.active {
      background: var(--accent-wash);
      color: #0b57c2;
      border-color: var(--accent);
      animation: pulse 1.4s ease-in-out infinite;
    }
    .node.ok { background: #e8f6e8; color: #067806; border-color: #c3e6c3; }
    .node.bad { background: #fbe9e9; color: #a52a2a; border-color: #f1c9c9; }
    .arrow { color: var(--ink-muted); font-size: 10px; flex: 0 0 auto; }

    /* expanded graph for the focused lane */
    .graph {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      padding: 4px 0 2px;
    }
    .gnode {
      border: 1px solid var(--line);
      background: #f7f8fa;
      border-radius: 8px;
      padding: 8px 13px;
      font-size: 12.5px;
      font-weight: 600;
    }
    .gnode.term { background: transparent; border-style: dashed; color: var(--ink-muted); font-weight: 500; }
    .gnode.active { background: var(--accent-wash); border-color: var(--accent); color: #0b57c2; }
    .gnode.ok { background: #e8f6e8; border-color: #c3e6c3; color: #067806; }
    .gnode.halt { background: #fbe9e9; border-color: #f1c9c9; color: #a52a2a; }
    .garrow { color: var(--ink-muted); font-size: 13px; }
    .ghalt { font-size: 11.5px; color: var(--ink-muted); margin-top: 8px; }

    /* ── pipeline view (automations that declare `pipeline`) ─────────────────
       Mike's spec (2026-08-11): step containers styled like the LinkedIn lane
       CARDS (status pill + description + processed counts + last-run line),
       arranged as THREE VERTICAL LANE COLUMNS you scroll down through, with
       the shared trunk fanning in at the top. Solid cards are graph-owned
       steps; dashed cards are judgment seams (a strategist plan on disk or a
       Mike gate) — the graphs never bridge a seam. */
    .pipe-trunkrow { display: flex; gap: 0; justify-content: center; flex-wrap: wrap; margin-bottom: 2px; }
    .pipe-trunkrow .pstep { flex: 0 1 252px; margin: 0; }
    /* Drawn flow arrows (Mike, 2026-08-11: the text glyphs were invisible —
       these are real diagram arrows: a 4px shaft + a solid head). */
    .flow { display: flex; justify-content: center; padding: 7px 0 13px; }
    .arrow-v { position: relative; width: 4px; height: 24px; background: #9aa1ab; border-radius: 2px; }
    .arrow-v::after {
      content: '';
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      bottom: -9px;
      border: 8px solid transparent;
      border-top: 10px solid #9aa1ab;
      border-bottom: 0;
    }
    .arrow-h { position: relative; width: 36px; height: 4px; background: #9aa1ab; border-radius: 2px; }
    .arrow-h::after {
      content: '';
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      right: -9px;
      border: 8px solid transparent;
      border-left: 10px solid #9aa1ab;
      border-right: 0;
    }
    .trunk-join { display: flex; align-items: center; padding: 0 6px 0 2px; }
    .fan-stub { width: 4px; height: 16px; background: #9aa1ab; margin: 0 auto; border-radius: 2px; }
    .fan-rail { height: 4px; background: #9aa1ab; width: 66.6%; margin: 0 auto; border-radius: 2px; }
    .pipe-fanarrows {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      padding: 0;
    }
    .pipe-fanarrows .flow { padding: 0 0 10px; }
    .pipe-cols { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; align-items: start; }
    @media (max-width: 900px) {
      .pipe-cols, .pipe-fanarrows { grid-template-columns: 1fr; }
      .fan-rail, .fan-stub { display: none; }
    }
    .pcol-h {
      font-size: 10.5px;
      font-weight: 700;
      letter-spacing: .06em;
      text-transform: uppercase;
      color: var(--ink-muted);
      padding: 2px 2px 8px;
    }
    .pcol-h b { display: block; font-size: 14.5px; letter-spacing: 0; text-transform: none; color: var(--ink); margin-top: 1px; }
    .pcol-h .dep { font-weight: 500; letter-spacing: 0; text-transform: none; }
    /* SQUARE tiles (Mike, 2026-08-11: system-design charts read better as
       squares than stacked rectangles). aspect-ratio sets the preferred shape;
       a card whose content is taller simply grows. Footer pins to the bottom
       so a square never looks half-empty. */
    .pstep {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 13px 14px;
      width: 100%;
      max-width: 252px;
      margin: 0 auto;
      aspect-ratio: 1 / 1;
      display: flex;
      flex-direction: column;
    }
    .pstep .st-foot { margin-top: auto; padding-top: 8px; }
    .pstep.is-live { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-wash); }
    .pstep.is-halt { border-color: #f1c9c9; }
    .pstep.seam { border-style: dashed; background: #fbfbfc; }
    .pstep .top { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
    .pstep .st-t { font-size: 13px; font-weight: 700; line-height: 1.3; }
    .pstep.dim .st-t { color: var(--ink-2); font-weight: 600; }
    .pstep .st-d { font-size: 11.5px; color: var(--ink-2); line-height: 1.45; margin-top: 4px; }
    .pstep .st-res { font-size: 12px; color: var(--ink); font-weight: 600; margin-top: 7px; font-variant-numeric: tabular-nums; }
    .pstep .st-when { font-size: 11px; color: var(--ink-muted); margin-top: 6px; }
    .seam-tag {
      flex: 0 0 auto;
      font-size: 9.5px;
      font-weight: 700;
      letter-spacing: .05em;
      color: var(--ink-2);
      background: #f0f1f3;
      border: 1px solid var(--line);
      border-radius: 9px;
      padding: 2px 7px;
      white-space: nowrap;
    }
    .seam-tag.graph { color: #0b57c2; background: var(--accent-wash); border-color: #c5dcfa; }
    .st-statusrow { display: flex; align-items: center; gap: 8px; margin-top: 6px; flex-wrap: wrap; }
    .st-statusrow .st-when { margin-top: 0; }
    .parrow { text-align: center; color: #c9ccd1; font-size: 14px; line-height: 1; padding: 5px 0; }

    /* ── sub-tabs (Now running | Architecture) ──────────────────────────── */
    .subtabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); margin-bottom: 18px; }
    .subtab {
      background: none; border: none; border-bottom: 2px solid transparent;
      cursor: pointer; padding: 9px 13px; font-size: 12.5px; font-weight: 600;
      color: var(--ink-muted); transition: color .15s;
    }
    .subtab:hover { color: var(--ink); }
    .subtab.active { color: var(--accent); border-bottom-color: var(--accent); }

    /* ── Architecture view: the real graphs, node for node ──────────────── */
    .arch-intro { font-size: 13px; color: var(--ink-2); line-height: 1.6; margin-bottom: 14px; }
    .arch-infra { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 10px; margin-bottom: 18px; }
    .arch-infra .card { padding: 11px 14px; }
    .arch-infra .t { font-size: 10.5px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-muted); margin-bottom: 4px; }
    .arch-infra .d { font-size: 12px; color: var(--ink-2); line-height: 1.55; }
    .arch-infra .d code, .agraph code {
      font-family: 'Cascadia Code', Consolas, monospace;
      font-size: 11px; background: #f0f1f3; border-radius: 4px; padding: 0 4px;
    }
    .agraph { margin-bottom: 14px; padding: 15px 17px; }
    .agraph .cmd {
      font-family: 'Cascadia Code', Consolas, monospace;
      font-size: 12.5px; font-weight: 600; color: var(--ink);
    }
    .agraph .sub2 { font-size: 12px; color: var(--ink-2); margin-top: 3px; line-height: 1.5; }
    .agraph .fd { font-size: 11.5px; color: var(--ink-2); margin-top: 8px; line-height: 1.55; }
    .agraph .fd b { color: var(--ink); }
    .achain { display: flex; align-items: center; gap: 5px; flex-wrap: wrap; row-gap: 8px; margin-top: 11px; }
    .an {
      font-family: 'Cascadia Code', Consolas, monospace;
      font-size: 11.5px; font-weight: 600;
      padding: 5px 9px; border-radius: 7px;
      border: 1px solid var(--line); background: var(--surface); color: var(--ink);
    }
    .an.v { background: #f7f8fa; color: var(--ink-2); font-weight: 500; }
    .an.term { background: transparent; border-style: dashed; color: var(--ink-muted); font-weight: 500; }
    .aedge {
      font-size: 10px; color: var(--ink-muted); border: 1px dashed var(--line);
      border-radius: 6px; padding: 2px 7px; font-style: italic;
    }
    .ahalt { font-size: 11px; color: #8a6100; margin-top: 9px; }
    .aio { font-size: 11.5px; color: var(--ink-2); margin-top: 7px; line-height: 1.55; }
    .aio b { color: var(--ink); font-weight: 600; }

    /* ── the OUTER graph: six graphs + seams as one flow chart ──────────── */
    .aflow-lane { position: relative; padding: 10px 0 4px 18px; }
    .aflow-fan { border-left: 3px solid #9aa1ab; margin-left: 22px; padding-top: 2px; }
    .aflow-lane::before {
      content: '';
      position: absolute;
      left: 0; top: 24px;
      width: 13px; height: 3px;
      background: #9aa1ab;
    }
    .aflow-lane .lbl {
      display: inline-block;
      font-size: 10.5px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase;
      color: var(--ink-2); background: #f0f1f3; border: 1px solid var(--line);
      border-radius: 5px; padding: 3px 8px; margin-bottom: 7px;
    }
    .agnode {
      font-family: 'Cascadia Code', Consolas, monospace;
      font-size: 12.5px; font-weight: 700;
      color: #0b57c2; background: var(--accent-wash);
      border: 1.5px solid var(--accent); border-radius: 8px;
      padding: 6px 11px; line-height: 1.25;
    }
    .agnode small { display: block; font-size: 9.5px; font-weight: 500; color: #4a7fc0; }
    .aseam {
      font-size: 11px; font-weight: 600; color: var(--ink-2);
      border: 1px dashed #b6bac1; border-radius: 8px;
      background: #fbfbfc; padding: 5px 10px; line-height: 1.3;
    }
    .aart { font-size: 10px; color: var(--ink-muted); font-style: italic; max-width: 150px; line-height: 1.3; text-align: center; }
    .gnode.seam {
      background: transparent;
      border-style: dashed;
      color: var(--ink-muted);
      font-weight: 500;
    }
    .gnode.past { background: #f0f1f3; border-color: var(--line); color: var(--ink-muted); }
    .pipe-legend { font-size: 11.5px; color: var(--ink-muted); margin-top: 14px; line-height: 1.6; }
    .pipe-legend .k { display: inline-block; border: 1px solid var(--line); border-radius: 5px; padding: 1px 7px; margin-right: 2px; font-size: 10.5px; font-weight: 600; }
    .pipe-legend .k.solid { background: var(--surface); }
    .pipe-legend .k.dash { border-style: dashed; background: transparent; }

    /* ── meter (single ratio against a limit) ────────────────────────────── */
    .kpi { display: flex; align-items: baseline; gap: 10px; }
    .kpi .hero { font-size: 44px; font-weight: 700; line-height: 1; }
    .kpi .of { font-size: 13px; color: var(--ink-2); }
    .meter {
      position: relative;
      height: 12px;
      background: var(--seq-100);
      border-radius: 6px;
      margin: 14px 0 6px;
      overflow: hidden;
    }
    .meter > i { display: block; height: 100%; background: var(--seq-450); border-radius: 6px; }
    .meter > i.over { background: var(--st-critical); }
    .meter-scale { display: flex; justify-content: space-between; font-size: 11px; color: var(--ink-muted); }
    .breakdown { margin-top: 12px; font-size: 12.5px; color: var(--ink-2); display: flex; gap: 16px; flex-wrap: wrap; }
    .breakdown b { color: var(--ink); font-variant-numeric: tabular-nums; }

    /* ── history table ───────────────────────────────────────────────────── */
    table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
    th {
      text-align: left;
      font-size: 10.5px;
      letter-spacing: .05em;
      text-transform: uppercase;
      color: var(--ink-muted);
      padding: 0 10px 8px 0;
      border-bottom: 1px solid var(--line);
      font-weight: 700;
    }
    td { padding: 9px 10px 9px 0; border-bottom: 1px solid #f0f1f3; vertical-align: top; color: var(--ink-2); }
    tr:last-child td { border-bottom: none; }

<script>
// ── config ──────────────────────────────────────────────────────────────────
// Mirrors linkedin-automation/graph/lane_graph.py. Each lane is its OWN 2-node
// StateGraph (work -> verify, plus a halt edge) — five graphs, not one five-node
// graph. Lane 1 is retired from the daily rotation per Mike (2026-08-01).
// THE AUTOMATION REGISTRY. One entry per LangGraph automation; LinkedIn is the
// first of what will be several. Adding another is one entry here plus its feed
// route in serve_dashboard.py — nothing below this block is LinkedIn-specific.
const AUTOMATIONS = [
  {
    id: 'linkedin',
    label: 'LinkedIn',
    sub: 'morning lanes',
    feed: { progress: '/linkedin/lane_progress.json', runs: '/linkedin/lane_runs.json' },
    // Each lane is its OWN 2-node StateGraph (work -> verify, plus a halt edge) —
    // five graphs, not one five-node graph. Lane 1 is retired from the daily
    // rotation per Mike (2026-08-01).
    lanes: [
      { n: 1, name: 'seed',    work: 'seed',    verify: 'verify_seed',    retired: true,  views: false },
      { n: 2, name: 'scrape',  work: 'scrape',  verify: 'verify_scrape',  retired: false, views: true  },
      { n: 3, name: 'invite',  work: 'invite',  verify: 'verify_invite',  retired: false, views: true  },
      { n: 4, name: 'check',   work: 'check',   verify: 'verify_check',   retired: false, views: false },
      { n: 5, name: 'endorse', work: 'endorse', verify: 'verify_endorse', retired: false, views: true  },
    ],
    // The rationed resource, per automation — what gets budgeted differs by
    // automation, and some will have none (omit `budget` and the section hides).
    budget: {
      title: 'Profile views today',
      field: 'profile_views',
      limit: 120,               // the ~120/24h level that restricted the account twice
      unit: 'profile views',
      note: 'the level that restricted this account twice',
      scale: '~120 / 24h',
    },
    // One line of "what did this run actually do", per lane.
    headline(run) {
      const s = run && run.summary;
      if (!s) return run && run.error ? clip(run.error, 90) : '';
      switch (run.lane) {
        case 1: return `+${s.new ?? 0} queued (${s.queue_after ?? '?'} total)`;
        case 2: return `${s.captured_delta ?? 0} captured · ${s.skipped_out_of_zone ?? 0} out of zone · ${s.errors ?? 0} err`;
        case 3: return `${s.sent ?? 0} sent · ${s.already_pending ?? 0} pending · ${s.errors ?? 0} err`;
        case 4: return s.nothing_to_check ? 'nothing to check'
                  : `${s.newly_connected_count ?? 0} new acceptance(s)`;
        case 5: return s.nothing_to_do ? 'nothing qualified'
                  : `${s.endorsed ?? 0} endorsed (${s.skills_endorsed ?? 0} skills) · ${s.dm_sent ?? 0} DM`;
        default: return '';
      }
    },
    // Per-lane "TODAY so far" across ALL of today's runs. The card headline only
    // describes the LAST run, which lies on a chunked day — 2026-08-05 the invite
    // card read "4 sent" (the final, reaper-killed chunk) while the day's 8 runs
    // had sent 21. Only lanes that batch across runs need this.
    dayline(laneN, todays) {
      if (laneN !== 3 || todays.length < 2) return null;
      let sent = 0, errs = 0;
      todays.forEach(r => { const s = r.summary || {}; sent += s.sent || 0; errs += s.errors || 0; });
      return `today: ${sent} sent across ${todays.length} runs${errs ? ` · ${errs} err` : ''}`;
    },
  },
  {
    id: 'livestream',
    label: 'Livestream',
    sub: 'one stream → 3 lanes · solid = graph-owned · dashed = judgment seam (strategist / Mike)',
    feed: { progress: '/livestream/lane_progress.json', runs: '/livestream/lane_runs.json' },
    // THE PIPELINE MAP (Mike's mental model, 2026-08-11): one starting point that
    // fans into the 3 content lanes, each lane a chain of step nodes. This is the
    // canonical CLAUDE.md pipeline drawn as a graph. `seg` + `node` key each solid
    // box to a graph segment (the `lane` field in the run log) and its work node,
    // so live state lights the exact node; dashed seams are agent/Mike territory
    // the graphs deliberately never bridge. The 6 graph SEGMENTS still exist
    // (history table below) — they are invocations, not lanes.
    pipeline: {
      trunk: [
        { seam: true, who: 'Mike', label: 'Livestream recording', after: 1,
          desc: 'the raw OBS .mkv in its named media folder (the folder names the batch)' },
        { seg: 1, node: 'encode', label: 'Encode the working master',
          desc: 're-encode to the ~0.65 Mbps "LOW BPS" 16:9 master every lane cuts from' },
      ],
      lanes: [
        { title: 'Lane 1 · longform', nodes: [
          { seg: 1, node: 'longform', label: 'Desilence the full stream',
            desc: 'cut every pause over 0.5s from the whole master (canonical desilencer)' },
          { seg: 1, node: 'queue', label: 'Stage + queue the longform',
            desc: 'copy to schedule-tweets/longform and append the longs.json entry' },
          { seam: true, who: 'Mike', label: 'Posting',
            desc: 'Rumble, BitChute, Facebook uploads; sequential, one at a time' },
        ]},
        { title: 'Lane 2 · vertical shorts', nodes: [
          { seg: 1, node: 'vertical', label: 'Verticalize',
            desc: 'build the 1080x1920 9:16 master the shorts are cut from' },
          { seg: 1, node: 'transcribe', label: 'Transcribe',
            desc: 'Whisper word-level JSON + the Kaspa/KRC20 STT glossary fixes' },
          { seg: 1, node: 'derive', label: 'Derive transcripts',
            desc: 'plain-text transcript + the 90-second chunk windows' },
          { seam: true, who: 'clip-strategist', label: 'Clip plan', after: 2,
            desc: 'the Fable strategist picks the shorts: topics, scatter-gather segments, peak beats (clip-plan.json)' },
          { seg: 2, node: 'cut', label: 'Cut the clips',
            desc: 'cut each clip’s segments from the vertical master and concat them' },
          { seam: true, who: 'Mike', label: '4b review', after: 3,
            desc: 'keep / kill / retitle each raw clip on the batch dashboard' },
          { seam: true, who: 'tighten-strategists', label: 'Tighten plan', after: 3,
            desc: 'one Fable strategist per clip authors the spoken-content removal spans + boundary relocks (tighten-plan.json)' },
          { seg: 3, node: 'tighten', label: 'Tighten + desilence (5B)',
            desc: 'apply the strategists’ cuts from the plan, then cut 0.25s+ pauses' },
          { seam: true, who: 'Mike', label: '2nd review', after: 4,
            desc: 'approve the tightened clips before anything renders' },
          { seg: 4, node: 'finish', label: 'Finish: 5C + render assets',
            desc: 'filler pass, fresh per-clip word JSON, GOP-safe spines staged for build' },
          { seam: true, who: 'remotion-builders', label: 'Phase 7 build', after: 5,
            desc: 'one remotion-builder agent per clip: captions, b-roll, SFX, render + gate' },
          { seg: 5, node: 'publish', label: 'Publish to the queue',
            desc: 'stage mp4s into shorts.json, md5-verify vs renders, persona-lint' },
          { seam: true, who: 'Mike', label: 'Posting',
            desc: 'X, IG, TikTok, YT (API), Rumble, BitChute, FB; sequential' },
        ]},
        { title: 'Lane 3 · text + image', dep: 'off Lane 2’s transcript', nodes: [
          { seam: true, who: 'orchestrator', label: 'Fact-check + drafting', after: 6,
            desc: 'the Claude session fact-checks topics and drafts copy + image prompts into the lane3 plan JSON' },
          { seg: 6, node: 'generate', label: 'Generate the images',
            desc: 'pooled ChatGPT browser, one item per invocation, refs last' },
          { seg: 6, node: 'queues', label: 'Append the queues',
            desc: 'idempotent writes to the 6 data/*.json queue files' },
          { seg: 6, node: 'lint', label: 'Persona-lint',
            desc: 'per-file persona/format gates on every touched queue' },
          { seg: 6, node: 'finalize', label: 'Finalize the batch',
            desc: 'batches.json flips pipelines.repurpose = done; visual-qa gates the images, then Mike reviews on Social' },
        ]},
      ],
    },
    staleNote: 'Check whether ffmpeg/whisper is still alive (Task Manager) before relaunching; a killed run resumes with --resume, skipping completed nodes.',
    // ONE graph = ONE mechanical segment of the pipeline (`nodes` lists the work
    // nodes; each has a verify_<name> after it). Wave 3+ segments (tighten,
    // finish, render, publish, lane3) get their own lane entries here as they
    // are built and blessed. Each segment ends at a judgment seam (a strategist
    // plan landing on disk, or a Mike gate) — the graphs never bridge a seam.
    lanes: [
      { n: 1, name: 'intake', work: 'intake', verify: 'verify',
        nodes: ['encode', 'longform', 'queue', 'vertical', 'transcribe', 'derive'],
        haltNote: 'halt edge: every node → END on a non-zero exit or a failed from-disk verify.',
        retired: false, views: false },
      { n: 2, name: 'cut', work: 'cut', verify: 'verify',
        nodes: ['cut', 'finalize'],
        haltNote: 'runs after clip-plan.json lands (clip-strategist seam); ends at Mike\'s Phase 4b dashboard review. Halt edge on every node.',
        retired: false, views: false },
      { n: 3, name: 'tighten', work: 'tighten', verify: 'verify',
        nodes: ['tighten', 'finalize'],
        haltNote: 'runs after Mike\'s 4b verdicts + tighten-plan.json land (tighten-strategist seam); --min-sil = Mike\'s per-batch 5B knob; ends at his 2nd review of the tightened clips. Halt edge on every node.',
        retired: false, views: false },
      { n: 4, name: 'finish', work: 'finish', verify: 'verify',
        nodes: ['fillers', 'transcribe', 'assets', 'finalize'],
        haltNote: 'runs after Mike\'s 2nd review (the invocation IS his approval record); 5C spans are judgment adjudicated into filler-plan.json BEFORE the run (no plan = passthrough). Ends at the builder frontier — Phase 7 stays with the remotion-builder agents. Halt edge on every node.',
        retired: false, views: false },
      { n: 5, name: 'publish', work: 'publish', verify: 'verify',
        nodes: ['publish', 'lint'],
        haltNote: 'runs after Mike gates the renders AND authorizes publish; hook/caption/tags land in publish-meta.json BEFORE the run. Stages the queue + md5-verifies staged copies vs CURRENT renders + persona-lints. POSTING stays Mike-gated, sequential. Halt edge on every node.',
        retired: false, views: false },
      { n: 6, name: 'repurpose', work: 'repurpose', verify: 'verify',
        nodes: ['generate', 'queues', 'lint', 'finalize'],
        haltNote: 'Lane 3 (Wave 6): runs after the drafting judgment lands in repurpose/output/<batch>-lane3-plan.json. Generates images via the ported Python browser stack (gen_images.py, pool-managed chats, chatgpt stage lock, one item per invocation), appends the 6 queue files (idempotent), persona-lints each touched file, flips batches.json pipelines.repurpose=done. Halt edge on every node.',
        retired: false, views: false },
    ],
    // THE ENGINEERING VIEW (Mike, 2026-08-11): the actual graphs, node for node,
    // accurate to the builder code in graph/*.py. Chain strings starting with
    // "verify_" render as verify nodes; {e:"..."} items render as edge labels.
    architecture: {
      // The OUTER graph (Mike, 2026-08-11): the six graphs + seams as ONE flow
      // chart. Box = a whole StateGraph; dashed = a judgment seam; italic edge
      // labels = the on-disk artifact that carries the dependency.
      flow: {
        trunk: [
          { seam: 'Mike records the stream' },
          { art: 'the raw .mkv in its media folder' },
          { g: 'INTAKE', sub: 'run.py · segment 1' },
        ],
        branches: [
          { title: 'Lane 1 · longform', chain: [
            { art: 'desilenced longform staged + longs.json entry' },
            { seam: 'POSTING · Mike (sequential)' },
          ]},
          { title: 'Lane 2 · vertical shorts', chain: [
            { art: 'VERTICAL master + word-level JSON + 90s chunks' },
            { seam: 'clip plan · clip-strategist' },
            { art: 'clip-plan.json' },
            { g: 'CUT', sub: 'run.py cut · segment 2' },
            { art: 'raw clips + batch dashboard' },
            { seam: '4b review · Mike' },
            { art: 'verdicts + retitles in clip-plan' },
            { seam: 'tighten plans · tighten-strategists' },
            { art: 'tighten-plan.json' },
            { g: 'TIGHTEN', sub: 'run.py tighten · segment 3' },
            { art: 'tightened + desilenced spines' },
            { seam: '2nd review · Mike' },
            { g: 'FINISH', sub: 'run.py finish · segment 4' },
            { art: 'render-assets: GOP spines + fresh word JSON' },
            { seam: 'Phase 7 · one remotion-builder per clip' },
            { art: 'gated renders · progress 7-built PASS' },
            { g: 'PUBLISH', sub: 'run.py publish · segment 5' },
            { art: 'shorts.json entries + staged, md5-verified mp4s' },
            { seam: 'POSTING · Mike (sequential)' },
          ]},
          { title: 'Lane 3 · text + image', chain: [
            { art: 'plain transcript' },
            { seam: 'fact-check + drafting · orchestrator' },
            { art: '<batch>-lane3-plan.json' },
            { g: 'REPURPOSE', sub: 'run.py repurpose · segment 6' },
            { art: 'images + 6 queue appends + lint + batches.json' },
            { seam: 'visual-qa gate, then review + posting · Mike' },
          ]},
        ],
      },
      intro: 'Six INDEPENDENT LangGraph StateGraphs, not one big graph. One invocation of run.py runs exactly one of them; every human decision rides IN the invocation (a flag, or an on-disk plan validated at the front door) — no interrupts. Each graph deliberately ENDS at a judgment seam: the next graph refuses to start until the seam artifact exists and validates. After every work node a verify_* node re-checks the result FROM DISK; every node routes to END on any failure. Zero retries by topology: one attempt per run, diagnose, re-invoke (--resume skips completed nodes via checkpoints).',
      infra: [
        { t: 'Entry point', d: 'python video-creation/livestream-repurpose/graph/run.py <segment> — segments: (default)=intake, cut, tighten, finish, publish, repurpose. Per-run flags: --batch, --resume, --thread, --stub ok|fail (structural test, no side effects), --test-sandbox DIR (real run against scratch).' },
        { t: 'State + resume', d: 'SqliteSaver checkpoints in graph/data/graph_checkpoints.sqlite, one thread per run (e.g. intake-<slug>-<yyyymmdd>). A killed run re-invoked with --resume continues its thread: completed nodes skip, the interrupted node re-runs WHOLE (every node is redo-safe).' },
        { t: 'Node execution', d: 'Work nodes shell the CANONICAL scripts as subprocesses via _run_streaming (intake_graph.py): stdout is teed live, PROGRESS n% lines map onto the heartbeat, exit codes decide the route. The graph owns control flow; the scripts own the work; no LLM anywhere in a graph.' },
        { t: 'Dashboard feeds', d: 'lane_progress.json = transient ~1 Hz heartbeat (lane, node, batch, pid, last_event) written during every node. lane_runs.json = append-only run history written once at END (status, duration, per-segment summary). This page polls both; nothing here can affect a run.' },
        { t: 'Front doors', d: 'Fail-fast validators live in the canonical scripts and are imported by run.py, checked BEFORE the graph starts: a bad plan dies in seconds, not after a 20-minute encode. The invocation banner is the approval record for any deviation (e.g. a non-default min-sil).' },
        { t: 'Judgment seams', d: 'clip-plan.json (clip-strategist) · 4b verdicts + retitles (Mike, in clip-plan) · tighten-plan.json (tighten-strategists) · 2nd review (Mike) · filler-plan.json (optional 5C) · Phase 7 builds (remotion-builder agents, agent territory by design) · publish-meta.json (orchestrator) · POSTING (Mike, sequential). The graphs never bridge one.' },
      ],
      graphs: [
        { cmd: 'run.py --source <recording> --min-sil N', name: 'INTAKE (segment 1) — Phase 1 + Lane 1 + Phase 1B + Phase 2',
          front_door: 'longform-meta.json validated (title/description/tags) · >=5 GB free disk · --min-sil required (Lane 1 longform convention: 0.5)',
          chain: ['encode', 'verify_encode', { e: '--skip-longform routes straight to vertical' }, 'longform', 'verify_longform', 'queue', 'verify_queue', 'vertical', 'verify_vertical', 'transcribe', 'verify_transcribe', 'derive', 'verify_derive'],
          consumes: 'the raw recording in its named media folder + longform-meta.json',
          produces: 'LOW BPS 16:9 master · desilenced longform staged + longs.json entry · 1080x1920 VERTICAL master · word-level Whisper JSON + glossary fixes · plain transcript + 90s chunk windows',
          ends: 'at the clip-strategist seam (Phase 3+ continues in the session off the on-disk artifacts)' },
        { cmd: 'run.py cut --batch <b>', name: 'CUT (segment 2) — Lane 2 Phase 4',
          front_door: 'clip-plan.json parsed into expected clips · vertical master geometry checked (1080x1920)',
          chain: ['cut', 'verify_cut', 'finalize', 'verify_finalize'],
          consumes: 'clip-plan.json (clip-strategist, Mike-gated) + the VERTICAL master',
          produces: 'per-clip cut mp4s (segments cut + concat, declicked) · batch dashboard.html · progress.json · batches.json registration',
          ends: 'at Mike 4b review (keep / kill / retitle, recorded in clip-plan four_b_verdicts)' },
        { cmd: 'run.py tighten --batch <b> [--min-sil N]', name: 'TIGHTEN (segment 3) — Phase 5 + 5B',
          front_door: 'validate_tighten_plan: voiced-content removal <=15% hard ceiling (measured vs Whisper words) · per-segment boundary_relock schema · spans inside segments · min-sil DEFAULTS to the canonical 0.25 in code; any other value prints a DEVIATION banner (the invocation is its record)',
          chain: ['tighten', 'verify_tighten', 'finalize', 'verify_finalize'],
          consumes: 'tighten-plan.json (one tighten-strategist per clip) + 4b-updated clip-plan.json + the master',
          produces: '-tightened spines (keep-spans cut from the MASTER, 8 ms declick) then -tightened-desilenced spines (dual-threshold RMS desilencer)',
          ends: 'at Mike 2nd review of the tightened clips' },
        { cmd: 'run.py finish --batch <b>', name: 'FINISH (segment 4) — Phase 5C + 6 + render assets',
          front_door: 'clip_directives.validate_directives: an UNSCOPED build directive refuses the Phase 7 handoff · validate_filler_plan (absent plan = all passthrough) · every clip at the post-2nd-review phase frontier',
          chain: ['fillers', 'verify_fillers', 'transcribe', 'verify_transcribe', 'assets', 'verify_assets', 'finalize', 'verify_finalize'],
          consumes: 'filler-plan.json (optional 5C adjudication) + the approved tightened spines (the invocation IS the 2nd-review approval record)',
          produces: 'final spines · fresh per-clip word-level Whisper JSON · GOP-safe (1 s keyframe) copies staged into the batch render-assets/',
          ends: 'at the BUILDER FRONTIER — Phase 7 stays with the remotion-builder agents by design' },
        { cmd: 'run.py publish --batch <b> [--date d]', name: 'PUBLISH (segment 5) — Phase 8',
          front_door: 'COMPLETENESS GATE: every clip must read phase 7-built with a PASS gate ("an mp4 on disk is not a completion signal") · --date dedupe (a batch already staged under another date refuses) · publish-meta.json + progress.json titles hard-validated (a wrong path would stage blank titles)',
          chain: ['publish', 'verify_publish', 'lint', 'verify_lint'],
          consumes: 'publish-meta.json (hooks/captions/tags) + progress.json (titles incl. 4b retitles) + the gated renders',
          produces: 'mp4s staged to schedule-tweets/shorts/<batch>-<date>/ (md5-verified against CURRENT renders) · shorts.json entries with all 7 platform blocks pending · per-file persona-lint',
          ends: 'POSTING stays Mike-gated and sequential, one poster at a time' },
        { cmd: 'run.py repurpose --batch <b>', name: 'REPURPOSE (segment 6) — Lane 3 text + image',
          front_door: 'queue_writer.validate_lane3_plan HARD gates: em/en dash anywhere · image-id uniqueness vs ALL queues + image dirs (the X 1:1 + IG 4:5 companion pair is the ONE sanctioned share; a plan own artifacts excluded so re-runs stay idempotent) · IG = Kaspa only · X polls only for kaspa/tao/toncoin · threads 5-8 tweets',
          chain: ['generate', 'verify_images', 'queues', 'verify_queues', 'lint', 'finalize', 'verify_finalize'],
          consumes: 'repurpose/output/<batch>-lane3-plan.json (session-drafted, fact-checked)',
          produces: 'images via the pooled ChatGPT browser stack (gen_images.py; chatgpt stage lock held for the stage; ONE item per invocation; refs last) · idempotent appends to the 6 data/*.json queues · per-file persona-lint · batches.json pipelines.repurpose=done',
          ends: 'visual-qa gates the images; Mike reviews the pending entries on the Social tab',
          note: 'Asymmetry is deliberate: verify_images is a subprocess stage (shared with hand runs) and lint has no verify twin (lint IS the verification).' },
      ],
    },
    headline(run) {
      const s = run && run.summary;
      if (!s) return run && run.error ? clip(run.error, 90) : '';
      if (run.lane === 6) {
        const im = s.images || {};
        return `${im.generated ?? 0} images (${im.verified ?? 0} verified) · `
             + `${s.entries_added ?? 0} entries queued · lint ${s.lint ?? '?'} · `
             + `Mike reviews on Social`
             + (s.fake_gen ? ' · FAKE GEN' : '')
             + (s.sandbox ? ' · SANDBOX' : '');
      }
      if (run.lane === 5) {
        return `${s.added ?? 0} queued / ${s.skipped ?? 0} present (date ${s.date ?? '?'}) · `
             + `md5 + lint ${s.lint ?? '?'} · POSTING stays Mike-gated`
             + (s.sandbox ? ' · SANDBOX' : '');
      }
      if (run.lane === 4) {
        return `${s.clips ?? 0} clips finished (${s.filler_cuts ?? 0} with 5C cuts) · `
             + `${Math.round(s.total_s || 0)}s total · ready for build`
             + (s.sandbox ? ' · SANDBOX' : '');
      }
      if (run.lane === 3) {
        return `${s.clips ?? 0} clips tightened+desilenced (min-sil ${s.min_sil ?? '?'}s) · `
             + `${Math.round(s.total_s || 0)}s total · at 2nd-review gate`
             + (s.sandbox ? ' · SANDBOX' : '');
      }
      if (run.lane === 2) {
        return `${s.clips ?? 0} clips cut · ${Math.round(s.total_s || 0)}s total · `
             + `${s.registered ? 'registered' : 'UNREGISTERED'} · at 4b gate`
             + (s.sandbox ? ' · SANDBOX' : '');
      }
      const lf = s.longform;
      const lfTxt = lf === 'skipped' ? 'longform skipped'
        : (lf && lf.queued_id ? `longform queued (${Math.round(lf.duration_s || 0)}s)` : 'longform ?');
      return `${Math.round(s.master_duration_s || 0)}s master · ${lfTxt} · `
           + `${s.words || 0} words${(s.flags || []).length ? ` · ▲ ${s.flags.length} glossary flag(s)` : ''}`
           + (s.sandbox ? ' · SANDBOX' : '');
    },
  },
];

const STALE_AFTER_S  = 90;    // a "running" heartbeat older than this was probably reaped
const POLL_MS        = 3000;

// Active tab, remembered across reloads and shareable via #hash.
let ACTIVE = (location.hash || '').replace('#', '')
          || localStorage.getItem('lgTab')
          || AUTOMATIONS[0].id;
if (!AUTOMATIONS.some(a => a.id === ACTIVE)) ACTIVE = AUTOMATIONS[0].id;
const A = () => AUTOMATIONS.find(x => x.id === ACTIVE) || AUTOMATIONS[0];
// id -> { prog, runs }. EVERY automation is polled, not just the visible one, so
// an inactive tab can still show that it is running or needs a human.
const FEEDS = {};

// ── helpers ─────────────────────────────────────────────────────────────────
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g,
  c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));

async function getJSON(url, fallback) {
  try {
    const r = await fetch(url + '?t=' + Date.now(), { cache: 'no-store' });
    if (!r.ok) return fallback;
    return await r.json();
  } catch { return fallback; }
}

const parseTs = s => { const d = new Date(s); return isNaN(d) ? null : d; };
function agoText(sec) {
  if (sec == null) return '';
  if (sec < 60) return Math.round(sec) + 's ago';
  if (sec < 3600) return Math.round(sec / 60) + 'm ago';
  if (sec < 86400) return Math.round(sec / 3600) + 'h ago';
  return Math.round(sec / 86400) + 'd ago';
}
function durText(s) {
  if (s == null) return '';
  if (s < 60) return s.toFixed(0) + 's';
  return Math.floor(s / 60) + 'm ' + Math.round(s % 60) + 's';
}
const secSince = iso => { const d = parseTs(iso); return d ? (Date.now() - d.getTime()) / 1000 : null; };
function clockText(iso) {
  const d = parseTs(iso);
  return d ? d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : '—';
}
function dayText(iso) {
  const d = parseTs(iso);
  if (!d) return '—';
  const today = new Date(); today.setHours(0, 0, 0, 0);
  return d >= today ? 'today' : d.toLocaleDateString([], { month: 'short', day: 'numeric' });
}
const isToday = iso => { const d = parseTs(iso); if (!d) return false;
  const t = new Date(); t.setHours(0,0,0,0); return d >= t; };

// Status -> {cls, icon, label}. Colour is NEVER the only signal: every pill
// carries an icon and a word.
function statusChip(status, stale) {
  if (stale) return { cls: 'stale', icon: '▲', label: 'stale' };
  switch (status) {
    case 'running':           return { cls: 'running', icon: '●', label: 'running' };
    case 'done':              return { cls: 'done',    icon: '✓', label: 'done' };
    case 'node_done':         return { cls: 'running', icon: '●', label: 'verifying' };
    case 'halted_restricted': return { cls: 'halted',  icon: '⛔', label: 'halted' };
    case 'failed':
    case 'node_failed':       return { cls: 'failed',  icon: '▲', label: 'failed' };
    case 'killed':            return { cls: 'halted',  icon: '⛔', label: 'killed' };
    case 'crashed':           return { cls: 'failed',  icon: '▲', label: 'crashed' };
    case 'awaiting_input':    return { cls: 'running', icon: '⏸', label: 'needs you' };
    default:                  return { cls: 'idle',    icon: '○', label: status || 'idle' };
  }
}
// A run that finished fine is HISTORY, not current state. Only a lane that is
// actually running — or one whose last run left an unresolved problem — earns a
// status colour; a past success renders neutral ("past"). Without this, a lane
// that finished this morning reads as present-tense next to a live one.
const RESOLVED_OK = new Set(['done', 'node_done']);
const pill = (s, stale, past) => {
  const c = statusChip(s, stale);
  const cls = (past && RESOLVED_OK.has(s)) ? 'past' : c.cls;
  return `<span class="pill ${cls}"><span class="dot">${c.icon}</span>${esc(c.label)}</span>`;
};

// "22m ago" while it is still fresh, else an absolute stamp.
function relText(iso) {
  const sec = secSince(iso);
  if (sec == null) return '';
  return sec < 3600 ? agoText(sec) : dayText(iso) + ' ' + clockText(iso);
}

// Truncate BEFORE escaping — slicing escaped text can cut an entity in half
// (`&amp;` -> `&am`) and emit broken markup.
function clip(s, n) {
  const t = String(s == null ? '' : s).split('\n')[0];
  return esc(t.length > n ? t.slice(0, n - 1).trimEnd() + '…' : t);
}

// A one-line "what did this run actually do", per lane.
// Delegates to the active automation's own summariser (see AUTOMATIONS).
function headline(run) {
  const f = A().headline;
  return f ? f(run) : (run && run.error ? clip(run.error, 90) : '');
}

// ── render: live strip ──────────────────────────────────────────────────────
function renderLive(prog, runs) {
  const el = $('live');
  const inFlight = prog && (prog.status === 'running' || prog.status === 'awaiting_input');
  const age = prog ? secSince(prog.updated_at) : null;
  const stale = inFlight && age != null && age > STALE_AFTER_S;

  if (!inFlight) {
    const last = runs.find(r => !r.stub) || runs[0];
    // Same day-aggregate as the lane cards: "Last: ... 4 sent" alone misreads as
    // the daily total on a chunked day.
    let dayTxt = null;
    if (last && A().dayline) {
      const todays = runs.filter(r => r.lane === last.lane && !r.stub && isToday(r.started_at));
      dayTxt = A().dayline(last.lane, todays);
    }
    el.innerHTML = `<div class="live">
      <div class="who">
        ${pill('idle')}
        <div class="lane-title">No run in flight</div>
        <div class="meta">${last
          ? `Last: Lane ${last.lane} ${esc(last.lane_name)} · ${dayText(last.started_at)} ${clockText(last.started_at)} · ${esc(headline(last))}${dayTxt ? ` · <b>${esc(dayTxt)}</b>` : ''}`
          : 'No runs recorded yet.'}</div>
      </div></div>`;
    return;
  }

  const pct = (prog.total ? Math.round(100 * (prog.index || 0) / prog.total) : null);
  el.innerHTML = `<div class="live">
    <div class="who">
      ${pill(prog.status, stale)}${prog.stub ? '<span class="stub-tag">STUB</span>' : ''}
      <div class="lane-title">Lane ${prog.lane} · ${esc(prog.lane_name || '')}</div>
      <div class="meta">
        node <b>${esc(prog.node || '')}</b>${prog.total ? ` · member ${prog.index || 0} of ${prog.total}` : ''}<br>
        started ${clockText(prog.started_at)} · updated ${agoText(age)}<br>
        ${prog.ok || 0} ok · ${prog.errors || 0} error(s)${prog.pid ? ` · pid ${prog.pid}` : ''}
      </div>
      ${pct != null ? `<div class="progbar"><i style="width:${pct}%"></i></div>` : ''}
    </div>
    <div class="event"><span class="lbl">last event</span>${esc(prog.last_event || '')}</div>
  </div>
  ${stale ? `<div class="warnbox">▲ <b>Stale heartbeat</b> — no update for ${agoText(age)}.
     A run this quiet is usually a background-task kill (the reaper has stopped runs
     mid-flight before). ${esc(A().staleNote || 'Check whether the process is still alive before relaunching: relaunching collides on the shared li-bot-profile Chrome.')}</div>` : ''}`;
}

// ── render: pipeline view (automations that declare `pipeline`) ─────────────
// LinkedIn-card-style STEP CONTAINERS (status pill + description + processed
// counts + last-run line) in three vertical lane columns, trunk fanning in at
// the top (Mike's spec, 2026-08-11). Only the CURRENT batch gets status; a
// step whose last run was an older batch renders dimmed with that batch named.
function renderPipeline(prog, runs) {
  const P = A().pipeline;
  const running = prog && prog.status === 'running' ? prog : null;
  const lastReal = runs.find(r => !r.stub);
  const curBatch = (running && (running.batch || running.requested))
                || (lastReal && ((lastReal.summary || {}).batch || lastReal.requested))
                || null;

  // Node order within a segment (for "already passed" vs "not yet" while live).
  const segNodes = {};
  (A().lanes || []).forEach(l => { segNodes[l.n] = l.nodes || [l.work]; });

  // Per-step "how many processed" line, derived from the owning segment's last
  // run summary (run records are per SEGMENT; each step shows the number that
  // is actually ABOUT it).
  const RES = {
    '1:encode':     s => s.master_duration_s ? `${Math.round(s.master_duration_s)}s master · ${s.master_mbps != null ? s.master_mbps + ' Mbps' : ''}` : '',
    '1:longform':   s => { const lf = s.longform; if (lf === 'skipped') return 'skipped this run'; return (lf && lf.duration_s) ? `${Math.round(lf.duration_s)}s staged · -${Math.round(lf.removed_s || 0)}s silence` : ''; },
    '1:queue':      s => { const lf = s.longform; return (lf && lf.queued_id) ? `queued ${lf.queued_id}` : ''; },
    '1:transcribe': s => s.words ? `${s.words} words${(s.flags || []).length ? ` · ${s.flags.length} glossary flag(s)` : ' · 0 flags'}` : '',
    '2:cut':        s => s.clips ? `${s.clips} clips cut · ${Math.round(s.total_s || 0)}s total` : '',
    '3:tighten':    s => s.clips ? `${s.clips} clips · min-sil ${s.min_sil}s · ${Math.round(s.total_s || 0)}s total` : '',
    '4:finish':     s => s.clips ? `${s.clips} clips · ${s.filler_cuts || 0} with 5C cuts` : '',
    '5:publish':    s => (s.added != null) ? `${s.added} queued / ${s.skipped || 0} already present` : '',
    '6:generate':   s => { const im = s.images || {}; return (im.generated != null) ? `${im.generated} generated · ${im.verified} verified` : ''; },
    '6:queues':     s => (s.entries_added != null) ? `${s.entries_added} entries added / ${s.entries_skipped || 0} present` : '',
    '6:lint':       s => s.lint ? `lint ${s.lint}` : '',
    '6:finalize':   () => 'batch registered · repurpose = done',
  };

  // Every card separates WHO owns the step (chip, top right: GRAPH for
  // machine-owned; MIKE / STRATEGIST / AGENTS / SESSION / SOURCE for judgment)
  // from the step's STATUS (pill in the footer, next to the timestamp).
  // A seam's status is INFERRED: the graph refuses to run without the seam's
  // artifact, so a current-batch run of the segment AFTER the seam proves the
  // seam is complete (`after` in the config names that downstream segment).
  const card = (cls, title, ownerTag, desc, res, pillHtml, when) => `<div class="${cls}">
      <div class="top"><span class="st-t">${esc(title)}</span><span class="seam-tag${ownerTag === 'GRAPH' ? ' graph' : ''}">${esc(ownerTag)}</span></div>
      ${desc ? `<div class="st-d">${esc(desc)}</div>` : ''}
      <div class="st-foot">
        ${res ? `<div class="st-res">${esc(res)}</div>` : ''}
        <div class="st-statusrow">${pillHtml}<span class="st-when">${esc(when)}</span></div>
      </div>
    </div>`;

  function stepCard(item) {
    const batchOf = r => ((r.summary || {}).batch || r.requested || null);
    if (item.seam) {
      const tag = (item.who || 'judgment').toUpperCase();
      const name = item.label;
      let pillHtml, when;
      if (item.after != null) {
        const dRun = runs.find(r => r.lane === item.after && !r.stub && curBatch
          && batchOf(r) === curBatch && RESOLVED_OK.has(r.status));
        if (dRun) { pillHtml = pill('done'); when = 'complete for this batch'; }
        else { pillHtml = pill('pending'); when = curBatch ? `not reached for ${curBatch} yet` : ''; }
      } else {
        pillHtml = pill('pending');
        when = 'runs after the pipeline finishes · tracked on the Social tab';
      }
      return card('pstep seam dim', name, tag, item.desc, '', pillHtml, when);
    }
    const last = runs.find(r => r.lane === item.seg && !r.stub);
    const isCur = last && curBatch && batchOf(last) === curBatch;
    const live = running && running.lane === item.seg;
    let cardCls = 'pstep', pillHtml = pill('idle'), when = 'no recorded run', res = '';

    if (live) {
      const seq = segNodes[item.seg] || [];
      const curNode = String(running.node || '').replace(/^verify_/, '');
      const ci = seq.indexOf(curNode), ni = seq.indexOf(item.node);
      if (curNode === item.node) { cardCls += ' is-live'; pillHtml = pill('running'); when = 'running now'; }
      else if (ci >= 0 && ni >= 0 && ni < ci) { pillHtml = pill('done'); when = 'done this run'; }
      else { pillHtml = pill('pending'); when = 'queued this run'; }
    } else if (last && isCur) {
      if (RESOLVED_OK.has(last.status)) {
        pillHtml = pill('done');
        when = `done ${relText(last.started_at)}`;
        const f = RES[`${item.seg}:${item.node}`];
        if (f) { try { res = f(last.summary || {}) || ''; } catch (e) { res = ''; } }
      } else {
        cardCls += ' is-halt';
        pillHtml = pill(last.status);
        when = relText(last.started_at);
      }
    } else if (last) {
      cardCls += ' dim';
      pillHtml = pill(last.status, false, true);
      when = `last ran on batch ${batchOf(last) || '?'} · ${relText(last.started_at)}`;
    } else {
      cardCls += ' dim';
      when = curBatch ? `not run for ${curBatch} yet` : 'no recorded run';
    }
    return card(cardCls, item.label, 'GRAPH', item.desc, res, pillHtml, when);
  }

  const col = L => {
    const bits = L.title.split('·');
    return `<div class="pcol">
      <div class="pcol-h">${esc((bits[0] || '').trim())}<b>${esc((bits[1] || '').trim())}</b>${L.dep ? `<span class="dep">${esc(L.dep)}</span>` : ''}</div>
      ${L.nodes.map(n => stepCard(n)).join('<div class="flow"><span class="arrow-v"></span></div>')}
    </div>`;
  };

  $('lanesTitle').textContent = 'Pipeline' + (curBatch ? ` — batch ${curBatch}` : '');
  $('lanes').style.display = 'block';
  $('lanes').innerHTML = `
    <div class="pipe-trunkrow">${P.trunk.map(n => stepCard(n, true)).join('<div class="trunk-join"><span class="arrow-h"></span></div>')}</div>
    <div class="fan-stub"></div>
    <div class="fan-rail"></div>
    <div class="pipe-fanarrows">
      <div class="flow"><span class="arrow-v"></span></div>
      <div class="flow"><span class="arrow-v"></span></div>
      <div class="flow"><span class="arrow-v"></span></div>
    </div>
    <div class="pipe-cols">${P.lanes.map(col).join('')}</div>
    <div class="pipe-legend">
      Top-right chip = WHO does the step: <span class="k dash">MIKE</span> you ·
      <span class="k dash">ORCHESTRATOR</span> the Claude session ·
      a NAMED AGENT (<span class="k dash">CLIP-STRATEGIST</span>, <span class="k dash">TIGHTEN-STRATEGISTS</span>,
      <span class="k dash">REMOTION-BUILDERS</span>) ·
      <span class="k solid" style="color:#0b57c2">GRAPH</span> = the LangGraph segment executes the step itself as code
      (the orchestrator only launches the run; your decisions ride in the invocation).
      Dashed cards are the judgment seams the graphs never bridge.
      Footer pill = that step's STATUS for the CURRENT batch (a seam reads done once the graph segment after it has run,
      since the graph refuses to start without the seam's artifact). A dimmed card names the older batch it last ran on.
      One attempt per run, halt edge on every node — never relaunch automatically.
    </div>`;

  // The focus card becomes the problem surface: the newest unresolved run whose
  // segment has not since completed a newer, resolved run.
  const bad = runs.find(r => !r.stub && !RESOLVED_OK.has(r.status)
    && !runs.some(r2 => r2.lane === r.lane && !r2.stub
                     && r2.started_at > r.started_at && RESOLVED_OK.has(r2.status)));
  const focusEl = $('focus');
  if (bad) {
    focusEl.style.display = '';
    focusEl.innerHTML = `<div class="warnbox ${bad.status === 'halted_restricted' ? 'crit' : ''}" style="margin-top:0">
      ▲ <b>Segment ${bad.lane} ${esc(bad.lane_name)} ${esc(bad.status)}</b>
      (${esc((bad.summary || {}).batch || bad.requested || '?')} · ${esc(relText(bad.started_at))}):
      ${clip(bad.error || 'no error text recorded', 240)}</div>`;
  } else {
    focusEl.style.display = 'none';
  }
}

// ── render: lane cards + focused graph ──────────────────────────────────────
function renderLanes(prog, runs) {
  if (A().pipeline) return renderPipeline(prog, runs);
  $('lanesTitle').textContent = 'Lanes';
  $('lanes').style.display = '';
  $('focus').style.display = '';
  const running = prog && prog.status === 'running' ? prog : null;
  const stale = running && secSince(running.updated_at) > STALE_AFTER_S;

  const LANES = A().lanes;
  $('lanes').innerHTML = LANES.map(L => {
    const last = runs.find(r => r.lane === L.n && !r.stub);
    const isRunning = running && running.lane === L.n;
    // Recency alone is NOT currency: a run that finished ten minutes ago is as
    // much history as one from last week, and must not read present-tense while
    // another lane is live. The one exception is an unresolved outcome (failed /
    // halted / killed) — that still needs a decision, so it keeps its colour
    // until the lane is run again.
    const unresolved = !!last && !RESOLVED_OK.has(last.status);
    let chipStatus = 'idle', past = false;
    if (isRunning)       { chipStatus = 'running'; }
    else if (unresolved) { chipStatus = last.status; }
    else if (last)       { chipStatus = last.status; past = true; }
    else if (L.retired)  { chipStatus = 'retired'; }

    // Inner 2-node pipeline: lit ONLY while live. A past success is neutral —
    // green here was the main thing making finished lanes look active.
    let w = 'node', v = 'node';
    if (isRunning) { w = 'node active'; }
    else if (unresolved) { w = 'node bad'; }

    // Live card shows live numbers; otherwise the previous run's summary. Showing
    // the old summary under a running lane would describe the wrong run.
    let headTxt;
    if (isRunning) {
      const bits = [];
      if (running.total) bits.push(`member ${Number(running.index) || 0} of ${Number(running.total) || 0}`);
      bits.push(`${Number(running.ok) || 0} ok`);
      if (running.errors) bits.push(`${Number(running.errors) || 0} err`);
      headTxt = esc(bits.join(' · '));
    } else if (last) { headTxt = esc(headline(last)); }
    else { headTxt = '<span style="color:#8a8d91">no recorded run</span>'; }

    const dim = !!running && !isRunning;

    // The day aggregate, when the automation defines one for this lane. The
    // headline above is one run's story; on a chunked day the daily total is
    // the number a human actually wants.
    const todays = runs.filter(r => r.lane === L.n && !r.stub && isToday(r.started_at));
    const dayTxt = A().dayline ? A().dayline(L.n, todays) : null;

    return `<div class="lane ${isRunning ? 'is-running' : ''} ${dim ? 'dimmed' : ''} ${L.retired && !isRunning ? 'retired' : ''}">
      <div class="n">Lane ${L.n}</div>
      <div class="nm">${esc(L.name)}</div>
      ${pill(chipStatus, isRunning && stale, past)}
      <div class="nodes">
        ${L.nodes
          ? `<span class="${w}">${esc(L.nodes[0])}</span><span class="arrow">→</span><span class="${w === 'node active' ? 'node' : w}">…</span><span class="arrow">→</span><span class="${v}">${esc(L.nodes[L.nodes.length - 1])}</span>`
          : `<span class="${w}">${esc(L.work)}</span><span class="arrow">→</span><span class="${v}">verify</span>`}
      </div>
      <div class="headline">${headTxt}</div>
      ${dayTxt ? `<div class="headline" style="color:var(--ink);font-weight:600">${esc(dayTxt)}</div>` : ''}
      <div class="when">${isRunning ? 'running now' : (last ? 'last run ' + esc(relText(last.started_at)) : '')}${L.retired ? ' · not in daily rotation' : ''}</div>
    </div>`;
  }).join('');

  // The expanded graph: whichever lane is running, else the most recent real run.
  const focusLane = running ? running.lane : (runs.find(r => !r.stub) || {}).lane;
  const L = A().lanes.find(x => x.n === focusLane);
  if (!L) { $('focus').innerHTML = '<div class="empty">No lane to show yet.</div>'; return; }
  const isRunning = running && running.lane === L.n;
  const last = runs.find(r => r.lane === L.n && !r.stub);
  const halted = !isRunning && last && (last.status === 'halted_restricted' || last.status === 'failed');

  const workCls = isRunning ? 'gnode active' : (halted ? 'gnode halt' : (last ? 'gnode ok' : 'gnode'));
  const verCls  = isRunning ? 'gnode' : (halted ? 'gnode' : (last ? 'gnode ok' : 'gnode'));

  $('focus').innerHTML = `
    <h2 style="margin-bottom:12px">Lane ${L.n} graph — ${esc(L.name)}${
      isRunning ? ' <span style="color:#0b57c2">(live)</span>'
                : (last ? ` <span style="color:#6b6e73;font-weight:400">(last run ${esc(relText(last.started_at))})</span>` : '')}</h2>
    <div class="graph">
      <span class="gnode term">START</span>
      ${L.nodes
        ? L.nodes.map(n => {
            const live = isRunning && running && (running.node === n || running.node === 'verify_' + n);
            const cls = live ? 'gnode active'
                      : (isRunning ? 'gnode' : (halted ? 'gnode halt' : (last ? 'gnode ok' : 'gnode')));
            return `<span class="garrow">→</span><span class="${cls}">${esc(n)}</span>`;
          }).join('')
        : `<span class="garrow">→</span><span class="${workCls}">${esc(L.work)}</span><span class="garrow">→</span><span class="${verCls}">${esc(L.verify)}</span>`}
      <span class="garrow">→</span>
      <span class="gnode term">END</span>
    </div>
    <div class="ghalt">⛔ ${L.haltNote ? esc(L.haltNote)
      : `halt edge: <code>${esc(L.work)}</code> → END on a restriction page,
      a kill-switch trip, or a non-zero exit.`} Retry count is zero by topology — one
      attempt per run, never relaunch automatically.</div>
    ${last && last.error ? `<div class="warnbox ${last.status === 'halted_restricted' ? 'crit' : ''}">
      ${last.status === 'halted_restricted' ? '⛔' : '▲'} <b>Last run ${esc(last.status)}:</b>
      ${clip(last.error, 240)}</div>` : ''}`;
}

// ── render: volume meter ────────────────────────────────────────────────────
function renderVolume(runs) {
  // An automation without a rationed resource simply has no budget section.
  const B = A().budget;
  $('volSection').style.display = B ? '' : 'none';
  if (!B) return;
  $('volTitle').textContent = B.title;

  const today = runs.filter(r => !r.stub && isToday(r.started_at));
  const perLane = {};
  let total = 0;
  today.forEach(r => {
    const v = r[B.field] || 0;
    if (!v) return;
    perLane[r.lane_name] = (perLane[r.lane_name] || 0) + v;
    total += v;
  });
  const pct = Math.min(100, Math.round(100 * total / B.limit));
  const over = total >= B.limit;
  const near = !over && total >= B.limit * 0.66;

  $('volume').innerHTML = `
    <div class="kpi">
      <span class="hero">${total}</span>
      <span class="of">of ~${B.limit} ${esc(B.unit)} · ${esc(B.note)}</span>
    </div>
    <div class="meter"><i class="${over ? 'over' : ''}" style="width:${pct}%"></i></div>
    <div class="meter-scale"><span>0</span><span>${esc(B.scale)}</span></div>
    <div class="breakdown">
      ${Object.keys(perLane).length
        ? Object.entries(perLane).map(([k, v]) => `<span>${esc(k)} <b>${v}</b></span>`).join('')
        : '<span style="color:#8a8d91">no view-consuming run recorded today</span>'}
    </div>
    ${over ? `<div class="warnbox crit">⛔ <b>At or past the restriction level.</b> Stop for the day.</div>`
      : near ? `<div class="warnbox">▲ <b>Two thirds of the way to the restriction level.</b>
                 Don't stack another big lane today.</div>` : ''}
    <div class="note">Counted from the run log, which only began recording on 2026-08-01 —
      Lane 2 scrape views were never dated anywhere on disk before that, so runs older than
      the log are not represented. Lane 1 (name search) and Lane 4 (one list page) cost
      ~0 views and are excluded by design.</div>`;
}

// ── render: history ─────────────────────────────────────────────────────────
function renderHistory(runs) {
  const showStubs = $('showStubs').checked;
  const rows = runs.filter(r => showStubs || !r.stub);
  if (!rows.length) {
    $('history').innerHTML = '<div class="empty">No runs recorded yet.</div>';
    return;
  }
  $('history').innerHTML = `<table>
    <thead><tr>
      <th>When</th><th>${A().pipeline ? 'Segment' : 'Lane'}</th><th>Status</th><th>Result</th>
      <th style="text-align:right">Views</th><th style="text-align:right">Took</th>
    </tr></thead>
    <tbody>${rows.map(r => `<tr>
      <td class="num" style="white-space:nowrap">${dayText(r.started_at)} ${clockText(r.started_at)}</td>
      <td class="lane-cell">${r.lane} ${esc(r.lane_name)}${r.stub ? `<span class="stub-tag">${esc(r.stub)}</span>` : ''}${r.dry_run ? '<span class="stub-tag">DRY</span>' : ''}${r.backfilled ? '<span class="stub-tag">BACKFILL</span>' : ''}</td>
      <td>${pill(r.status)}</td>
      <td>${esc(headline(r))}</td>
      <td class="num" style="text-align:right">${r.profile_views || 0}</td>
      <td class="num" style="text-align:right">${durText(r.duration_s)}</td>
    </tr>`).join('')}</tbody></table>`;
}

// ── render: tabs ────────────────────────────────────────────────────────────
// A tab's dot is the ONLY thing that makes an inactive automation visible. The
// whole point of this page is catching a run that needs a human, and that stops
// working the moment the interesting automation is the one you are not looking at.
function tabState(f) {
  if (!f) return { cls: 'idle', title: 'no data yet' };
  const p = f.prog, runs = f.runs || [];
  // An interrupt is the loudest thing this page reports: it BLOCKS a graph until
  // a human answers, so it gets a word, not just a coloured dot.
  if (p && p.status === 'awaiting_input')
    return { cls: 'attn', title: 'waiting for you', icon: '⏸', badge: 'needs you' };
  if (p && p.status === 'running') {
    const stale = secSince(p.updated_at) > STALE_AFTER_S;
    return stale ? { cls: 'warn', title: 'running but stale', icon: '▲', badge: 'stale' }
                 : { cls: 'running', title: 'running now' };
  }
  const last = runs.find(r => !r.stub);
  if (last && !RESOLVED_OK.has(last.status))
    return { cls: 'attn', title: 'last run ' + last.status, icon: '▲',
             badge: last.status === 'halted_restricted' ? 'halted' : 'failed' };
  return { cls: 'idle', title: last ? 'idle · last run ' + relText(last.started_at) : 'no runs yet' };
}

function renderTabs() {
  $('tabs').innerHTML = AUTOMATIONS.map(a => {
    const f = FEEDS[a.id];
    const st = tabState(f);
    const today = (f && f.runs || []).filter(r => !r.stub && isToday(r.started_at)).length;
    return `<button class="tab ${a.id === ACTIVE ? 'active' : ''} ${st.cls === 'attn' ? 'needs' : ''}"
              data-tab="${esc(a.id)}" title="${esc(a.label)} — ${esc(st.title)}">
      <span class="tdot ${st.cls}">${st.icon || '●'}</span>${esc(a.label)}
      ${st.badge ? `<span class="tcount ${st.cls}">${esc(st.badge)}</span>`
                 : (today ? `<span class="tcount">${today}</span>` : '')}
    </button>`;
  }).join('');
  $('sub').textContent = A().sub || '';
}

$('tabs').addEventListener('click', e => {
  const btn = e.target.closest('.tab');
  if (!btn || btn.dataset.tab === ACTIVE) return;
  ACTIVE = btn.dataset.tab;
  localStorage.setItem('lgTab', ACTIVE);
  history.replaceState(null, '', '#' + ACTIVE);
  paint();
});
window.addEventListener('hashchange', () => {
  const h = (location.hash || '').replace('#', '');
  if (h && AUTOMATIONS.some(a => a.id === h) && h !== ACTIVE) { ACTIVE = h; paint(); }
});

// ── sub-tabs: Now running | Architecture ────────────────────────────────────
let SUBTAB = localStorage.getItem('lgSubtab') || 'now';

// The engineering view's data: explicit `architecture` on the automation, or
// (LinkedIn) derived from its lanes config — each lane IS its own 2-node graph.
function archFor(a) {
  if (a.architecture) return a.architecture;
  if (!a.lanes || !a.lanes[0] || !a.lanes[0].verify) return null;
  return {
    intro: `${a.lanes.length} INDEPENDENT 2-node StateGraphs (work -> verify, plus a halt edge) — one per lane, not one ${a.lanes.length}-node graph. One invocation runs one lane (run.py --lane N [--max M]; the number IS the human decision, no interrupts). Same doctrine as every automation here: nodes wrap the canonical ported scripts as subprocesses, results are verified FROM DISK, halt topology with zero retries, SQLite checkpoints per thread.`,
    infra: [],
    graphs: a.lanes.map(L => ({
      cmd: `run.py --lane ${L.n}${L.views ? ' [--max N]' : ''}`,
      name: `LANE ${L.n} — ${L.name}${L.retired ? ' (retired from the daily rotation)' : ''}`,
      front_door: null,
      chain: [L.work, L.verify],
      consumes: null,
      produces: null,
      ends: null,
    })),
  };
}

function renderSubtabs() {
  const hasArch = !!archFor(A());
  if (SUBTAB === 'arch' && !hasArch) SUBTAB = 'now';
  $('subtabs').innerHTML = `
    <button class="subtab ${SUBTAB === 'now' ? 'active' : ''}" data-st="now">Now running</button>
    ${hasArch ? `<button class="subtab ${SUBTAB === 'arch' ? 'active' : ''}" data-st="arch">Architecture</button>` : ''}`;
}

$('subtabs').addEventListener('click', e => {
  const b = e.target.closest('.subtab');
  if (!b || b.dataset.st === SUBTAB) return;
  SUBTAB = b.dataset.st;
  localStorage.setItem('lgSubtab', SUBTAB);
  paint();
});

// ── render: Architecture (the actual graphs, node for node) ─────────────────
function renderArchitecture() {
  const AR = archFor(A());
  const el = $('arch');
  if (!AR) { el.innerHTML = '<div class="empty">No architecture data for this automation.</div>'; return; }
  const node = n => typeof n === 'object'
    ? `<span class="aedge">${esc(n.e)}</span>`
    : `<span class="an${n.startsWith('verify_') ? ' v' : ''}">${esc(n)}</span>`;
  const chain = c => `<div class="achain">
      <span class="an term">START</span><span class="garrow">→</span>
      ${c.map(node).join('<span class="garrow">→</span>')}
      <span class="garrow">→</span><span class="an term">END</span>
    </div>`;
  // the OUTER flow chart: graphs + seams + artifact-labeled edges, one picture
  const fnode = it => it.g
    ? `<span class="agnode">${esc(it.g)}<small>${esc(it.sub || '')}</small></span>`
    : it.seam
      ? `<span class="aseam">${esc(it.seam)}</span>`
      : `<span class="aart">${esc(it.art)}</span>`;
  const fchain = c => `<div class="achain">${c.map(fnode).join('<span class="garrow">→</span>')}</div>`;
  const flowHtml = AR.flow ? `<div class="card agraph">
      <div class="sub2"><b>THE OUTER GRAPH — one flow chart of all six graphs.</b>
        Blue boxes are whole StateGraphs (each opens up in its own card below); dashed boxes are the
        judgment seams; the small italic labels are the on-disk artifacts that carry each dependency —
        every graph's front door validates the artifact to its left before its first node runs.</div>
      <div class="achain" style="margin-top:12px">${AR.flow.trunk.map(fnode).join('<span class="garrow">→</span>')}</div>
      <div class="aflow-fan">
        ${AR.flow.branches.map(B => `<div class="aflow-lane">
          <div class="lbl">${esc(B.title)}</div>
          ${fchain(B.chain)}
        </div>`).join('')}
      </div>
    </div>` : '';
  el.innerHTML = `
    <div class="arch-intro">${esc(AR.intro || '')}</div>
    ${AR.flow ? `<div class="arch-intro" style="margin-top:-6px"><a href="flowchart.html" target="_blank" style="color:var(--accent);text-decoration:none;font-weight:600">Open the full decision flowchart (every node, edge and diamond, classic style) →</a></div>` : ''}
    ${flowHtml}
    ${AR.infra && AR.infra.length ? `<div class="arch-infra">${AR.infra.map(i =>
      `<div class="card"><div class="t">${esc(i.t)}</div><div class="d">${esc(i.d)}</div></div>`).join('')}</div>` : ''}
    ${AR.graphs.map(g => `<div class="card agraph">
      <div class="cmd">${esc(g.cmd)}</div>
      <div class="sub2"><b>${esc(g.name)}</b></div>
      ${g.front_door ? `<div class="fd"><b>Front door (pre-graph, in run.py):</b> ${esc(g.front_door)}</div>` : ''}
      ${chain(g.chain)}
      <div class="ahalt">⛔ halt edges: every node above also routes to END on a non-zero exit or a failed from-disk verify — zero retries by topology, one attempt per run.</div>
      ${g.consumes ? `<div class="aio"><b>Consumes:</b> ${esc(g.consumes)}</div>` : ''}
      ${g.produces ? `<div class="aio"><b>Produces:</b> ${esc(g.produces)}</div>` : ''}
      ${g.ends ? `<div class="aio"><b>Ends:</b> ${esc(g.ends)}</div>` : ''}
      ${g.note ? `<div class="aio"><b>Note:</b> ${esc(g.note)}</div>` : ''}
    </div>`).join('')}`;
}

// ── poll ────────────────────────────────────────────────────────────────────
// Paint from whatever is already in FEEDS — instant on a tab switch, no refetch.
function paint() {
  renderTabs();
  renderSubtabs();
  const arch = SUBTAB === 'arch' && !!archFor(A());
  $('secLive').style.display = arch ? 'none' : '';
  $('secPipe').style.display = arch ? 'none' : '';
  $('secHist').style.display = arch ? 'none' : '';
  $('secArch').style.display = arch ? '' : 'none';
  if (arch) { $('volSection').style.display = 'none'; renderArchitecture(); return; }
  const f = FEEDS[ACTIVE] || { prog: null, runs: [] };
  renderLive(f.prog, f.runs);
  renderLanes(f.prog, f.runs);
  renderVolume(f.runs);
  renderHistory(f.runs);
}

async function tick() {
  // EVERY automation is fetched, not just the visible one — that is what lets an
  // inactive tab report that it is running or waiting on you.
  await Promise.all(AUTOMATIONS.map(async a => {
    const [prog, runsRaw] = await Promise.all([
      getJSON(a.feed.progress, null),
      getJSON(a.feed.runs, []),
    ]);
    FEEDS[a.id] = {
      prog,
      runs: (Array.isArray(runsRaw) ? runsRaw : []).slice().reverse(),  // newest first
    };
  }));
  paint();
  $('refresh').textContent = 'updated ' + new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
}

$('showStubs').addEventListener('change', paint);
tick();
setInterval(tick, POLL_MS);
</script>
</body>
</html>
