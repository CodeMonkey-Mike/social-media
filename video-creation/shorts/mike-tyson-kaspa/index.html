<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Mike Tyson = Bitcoin — Kaspa Short</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@900&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

body {
  background:#050505;
  display:flex; justify-content:center; align-items:flex-start;
  min-height:100vh; overflow:hidden;
  font-family:'Montserrat', sans-serif;
}
.wrapper { position:relative; transform-origin:top left; }
.frame {
  width:1080px; height:1920px;
  background:#000; position:relative; overflow:hidden;
  transform-origin:top left;
}

/* ═══════════════════════════════════════
   PERSISTENT KASPA WATERMARK
═══════════════════════════════════════ */
.kas-watermark {
  position:absolute;
  top:18px; left:18px;
  width:110px; height:110px;
  border-radius:50%;
  z-index:300;
  filter:drop-shadow(0 0 12px rgba(0,229,255,.7)) drop-shadow(0 0 24px rgba(0,229,255,.4));
  animation:kasGlow 2.4s ease-in-out infinite alternate;
}
@keyframes kasGlow {
  from { filter:drop-shadow(0 0 8px rgba(0,229,255,.5)); }
  to   { filter:drop-shadow(0 0 20px rgba(0,229,255,.9)) drop-shadow(0 0 40px rgba(0,229,255,.4)); }
}
.kas-watermark img { width:100%; height:100%; border-radius:50%; object-fit:cover; }

/* ═══════════════════════════════════════
   B-ROLL ZONE — top 860px
═══════════════════════════════════════ */
.broll {
  position:absolute;
  top:0; left:0; right:0; height:860px;
  overflow:hidden; background:#000;
}

.br-panel {
  position:absolute; inset:0;
  opacity:0; transition:opacity .35s ease;
}
.br-panel.active { opacity:1; }

/* ── HOOK PANEL ── */
.br-hook {
  background:radial-gradient(ellipse 800px 500px at 50% 60%, rgba(0,50,40,.8) 0%, #000 70%);
  display:flex; flex-direction:column;
  align-items:center; justify-content:center;
  gap:50px; padding:80px 60px 60px;
  text-align:center;
}
.hook-kaspa-coin {
  width:260px; height:260px; border-radius:50%;
  overflow:hidden;
  box-shadow:0 0 50px rgba(0,229,255,.7), 0 0 100px rgba(0,229,255,.35);
  animation:coinSpin 6s ease-in-out infinite alternate;
  flex-shrink:0;
}
.hook-kaspa-coin img { width:100%; height:100%; object-fit:cover; }
@keyframes coinSpin {
  from { transform:rotate(-4deg) scale(1); }
  to   { transform:rotate(4deg) scale(1.04); }
}
.hook-question {
  font-size:82px; font-weight:900; color:#fff;
  text-transform:uppercase; line-height:1.05;
  text-shadow:4px 4px 0 rgba(0,0,0,.7);
}
.hook-question em { font-style:normal; color:#39ff14; text-shadow:0 0 20px rgba(57,255,20,.6),4px 4px 0 rgba(0,0,0,.7); }
.hook-sub {
  font-size:52px; font-weight:900; color:rgba(0,229,255,.85);
  text-transform:uppercase; letter-spacing:2px;
}

/* ── IMAGE PANELS ── */
.br-img {
  position:absolute; inset:0;
  display:flex; align-items:center; justify-content:center;
}
.br-img img.fullbleed {
  width:100%; height:100%; object-fit:cover; object-position:center top;
}

.br-tyson-wrap { position:relative; width:100%; height:100%; }
.br-tyson-wrap .coin-badge {
  position:absolute; bottom:0; left:0; right:0;
  background:linear-gradient(180deg, transparent 0%, rgba(0,0,0,.92) 60%);
  padding:30px 40px 40px;
  display:flex; align-items:center; justify-content:center; gap:28px;
}
.br-tyson-wrap .badge-coin {
  width:120px; height:120px; border-radius:50%; overflow:hidden;
  box-shadow:0 0 30px rgba(247,147,26,.7);
  flex-shrink:0;
}
.br-tyson-wrap .badge-coin img { width:100%; height:100%; object-fit:cover; }
.br-tyson-wrap .badge-label {
  font-size:72px; font-weight:900; color:#f7931a;
  text-transform:uppercase; letter-spacing:2px;
  text-shadow:0 0 20px rgba(247,147,26,.6), 3px 3px 0 rgba(0,0,0,.8);
}

.br-knockout-wrap { position:relative; width:100%; height:100%; }
.br-knockout-wrap .ko-overlay {
  position:absolute; bottom:0; left:0; right:0;
  background:linear-gradient(180deg, transparent 0%, rgba(0,0,0,.9) 60%);
  padding:20px 40px 36px;
  display:flex; align-items:center; justify-content:center; gap:24px;
}
.br-knockout-wrap .ko-eth-coin {
  width:100px; height:100px; border-radius:50%; overflow:hidden;
  box-shadow:0 0 28px rgba(140,80,220,.8);
  flex-shrink:0;
}
.br-knockout-wrap .ko-eth-coin img { width:100%; height:100%; object-fit:cover; }
.br-knockout-wrap .ko-label {
  font-size:58px; font-weight:900; color:#c8b2f8;
  text-transform:uppercase;
  text-shadow:0 0 16px rgba(140,80,220,.6), 3px 3px 0 rgba(0,0,0,.8);
}
.br-knockout-wrap .ko-arrow {
  font-size:52px; color:#ff4444;
  text-shadow:0 0 16px rgba(255,60,60,.7);
}

/* ── VS PANELS ── */
.br-vs {
  background:#000;
  display:flex; align-items:center; justify-content:center;
  gap:0; padding:40px 30px;
}
.vs-col {
  display:flex; flex-direction:column;
  align-items:center; gap:22px;
  flex:1;
  opacity:0; transform:translateX(var(--tx, 0));
  transition:opacity .5s ease, transform .5s cubic-bezier(.22,1,.36,1);
}
.vs-col.show { opacity:1; transform:translateX(0); }
.vs-col.winner { animation:winnerPulse 1.6s ease-in-out infinite; }
@keyframes winnerPulse {
  0%,100%{ transform:scale(1); }
  50%{ transform:scale(1.05); }
}

.vs-coin-img {
  width:260px; height:260px; border-radius:50%; overflow:hidden;
}
.vs-coin-img img { width:100%; height:100%; object-fit:cover; }

.vs-label {
  font-size:60px; font-weight:900; text-transform:uppercase;
  letter-spacing:3px;
  text-shadow:0 0 16px var(--clr), 3px 3px 0 rgba(0,0,0,.8);
  color:var(--clr);
}
.vs-col.kas  { --tx:-60px; }
.vs-col.eth  { --tx:60px;  }
.vs-col.btc  { --tx:60px;  }
.vs-col.kas  .vs-label { --clr:#39ff14; }
.vs-col.eth  .vs-label { --clr:#c8b2f8; }
.vs-col.btc  .vs-label { --clr:#f7931a; }
.vs-col.kas  .vs-coin-img { box-shadow:0 0 50px rgba(0,229,255,.65); }
.vs-col.eth  .vs-coin-img { box-shadow:0 0 50px rgba(140,80,220,.65); }
.vs-col.btc  .vs-coin-img { box-shadow:0 0 50px rgba(247,147,26,.65); }

.vs-arrow-col {
  display:flex; align-items:center; justify-content:center;
  padding:0 10px; flex-shrink:0;
  opacity:0; transform:scale(0);
  transition:opacity .35s .25s ease, transform .35s .25s ease;
}
.vs-arrow-col.show { opacity:1; transform:scale(1); }
.vs-arrow-col .arr {
  font-size:88px; line-height:1;
  color:#39ff14;
  text-shadow:0 0 24px rgba(57,255,20,.7);
}

.vs-col.loser .vs-coin-img {
  filter:grayscale(.7) brightness(.6);
  box-shadow:none !important;
}
.vs-col.loser .vs-label { opacity:.45; }

/* ═══════════════════════════════════════
   DIVIDER
═══════════════════════════════════════ */
.divider {
  position:absolute; top:860px; left:0; right:0;
  height:3px;
  background:linear-gradient(90deg, transparent, #39ff14 20%, #39ff14 80%, transparent);
  box-shadow:0 0 14px rgba(57,255,20,.65);
  z-index:10;
}

/* ═══════════════════════════════════════
   CAPTION BAND  — caption1 style
   Montserrat Black, 200px, lowercase
   white fill, black stroke 14px
═══════════════════════════════════════ */
.caption-band {
  position:absolute; top:863px; left:0; right:0;
  height:140px;
  background:linear-gradient(180deg, rgba(0,0,0,.88) 0%, rgba(0,0,0,.97) 100%);
  display:flex; align-items:center; justify-content:center;
  padding:0 44px; z-index:20;
  overflow:hidden;
}

@keyframes captionBounce {
  0%   { transform: scale(0.70); }
  55%  { transform: scale(1.10); }
  100% { transform: scale(1.00); }
}

#caption {
  font-family: 'Montserrat', sans-serif;
  font-weight: 900;
  font-size: 72px;
  color: #fff;
  text-transform: lowercase;
  text-align: center;
  letter-spacing: 0.08em;
  line-height: 1.1;
  -webkit-text-stroke: 4px #000;
  paint-order: stroke fill;
  display: block;
  width: 100%;
  white-space: nowrap;
}
#caption.bounce {
  animation: captionBounce 0.4s cubic-bezier(0.22, 1, 0.36, 1) forwards;
}

/* accent colors — keep fill, stroke stays black via inheritance */
#caption .g  { color:#39ff14; }
#caption .o  { color:#f7931a; }
#caption .p  { color:#c8b2f8; }
#caption .r  { color:#ff4444; }

/* ═══════════════════════════════════════
   FACE-CAM  — starts below caption band
═══════════════════════════════════════ */
.facecam {
  position:absolute;
  top:1003px; left:0; right:0; bottom:240px;
  overflow:hidden; background:#0a0808;
}
.facecam video {
  width:100%; height:100%;
  object-fit:cover; object-position:center center;
  display:block;
}

/* ═══════════════════════════════════════
   KAS CHART PANEL
═══════════════════════════════════════ */
.br-chart-wrap { position:relative; width:100%; height:100%; }
.br-chart-wrap img.fullbleed {
  width:100%; height:100%; object-fit:cover; object-position:center;
}
.chart-overlay {
  position:absolute; bottom:0; left:0; right:0;
  background:linear-gradient(180deg, transparent 0%, rgba(0,0,0,.92) 55%);
  padding:22px 36px 30px;
  display:flex; align-items:center; gap:22px;
}
.chart-kas-badge {
  width:82px; height:82px; border-radius:50%; overflow:hidden; flex-shrink:0;
  box-shadow:0 0 24px rgba(0,229,255,.75);
}
.chart-kas-badge img { width:100%; height:100%; object-fit:cover; }
.chart-target-label {
  font-size:88px; font-weight:900; color:#39ff14; line-height:1;
  text-shadow:0 0 20px rgba(57,255,20,.7), 3px 3px 0 rgba(0,0,0,.8);
}
.chart-target-label span {
  display:block; font-size:44px; color:rgba(57,255,20,.75); line-height:1.1;
}
.chart-arrow-up {
  font-size:96px; color:#39ff14; line-height:1; margin-left:auto;
  text-shadow:0 0 30px rgba(57,255,20,.85);
  animation:arrowFloat .7s ease-in-out infinite alternate;
}
@keyframes arrowFloat {
  from { transform:translateY(0); }
  to   { transform:translateY(-14px); }
}

/* ═══════════════════════════════════════
   FULL-SCREEN B-ROLL STATE
═══════════════════════════════════════ */
.frame.fullbroll .broll    { height:1680px; z-index:30; }
.frame.fullbroll .divider  { opacity:0; }
.frame.fullbroll .facecam  { opacity:0; }
.frame.fullbroll .caption-band {
  top:auto !important; bottom:260px;
  background:transparent; z-index:40;
}

/* ═══════════════════════════════════════
   FULL-SCREEN FACE STATE
═══════════════════════════════════════ */
.frame.fullface .broll    { opacity:0; pointer-events:none; }
.frame.fullface .divider  { opacity:0; }
.frame.fullface .facecam  { top:0; }
.frame.fullface .caption-band {
  top:auto !important; bottom:300px;
  background:transparent; z-index:40;
}

/* ═══════════════════════════════════════
   FACE-ZONE OVERLAY — BTC BADGE
═══════════════════════════════════════ */
.face-btc-badge {
  position:absolute;
  top:1003px; left:0; right:0; bottom:240px;
  display:flex; align-items:center; justify-content:center;
  z-index:150; pointer-events:none;
  opacity:0; transition:opacity .3s ease;
}
.face-btc-badge.show { opacity:1; }
.face-btc-badge .btc-coin {
  width:220px; height:220px; border-radius:50%; overflow:hidden;
  box-shadow:0 0 60px rgba(247,147,26,.85), 0 0 120px rgba(247,147,26,.45);
  animation:btcPulse .75s ease-in-out infinite alternate;
}
.face-btc-badge .btc-coin img { width:100%; height:100%; object-fit:cover; }
@keyframes btcPulse {
  from { transform:scale(1);    box-shadow:0 0 40px rgba(247,147,26,.65); }
  to   { transform:scale(1.08); box-shadow:0 0 90px rgba(247,147,26,.95); }
}

/* ═══════════════════════════════════════
   PLAY OVERLAY
═══════════════════════════════════════ */
.play-overlay {
  position:absolute; inset:0;
  background:rgba(0,0,0,.75);
  display:flex; flex-direction:column;
  align-items:center; justify-content:center; gap:32px;
  z-index:500; cursor:pointer;
}
.play-btn {
  width:150px; height:150px; border-radius:50%;
  background:#39ff14;
  display:flex; align-items:center; justify-content:center;
  box-shadow:0 0 50px rgba(57,255,20,.6);
}
.play-btn::after {
  content:'';
  border-left:62px solid #000;
  border-top:38px solid transparent;
  border-bottom:38px solid transparent;
  margin-left:14px;
}
.play-overlay p {
  font-size:54px; font-weight:900; color:#fff;
  text-transform:uppercase; letter-spacing:3px;
}
</style>
</head>
<body>
<div class="wrapper" id="wrapper">
<div class="frame" id="frame">

  <!-- KASPA WATERMARK -->
  <div class="kas-watermark">
    <img src="../../assets/logo-kaspa.png" alt="Kaspa" />
  </div>

  <!-- B-ROLL -->
  <div class="broll">

    <div class="br-panel active" id="br-hook">
      <div class="br-hook">
        <div class="hook-kaspa-coin">
          <img src="../../assets/logo-kaspa.png" alt="Kaspa" />
        </div>
        <div class="hook-question">

    <div class="br-panel br-img" id="br-tyson">

        <div class="vs-coin-img"><img src="../../assets/logo-kaspa.png" alt="KAS" /></div>
        <div class="vs-label">$KAS</div>
      </div>
      <div class="vs-arrow-col" id="va-kas-eth"><div class="arr">&#9654;</div></div>
      <div class="vs-col eth" id="vc-eth-2" style="--tx:60px">
        <div class="vs-coin-img"><img src="../../assets/logo-eth.png" alt="ETH" /></div>
        <div class="vs-label">ETH</div>
      </div>
    </div>

  </div><!-- .broll -->

  <div class="divider"></div>

  <!-- CAPTION BAND -->
  <div class="caption-band">
    <div id="caption"></div>
  </div>

  <!-- FACE-CAM -->
  <div class="facecam">
    <video id="vid"
      src="../../assets/tyson-facecam-cut.mp4"
      playsinline preload="auto">
    </video>
  </div>

  <!-- FACE-ZONE BTC BADGE OVERLAY -->
  <div class="face-btc-badge" id="face-btc-badge">
    <div class="btc-coin">
      <img src="../../assets/logo-btc.png" alt="Bitcoin" />
    </div>
  </div>

  <!-- PLAY OVERLAY -->
  <div class="play-overlay" id="play-overlay">
    <div class="play-btn"></div>
    <p>Tap to play</p>
  </div>

</div>
</div>

<script>
function scaleFrame() {
  const f = document.getElementById('frame');
  const w = document.getElementById('wrapper');
  const s = window.innerHeight / 1920;
  f.style.transform = `scale(${s})`;
  f.style.transformOrigin = 'top left';
  w.style.width  = (1080 * s) + 'px';
  w.style.height = (1920 * s) + 'px';
}
scaleFrame();
window.addEventListener('resize', scaleFrame);

      delay('va-eth-btc', 320, 'show');

        document.getElementById(id)?.classList.remove('show','winner','loser');

    onEnter() {

const FULLFACE_EVENTS     = [{ start: 46.90, end: 48.90 }];
const FACE_OVERLAY_EVENTS = [{ start: 20.98, end: 23.00, id: 'face-btc-badge' }];

const SOUND_EVENTS = [
  { t:  0.00, src: '../../assets/sfx/Riser Sound Effect.mp3' },                       // hook opener
  { t: 12.64, src: '../../assets/sfx/TING SOUND EFFECT.mp3' },                        // boxing bell — Tyson panel
  { t: 20.98, src: '../../assets/sfx/Cash Register.mp3' },                             // "that's bitcoin" — cha-ching
  { t: 32.04, src: '../../assets/sfx/Boom - Big Reveal.wav' },                         // Buster Douglas full-screen
  { t: 43.48, src: '../../assets/sfx/Punch 1.mp3' },                                   // "knocked out"
  { t: 46.90, src: '../../assets/sfx/WAIT WHAT  SOUND EFFECT.mp3' },                  // "holy crap" full-screen face
  { t: 68.72, src: '../../assets/sfx/Cinematic Whoosh 02.wav' },                       // ETH vs BTC panel
  { t: 91.04, src: '../../assets/sfx/Cash Register Kaching  Sound Effect HD.mp3' },   // KAS chart appears
];

const _sfxCache = {};
SOUND_EVENTS.forEach(e => {
  const a = new Audio(e.src);
  a.preload = 'auto';
  _sfxCache[e.src] = a;
});
const _firedSfx = new Set();

let activePanelId = 'br-hook';
let activeBrollIdx = 0;

function switchPanel(cue) {
  if (cue.panel === activePanelId) return;
  const prev = BROLL[activeBrollIdx];
  if (prev?.onLeave) prev.onLeave();
  document.getElementById(activePanelId)?.classList.remove('active');
  activePanelId = cue.panel;
  activeBrollIdx = BROLL.indexOf(cue);
  document.getElementById(cue.panel)?.classList.add('active');
  if (cue.onEnter) setTimeout(cue.onEnter, 40);
}

const captionEl = document.getElementById('caption');
let lastCapHtml = '';

function setCaption(h) {
  captionEl.innerHTML = h;
  captionEl.classList.remove('bounce');
  void captionEl.offsetWidth; /* force reflow to restart animation */
  captionEl.classList.add('bounce');
}

function tick() {
  const t     = document.getElementById('vid').currentTime;
  const frame = document.getElementById('frame');

  // B-roll panel switching
  for (let i = BROLL.length - 1; i >= 0; i--) {
    if (t >= BROLL[i].t) {
      if (BROLL[i].panel !== activePanelId) switchPanel(BROLL[i]);
      break;
    }
  }

  // Full-screen states
  frame.classList.toggle('fullbroll', FULLBROLL_EVENTS.some(e => t >= e.start && t < e.end));
  frame.classList.toggle('fullface',  FULLFACE_EVENTS.some(e  => t >= e.start && t < e.end));

  // Face-zone overlays
  FACE_OVERLAY_EVENTS.forEach(e => {
    document.getElementById(e.id)?.classList.toggle('show', t >= e.start && t < e.end);
  });

  // Sound effects — fire once per timestamp, reset on seek
  SOUND_EVENTS.forEach(e => {
    const key = String(e.t);
    if (t >= e.t && t < e.t + 0.5 && !_firedSfx.has(key)) {
      _firedSfx.add(key);
      const a = _sfxCache[e.src];
      if (a) { a.currentTime = 0; a.play().catch(() => {}); }
    }
  });

  // Captions
  let h = '';
  for (let i = CAPTIONS.length - 1; i >= 0; i--) {
    if (t >= CAPTIONS[i].t) { h = CAPTIONS[i].h; break; }
  }
  if (h !== lastCapHtml) {
    lastCapHtml = h;
    setCaption(h);
  }

  requestAnimationFrame(tick);
}

document.getElementById('play-overlay').addEventListener('click', () => {
  document.getElementById('vid').play();
  document.getElementById('play-overlay').style.display = 'none';
  requestAnimationFrame(tick);
});

document.getElementById('vid').addEventListener('seeked', () => {
  const ct = document.getElementById('vid').currentTime;
  for (const key of [..._firedSfx]) {
    if (parseFloat(key) > ct) _firedSfx.delete(key);
  }
});
