<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>clip-evals chart: pipeline (intake, lane-1, lanes-2-3, queues)</title>
<!--
  SYSTEM-DESIGN CHART, full-frame cover, 1920x1080, 4 states. Spec: ../../CARDS-SPEC.md section 3, "pipeline".
  Used in SCRIPT.md CH3: "A livestream comes in, and the first step re-encodes it, makes a vertical version and
  transcribes it." (intake) / "From that transcript the work fans out into 3 lanes. Lane 1 is the long-form video."
  (lane-1) / "Lane 2 is the vertical shorts ... Lane 3 is text and images" (lanes-2-3) / "Everything lands in queues,
  and separate scripts post from those queues. Today we care about lane 2." (queues)
  Layout: one left-to-right flow, the 3 lanes stacked in the middle column. The whole system is on screen in every
  state; an arrow lights with the node it points into (the spec's "fan-out" = the 3 branch arrows).
  Shoot: python ../shoot.py pipeline.html --out ../../diagrams
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400;1,500&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="chart.css">
<style>
.ichips{display:flex;flex-direction:column;gap:12px;margin-top:22px;align-items:center}
.ichips .chip{width:226px}
.lane{display:flex;flex-direction:column;justify-content:center;padding:0 34px}
.lane .st{margin-top:8px}
.lico{position:absolute;right:38px;top:47px}
/* lane 2 in the last state: TODAY's lane */
.node.today{border-color:var(--accent-gold);box-shadow:0 0 0 1px rgba(255,215,0,.24),0 0 40px rgba(255,215,0,.16)}
.node.today .tt{color:var(--text-primary)}
.today-tag{background:var(--accent-gold);color:var(--bg-deep)}
</style>
</head>
<body>
<template id="chart">
<div class="stage">
  <div class="orb" style="width:640px;height:640px;background:var(--accent-cyan);opacity:.12;left:-300px;top:-320px"></div>
  <div class="orb" style="width:620px;height:620px;background:var(--accent-green);opacity:.06;left:1520px;top:760px"></div>

  <div class="head"><h1>From a livestream to the queues</h1><div class="divider"></div></div>

  <svg class="wires" width="1920" height="1080" viewBox="0 0 1920 1080">
    <path class="wr" data-k="w-ls-in" d="M352,620 L404,620"/>
    <!-- the fan-out: one branch per lane (lane 1 first, so lit branches 2 and 3 draw over it) -->
    <path class="wr" data-k="fan b1" d="M692,620 C756,620 744,390 804,390"/>
    <path class="wr" data-k="fan b2" d="M692,620 L804,620"/>
    <path class="wr" data-k="fan b3" d="M692,620 C756,620 744,850 804,850"/>
    <!-- the fan-in: every lane lands in the queues -->
    <path class="wr nohead" data-k="fanin" d="M1262,390 C1316,390 1300,620 1344,620"/>
    <path class="wr nohead" data-k="fanin" d="M1262,620 L1344,620"/>
    <path class="wr nohead" data-k="fanin" d="M1262,850 C1316,850 1300,620 1344,620"/>
    <path class="wr" data-k="fanin" d="M1342,620 L1374,620"/>
    <path class="wr" data-k="w-q-ps" d="M1562,620 L1614,620"/>
  </svg>

  <div class="node flex" data-k="ls" style="left:120px;top:545px;width:230px;height:150px">
    <div class="tt">LIVESTREAM</div>
  </div>

  <div class="node flex" data-k="in" style="left:410px;top:440px;width:280px;height:360px">
    <div class="tt">INTAKE</div>
    <div class="ichips">
      <span class="pill chip" data-k="in">re-encode</span>
      <span class="pill chip" data-k="in">vertical version</span>
      <span class="pill chip" data-k="in">transcript</span>
    </div>
  </div>

  <div class="node lane" data-k="l1" style="left:810px;top:305px;width:450px;height:170px">
    <div class="tt">LANE 1</div><div class="st">long-form video</div><svg class="ico lico" width="76" height="76" viewBox="0 0 72 72" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="14" width="64" height="40" rx="6"/><path d="M30 26.5 L44 34 L30 41.5 Z" fill="currentColor" stroke="none"/><path d="M24 62 H48"/></svg>
  </div>
  <div class="node lane" data-k="l2" style="left:810px;top:535px;width:450px;height:170px">
    <div class="tt">LANE 2</div><div class="st">vertical shorts, the clips</div><svg class="ico lico" width="76" height="76" viewBox="0 0 72 72" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="21" y="3" width="30" height="66" rx="6"/><path d="M32 28.5 L43 36 L32 43.5 Z" fill="currentColor" stroke="none"/><path d="M32 9.5 H40"/></svg>
  </div>
  <div class="pill tag today-tag ap" data-k="today" style="left:1130px;top:517px">TODAY</div>
  <div class="node lane" data-k="l3" style="left:810px;top:765px;width:450px;height:170px">
    <div class="tt">LANE 3</div><div class="st">text and images:<br>tweets, threads, posts</div><svg class="ico lico" width="76" height="76" viewBox="0 0 72 72" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 10 H62 A6 6 0 0 1 68 16 V44 A6 6 0 0 1 62 50 H32 L19 61 V50 H10 A6 6 0 0 1 4 44 V16 A6 6 0 0 1 10 10 Z"/><path d="M15 24 H57 M15 35 H44"/></svg>
  </div>

  <div class="node flex" data-k="q" style="left:1380px;top:535px;width:180px;height:170px">
    <div class="tt">QUEUES</div>
  </div>
  <div class="node flex" data-k="ps" style="left:1620px;top:535px;width:180px;height:170px">
    <div class="tt">POSTING<br>SCRIPTS</div>
  </div>
</div>
</template>
<script src="chart.js"></script>
<script>
buildChart({
  "pipeline-intake":    { on: ["ls", "in", "w-ls-in"] },
  "pipeline-lane-1":    { on: ["fan", "l1"] },
  "pipeline-lanes-2-3": { on: ["l2", "l3", "b2", "b3"] },
  "pipeline-queues":    { on: ["q", "ps", "fanin", "w-q-ps"], show: ["today"], cls: { l2: "today" } }
});
</script>
</body>
</html>
