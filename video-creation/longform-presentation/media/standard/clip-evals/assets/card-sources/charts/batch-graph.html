<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>clip-evals chart: batch-graph (start, lane-3, strategist, gate-1, gate-2, build, verify)</title>
<!--
  SYSTEM-DESIGN CHART, full-frame cover, 1920x1080, 7 states. Spec: ../../CARDS-SPEC.md section 3, "batch-graph".
  Used in SCRIPT.md CH3, from "One LangGraph graph owns all 3 lanes, and it has 14 steps." to "The graph refuses to
  report done while any lane is still pending."
  Layout: the 14 nodes as a snake, 2 rows of 7: row 1 runs left to right (1 to 7), turns down at the right, and
  row 2 runs back right to left (8 to 14), every node numbered. Both human gates fall in the same column (6 above 9).
  Lane 3 runs as its own process INSIDE the U of the snake rather than under row 2: with 7 per row, launch_lane3
  (row 1, column 3) sits right above join_lane3 (row 2, column 2), so a branch along the bottom edge would have to
  cut through row 2; inside the U it touches nothing and sits beside every lane 2 step it runs in parallel with.
  Column 7 is 270px (it holds lane2_tighten_plan, the longest name, on one line), column 1 224px (node 1's label on
  2 lines), the rest 200px; labels wrap balanced, so no word is left alone on a line.
  An arrow lights with the node it points into. The 9:16 cut is batch-graph-vertical.html.
  Shoot: python ../shoot.py batch-graph.html --out ../../diagrams
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400;1,500&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="chart.css">
<style>
.step{display:flex;flex-direction:column;align-items:center;justify-content:flex-start;text-align:center;padding:46px 8px 10px}
.nm{font-family:'JetBrains Mono',monospace;font-weight:600;font-size:23px;line-height:1.2;white-space:nowrap}
.lb{font-family:'DM Sans';font-weight:500;font-size:22px;line-height:1.26;color:var(--rest-sub);margin-top:9px;text-wrap:balance}
.on .lb{color:var(--lit-sub)}
.gcap{font-weight:700;letter-spacing:.04em;white-space:nowrap}
.l3{display:flex;align-items:center;gap:18px;padding:0 34px}
.l3 .st{white-space:nowrap}
.note{display:flex;align-items:center;padding:12px 22px;border-radius:12px;border:2px solid var(--accent-cyan);
  background:rgba(0,194,255,.10);box-shadow:0 0 34px rgba(0,194,255,.20);font-family:'DM Sans';font-weight:600;
  font-size:24px;color:var(--text-primary);white-space:nowrap}
</style>
</head>
<body>
<template id="chart"></template>
<script src="chart.js"></script>
<script>
(function () {
  // ---- the 14 steps, exactly as CARDS-SPEC.md section 3 writes them ----
  var GATE1 = '<span class="gl gcap">HUMAN GATE 1:</span><br><span class="kp">keep</span> or <span class="kl">kill</span>';
  var STEPS = [
    [1,  "intake",             "re-encode, vertical, transcribe", ""],
    [2,  "register",           "register the batch",              ""],
    [3,  "launch_lane3",       "start lane 3",                    ""],
    [4,  "lane2_select",       "the clip strategist picks",       "AV"],
    [5,  "lane2_cut",          "cut the clips",                   ""],
    [6,  "gate_4b",            GATE1,                             "G"],
    [7,  "lane2_tighten_plan", "plan the filler cuts",            "AV"],
    [8,  "lane2_tighten",      "tighten",                         ""],
    [9,  "gate_2nd",           '<span class="gl gcap">HUMAN GATE 2</span>', "G"],
    [10, "lane2_finish",       "finish the clips",                ""],
    [11, "lane2_build",        "build each short",                "A"],
    [12, "lane2_publish",      "publish to the queue",            "A"],
    [13, "join_lane3",         "wait for lane 3",                 ""],
    [14, "verify_batch",       "verify the whole batch",          "V"]
  ];
  var ICON = {
    A: '<svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.2c.9 5.2 4.6 8.9 9.8 9.8-5.2.9-8.9 4.6-9.8 9.8-.9-5.2-4.6-8.9-9.8-9.8 5.2-.9 8.9-4.6 9.8-9.8z" fill="currentColor"/></svg>',
    V: '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2.6l7.6 3v5.6c0 4.9-3.2 8.6-7.6 10.2-4.4-1.6-7.6-5.3-7.6-10.2V5.6z"/><path d="M8.6 12.2l2.4 2.4 4.6-4.8"/></svg>',
    G: '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="8" r="3.6"/><path d="M4.8 20.6c.6-4 3.5-6.4 7.2-6.4s6.6 2.4 7.2 6.4"/></svg>'
  };

  // ---- the grid (explicit px; nothing is measured from text) ----
  // column 1 is a little wider so node 1's label wraps to 2 balanced lines; column 7 holds lane2_tighten_plan
  var X0 = 120, COLW = [224, 200, 200, 200, 200, 200, 270], GAP = 31, H = 180;
  var ROW_Y = [292, 712];
  function colX(c) { var x = X0; for (var i = 1; i < c; i++) x += COLW[i - 1] + GAP; return x; }   // c = 1..7
  function colW(c) { return COLW[c - 1]; }
  function place(n) {                                              // snake: 1..7 left to right, 8..14 right to left
    var row = n <= 7 ? 0 : 1, c = n <= 7 ? n : 15 - n;
    return { x: colX(c), y: ROW_Y[row], w: colW(c), h: H, cx: colX(c) + colW(c) / 2, cy: ROW_Y[row] + H / 2, row: row };
  }

  var html = [];
  html.push('<div class="stage">');
  html.push('<div class="orb" style="width:640px;height:640px;background:var(--accent-cyan);opacity:.12;left:-300px;top:-320px"></div>');
  html.push('<div class="orb" style="width:620px;height:620px;background:var(--accent-green);opacity:.06;left:1520px;top:760px"></div>');
  html.push('<div class="head"><h1>One graph, 14 steps</h1><div class="divider"></div></div>');
  html.push('<div class="corner" data-own>' +
    '<span class="lg">' + ICON.A + 'AGENT</span>' +
    '<span class="lg">' + ICON.V + 'VALIDATOR</span>' +
    '<span class="lg"><span class="go" style="display:flex">' + ICON.G + '</span>HUMAN GATE</span></div>');

  // ---- wires ----
  var w = [];
  function wire(keys, d, extra) { w.push('<path class="wr' + (extra || '') + '" data-k="' + keys + '" d="' + d + '"/>'); }
  for (var n = 1; n < 14; n++) {
    var a = place(n), b = place(n + 1), k = 'w' + n + '-' + (n + 1);
    if (n === 7) {                       // the turn: down the right-hand column
      wire(k, 'M' + a.cx + ',' + (a.y + a.h + 2) + ' L' + b.cx + ',' + (b.y - 3));
    } else if (a.row === 0) {            // row 1, left to right
      wire(k, 'M' + (a.x + a.w + 2) + ',' + a.cy + ' L' + (b.x - 3) + ',' + b.cy);
    } else {                             // row 2, right to left
      wire(k, 'M' + (a.x - 2) + ',' + a.cy + ' L' + (b.x + b.w + 3) + ',' + b.cy);
    }
  }
  // lane 3: out of launch_lane3, its own process inside the U, back in at join_lane3
  var n3 = place(3), n13 = place(13);
  var L3 = { x: 622, y: 542, w: 598, h: 100 };
  var l3cy = L3.y + L3.h / 2;
  wire('l3 l3out', 'M' + n3.cx + ',' + (n3.y + n3.h + 2) + ' L' + n3.cx + ',' + (L3.y - 3));
  wire('l3 l3back', 'M' + (L3.x - 2) + ',' + l3cy + ' L' + (n13.cx + 18) + ',' + l3cy +
       ' Q' + n13.cx + ',' + l3cy + ' ' + n13.cx + ',' + (l3cy + 18) + ' L' + n13.cx + ',' + (n13.y - 3));
  // the note's connector (appears with the note)
  var n14 = place(14);
  w.push('<path class="wr nohead on ap" data-k="note" d="M' + n14.cx + ',' + (n14.y + n14.h + 2) + ' L' + n14.cx + ',' + (n14.y + n14.h + 34) + '"/>');
  html.push('<svg class="wires" width="1920" height="1080" viewBox="0 0 1920 1080">' + w.join('') + '</svg>');

  // ---- nodes ----
  STEPS.forEach(function (s) {
    var p = place(s[0]), gate = s[3] === 'G';
    var tab = '';
    if (s[3]) tab = '<div class="tab">' + s[3].split('').map(function (c) { return ICON[c]; }).join('') + '</div>';
    html.push('<div class="node step' + (gate ? ' gate' : '') + '" data-k="n' + s[0] + '" style="left:' + p.x + 'px;top:' + p.y +
      'px;width:' + p.w + 'px;height:' + p.h + 'px">' +
      '<div class="badge">' + s[0] + '</div>' + tab +
      '<div class="nm">' + s[1] + '</div><div class="lb">' + s[2] + '</div></div>');
  });
  // the lane 3 process
  html.push('<div class="node l3" data-k="l3" style="left:' + L3.x + 'px;top:' + L3.y + 'px;width:' + L3.w + 'px;height:' + L3.h + 'px">' +
    '<div class="tab">' + ICON.A + '</div><div class="tt">LANE 3</div><div class="st">its own process: drafts the posts</div></div>');
  // the note (verify)
  html.push('<div class="note ap" data-k="note" style="left:120px;top:' + (n14.y + n14.h + 36) + 'px">refuses done while a lane is pending</div>');

  html.push('</div>');
  document.getElementById('chart').innerHTML = html.join('');

  buildChart({
    "batch-graph-start":      { on: ["n1", "n2", "w1-2"] },
    "batch-graph-lane-3":     { on: ["n3", "w2-3", "l3"] },
    "batch-graph-strategist": { on: ["n4", "w3-4"] },
    "batch-graph-gate-1":     { on: ["n5", "n6", "w4-5", "w5-6"] },
    "batch-graph-gate-2":     { on: ["n7", "n8", "n9", "w6-7", "w7-8", "w8-9"] },
    "batch-graph-build":      { on: ["n10", "n11", "n12", "w9-10", "w10-11", "w11-12"] },
    "batch-graph-verify":     { on: ["n13", "n14", "w12-13", "w13-14", "l3back"], show: ["note"] }
  });
})();
</script>
</body>
</html>
