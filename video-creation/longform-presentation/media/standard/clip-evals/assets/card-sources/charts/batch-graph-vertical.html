<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>clip-evals chart, 9:16: batch-graph (start, lane-3, strategist, gate-1, gate-2, build, verify)</title>
<!--
  The 9:16 cut of batch-graph.html: the same chart, states, text and lit parts, re-composed for a 1080x1920 phone
  frame. The 2x7 snake turns on its side: column 1 runs DOWN (1 to 7), turns at the bottom, and column 2 runs back
  UP (8 to 14), every node numbered. Lane 3 stays INSIDE the U, as in 16:9: it leaves launch_lane3 (left, row 3),
  runs as its own process in the middle channel, and comes back in at join_lane3 (right, row 2). The verify note sits
  beside verify_batch (right, row 1). Column 1 is wider: it holds lane2_tighten_plan, the longest name, on one line
  at 30px. Names 30px mono, labels 28px balanced; nothing below y 1450; 72px side margins.
  Shoot (from assets/card-sources/): python shoot.py charts/batch-graph-vertical.html --out ../vertical/diagrams --size 1080x1920
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400;1,500&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="chart.css">
<style>
.step{display:flex;flex-direction:column;align-items:center;justify-content:flex-start;text-align:center;padding:28px 12px 4px}
.nm{font-family:'JetBrains Mono',monospace;font-weight:600;font-size:30px;line-height:1.2;white-space:nowrap}
.lb{font-family:'DM Sans';font-weight:500;font-size:28px;line-height:1.25;color:var(--rest-sub);margin-top:6px;text-wrap:balance}
.on .lb{color:var(--lit-sub)}
.gcap{font-weight:700;letter-spacing:.04em;white-space:nowrap}
.l3{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 14px}
.l3 .st{margin-top:8px;text-wrap:balance}
.legend{display:flex;gap:30px;align-items:center}
.note{padding:12px 16px;border-radius:12px;border:2px solid var(--accent-cyan);background:rgba(0,194,255,.10);
  box-shadow:0 0 34px rgba(0,194,255,.20);font-family:'DM Sans';font-weight:600;font-size:28px;line-height:1.25;
  color:var(--text-primary);text-align:center;text-wrap:balance}
</style>
</head>
<body>
<template id="chart"></template>
<script src="chart.js"></script>
<script>
(function () {
  // ---- the 14 steps, exactly as CARDS-SPEC.md section 3 writes them (same table as batch-graph.html) ----
  var GATE1 = '<span class="gl gcap">HUMAN GATE 1:</span><br><span class="kp">keep</span> or <span class="kl">kill</span>';
  var STEPS = [
    [1,  "intake",             "re-encode, vertical, transcribe", ""],
    [2,  "register",           "register the batch",              ""],
    [3,  "launch_lane3",       "start lane 3",                    ""],
    [4,  "lane2_select",       "the clip strategist picks",       "AV"],
    [5,  "lane2_cut",          "cut the clips",                   ""],
    [6,  "gate_4b",            GATE1,                             "G"],
    [7,  "lane2_tighten_plan", "plan the filler cuts",            "AV"],
    [8,  "lane2_tighten",      "tighten",                         ""],
    [9,  "gate_2nd",           '<span class="gl gcap">HUMAN GATE 2</span>', "G"],
    [10, "lane2_finish",       "finish the clips",                ""],
    [11, "lane2_build",        "build each short",                "A"],
    [12, "lane2_publish",      "publish to the queue",            "A"],
    [13, "join_lane3",         "wait for lane 3",                 ""],
    [14, "verify_batch",       "verify the whole batch",          "V"]
  ];
  var ICON = {
    A: '<svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.2c.9 5.2 4.6 8.9 9.8 9.8-5.2.9-8.9 4.6-9.8 9.8-.9-5.2-4.6-8.9-9.8-9.8 5.2-.9 8.9-4.6 9.8-9.8z" fill="currentColor"/></svg>',
    V: '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2.6l7.6 3v5.6c0 4.9-3.2 8.6-7.6 10.2-4.4-1.6-7.6-5.3-7.6-10.2V5.6z"/><path d="M8.6 12.2l2.4 2.4 4.6-4.8"/></svg>',
    G: '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="8" r="3.6"/><path d="M4.8 20.6c.6-4 3.5-6.4 7.2-6.4s6.6 2.4 7.2 6.4"/></svg>'
  };

  // ---- the grid (explicit px): 2 columns of 7 rows, rows with a 2-line label are taller ----
  var COL = [{ x: 72, w: 356 }, { x: 718, w: 290 }];
  var ROWS = [[330, 148], [512, 112], [658, 148], [840, 112], [986, 112], [1132, 148], [1314, 112]];   // [top, height], 34px apart
  function place(n) {                       // snake: 1..7 down column 1, 8..14 back up column 2
    var c = n <= 7 ? COL[0] : COL[1], r = ROWS[n <= 7 ? n - 1 : 14 - n];
    return { x: c.x, y: r[0], w: c.w, h: r[1], cx: c.x + c.w / 2, cy: r[0] + r[1] / 2, b: r[0] + r[1] };
  }

  var html = [];
  html.push('<div class="stage">');
  html.push('<div class="orb" style="width:620px;height:620px;background:var(--accent-cyan);opacity:.12;left:-300px;top:-300px"></div>');
  html.push('<div class="orb" style="width:620px;height:620px;background:var(--accent-green);opacity:.06;left:620px;top:1460px"></div>');
  html.push('<div class="head"><h1>One graph, 14 steps</h1><div class="divider"></div></div>');
  html.push('<div class="legend" data-own style="left:72px;top:256px">' +
    '<span class="lg">' + ICON.A + 'AGENT</span>' +
    '<span class="lg">' + ICON.V + 'VALIDATOR</span>' +
    '<span class="lg"><span class="go" style="display:flex">' + ICON.G + '</span>HUMAN GATE</span></div>');

  // ---- wires ----
  var w = [];
  function wire(keys, d, extra) { w.push('<path class="wr' + (extra || '') + '" data-k="' + keys + '" d="' + d + '"/>'); }
  for (var n = 1; n < 14; n++) {
    var a = place(n), b = place(n + 1), k = 'w' + n + '-' + (n + 1);
    if (n === 7) {                         // the turn: across the bottom, left column to right column
      wire(k, 'M' + (a.x + a.w + 2) + ',' + a.cy + ' L' + (b.x - 3) + ',' + b.cy);
    } else if (n < 7) {                    // column 1, down
      wire(k, 'M' + a.cx + ',' + (a.b + 2) + ' L' + b.cx + ',' + (b.y - 3));
    } else {                               // column 2, up
      wire(k, 'M' + a.cx + ',' + (a.y - 2) + ' L' + b.cx + ',' + (b.b + 3));
    }
  }
  // lane 3: out of launch_lane3, its own process in the middle channel, back in at join_lane3
  var n3 = place(3), n13 = place(13), n14 = place(14);
  var L3 = { x: 448, y: 770, w: 250, h: 180 };
  wire('l3 l3out', 'M' + (n3.x + n3.w + 2) + ',' + n3.cy + ' L486,' + n3.cy + ' Q502,' + n3.cy + ' 502,' + (n3.cy + 16) + ' L502,' + (L3.y - 3));
  wire('l3 l3back', 'M640,' + (L3.y - 2) + ' L640,' + (n13.cy + 16) + ' Q640,' + n13.cy + ' 656,' + n13.cy + ' L' + (n13.x - 3) + ',' + n13.cy);
  // the note's connector (appears with the note)
  w.push('<path class="wr nohead on ap" data-k="note" d="M' + (L3.x + L3.w) + ',' + n14.cy + ' L' + (n14.x - 2) + ',' + n14.cy + '"/>');
  html.push('<svg class="wires" width="1080" height="1920" viewBox="0 0 1080 1920">' + w.join('') + '</svg>');

  // ---- nodes ----
  STEPS.forEach(function (s) {
    var p = place(s[0]), gate = s[3] === 'G';
    var tab = '';
    if (s[3]) tab = '<div class="tab">' + s[3].split('').map(function (c) { return ICON[c]; }).join('') + '</div>';
    html.push('<div class="node step' + (gate ? ' gate' : '') + '" data-k="n' + s[0] + '" style="left:' + p.x + 'px;top:' + p.y +
      'px;width:' + p.w + 'px;height:' + p.h + 'px">' +
      '<div class="badge">' + s[0] + '</div>' + tab +
      '<div class="nm">' + s[1] + '</div><div class="lb">' + s[2] + '</div></div>');
  });
  // the lane 3 process
  html.push('<div class="node l3" data-k="l3" style="left:' + L3.x + 'px;top:' + L3.y + 'px;width:' + L3.w + 'px;height:' + L3.h + 'px">' +
    '<div class="tab">' + ICON.A + '</div><div class="tt">LANE 3</div><div class="st">its own process: drafts the posts</div></div>');
  // the note (verify), beside verify_batch
  html.push('<div class="note ap" data-k="note" style="left:' + L3.x + 'px;width:' + L3.w + 'px;top:' + (n14.cy - 66) + 'px">refuses done while a lane is pending</div>');

  html.push('</div>');
  document.getElementById('chart').innerHTML = html.join('');

  buildChart({
    "batch-graph-start":      { on: ["n1", "n2", "w1-2"] },
    "batch-graph-lane-3":     { on: ["n3", "w2-3", "l3"] },
    "batch-graph-strategist": { on: ["n4", "w3-4"] },
    "batch-graph-gate-1":     { on: ["n5", "n6", "w4-5", "w5-6"] },
    "batch-graph-gate-2":     { on: ["n7", "n8", "n9", "w6-7", "w7-8", "w8-9"] },
    "batch-graph-build":      { on: ["n10", "n11", "n12", "w9-10", "w10-11", "w11-12"] },
    "batch-graph-verify":     { on: ["n13", "n14", "w12-13", "w13-14", "l3back"], show: ["note"] }
  }, { portrait: true });
})();
</script>
</body>
</html>
