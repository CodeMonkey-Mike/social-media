<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>clip-evals chart: score-layer (lost, record, replay, score)</title>
<!--
  SYSTEM-DESIGN CHART, full-frame cover, 1920x1080, 4 states. Spec: ../../CARDS-SPEC.md section 3, "score-layer".
  Used in SCRIPT.md CH7: "And my verdicts were being thrown away." (lost) / "First, a record of every verdict."
  (record) / "Second, a way to replay an old livestream through the strategist the way it's written today."
  (replay) / "And third, a score that compares the new picks to my old verdicts." (score)
  Layout: the 2 gates on the left feed THE RECORD in the middle; the replay row runs along the top to NEW PICKS;
  the record and the new picks both arrive at THE SCORE (right), and the score drops into THE DECISION (bottom
  right). In `lost` the verdicts arrow stops short of the record in a dashed red stub, "thrown away".
  An arrow lights with the node it points into. Shoot: python ../shoot.py score-layer.html --out ../../diagrams
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400;1,500&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="chart.css">
<style>
.gt{font-family:'DM Sans';font-weight:700;font-size:28px;line-height:1.16;letter-spacing:.05em;text-transform:uppercase}
.node .st{margin-top:8px}
.file{font-family:'JetBrains Mono',monospace;font-weight:600;font-size:24px;line-height:1.2;margin-top:10px;color:var(--rest-title)}
.on .file{color:var(--accent-cyan)}
.dec{display:flex;flex-direction:row;align-items:center;justify-content:center;gap:24px}
.dec .st{margin-top:0;font-size:26px}
.stub{fill:none;stroke:var(--accent-red);stroke-width:3.5;stroke-dasharray:9 9;stroke-linecap:round}
.thrown{color:var(--accent-red)}
</style>
</head>
<body>
<template id="chart">
<div class="stage">
  <div class="orb" style="width:640px;height:640px;background:var(--accent-cyan);opacity:.12;left:-300px;top:-320px"></div>
  <div class="orb" style="width:620px;height:620px;background:var(--accent-green);opacity:.06;left:1520px;top:760px"></div>

  <div class="head"><h1>Record, replay, score</h1><div class="divider"></div></div>

  <svg class="wires" width="1920" height="1080" viewBox="0 0 1920 1080">
    <!-- the gates' verdicts: two branches merge into one arrow to the record -->
    <path class="wr nohead" data-k="vbracket" d="M392,540 C420,540 414,620 442,620"/>
    <path class="wr nohead" data-k="vbracket" d="M392,700 C420,700 414,620 442,620"/>
    <path class="wr" data-k="vtrunk" d="M440,620 L616,620"/>
    <!-- lost: the arrow ends in a dashed stub, short of the record -->
    <path class="stub ap" data-k="stub" d="M448,620 L568,620"/>
    <!-- the replay row -->
    <path class="wr" data-k="w-st-cs" d="M982,340 L1056,340"/>
    <path class="wr" data-k="w-cs-np" d="M1422,340 L1496,340"/>
    <!-- into the score, and on to the decision -->
    <path class="wr" data-k="w-np-sc" d="M1650,412 L1650,546"/>
    <path class="wr" data-k="w-rec-sc" d="M982,620 L1496,620"/>
    <path class="wr" data-k="w-sc-dec" d="M1650,692 L1650,826"/>
  </svg>

  <!-- left: the 2 human gates -->
  <div class="node flex gate" data-k="gates" style="left:120px;top:480px;width:270px;height:120px">
    <div class="gt gl">HUMAN GATE 1</div><div class="st"><span class="kp">keep</span> / <span class="kl">kill</span></div>
  </div>
  <div class="node flex gate" data-k="gates" style="left:120px;top:640px;width:270px;height:120px">
    <div class="gt gl">HUMAN GATE 2</div><div class="st"><span class="kp">keep</span> / <span class="kl">kill</span></div>
  </div>
  <div class="wl" data-k="vlabel" style="left:458px;width:140px;top:576px;text-align:center">verdicts</div>
  <div class="wl thrown ap" data-k="thrown" style="left:446px;width:150px;top:636px;text-align:center">thrown away</div>

  <!-- middle: the record -->
  <div class="node flex" data-k="rec" style="left:620px;top:540px;width:360px;height:160px">
    <div class="tt">THE RECORD</div>
    <div class="file">clip-verdicts.jsonl</div>
    <div class="st">one line per clip per gate</div>
  </div>

  <!-- top right: the replay -->
  <div class="node flex" data-k="st" style="left:620px;top:270px;width:360px;height:140px">
    <div class="tt">SAVED TRANSCRIPT</div>
  </div>
  <div class="node flex" data-k="cs" style="left:1060px;top:270px;width:360px;height:140px">
    <div class="tt">THE CLIP STRATEGIST</div><div class="st">today's prompt</div>
  </div>
  <div class="node flex" data-k="np" style="left:1500px;top:270px;width:300px;height:140px">
    <div class="tt">NEW PICKS</div><div class="st">the replay</div>
  </div>

  <!-- bottom right: the score and the decision -->
  <div class="node flex" data-k="sc" style="left:1500px;top:550px;width:300px;height:140px">
    <div class="tt">THE SCORE</div><div class="st">precision · recall</div>
  </div>
  <div class="node dec" data-k="dec" style="left:1060px;top:830px;width:740px;height:100px">
    <div class="tt">THE DECISION</div><div class="st">did the prompt change help?</div>
  </div>
</div>
</template>
<script src="chart.js"></script>
<script>
buildChart({
  "score-layer-lost":   { on: ["gates", "vbracket", "vlabel"], show: ["stub", "thrown"], cls: { vtrunk: "ap" } },
  "score-layer-record": { on: ["gates", "vbracket", "vtrunk", "vlabel", "rec"] },
  "score-layer-replay": { on: ["st", "cs", "np", "w-st-cs", "w-cs-np"] },
  "score-layer-score":  { on: ["sc", "dec", "w-rec-sc", "w-np-sc", "w-sc-dec"] }
});
</script>
</body>
</html>
