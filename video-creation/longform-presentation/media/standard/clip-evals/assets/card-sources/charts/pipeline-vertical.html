<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>clip-evals chart, 9:16: pipeline (intake, lane-1, lanes-2-3, queues)</title>
<!--
  The 9:16 cut of pipeline.html: the same chart, states, text and lit parts, re-composed for a 1080x1920 phone frame.
  The left-to-right flow becomes top to bottom: LIVESTREAM, INTAKE, the 3 lanes (stacked as in 16:9, full width so
  every lane's line fits on one line), QUEUES, POSTING SCRIPTS. The fan-out is a bracket that opens from INTAKE down
  the left side into each lane; the fan-in a bracket that closes from each lane down the right side into QUEUES.
  QUEUES and POSTING SCRIPTS are the same size. Text 28px and up, nothing below y 1450, 72px side margins.
  Shoot (from assets/card-sources/): python shoot.py charts/pipeline-vertical.html --out ../vertical/diagrams --size 1080x1920
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400;1,500&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="chart.css">
<style>
.ichips{display:flex;gap:16px;margin-top:20px;justify-content:center}
.lane{display:flex;flex-direction:column;justify-content:center;padding:0 34px}
.lane .st{margin-top:6px}
.lico{position:absolute;right:30px;top:20px}
.node.today{border-color:var(--accent-gold);box-shadow:0 0 0 1px rgba(255,215,0,.24),0 0 40px rgba(255,215,0,.16)}
.node.today .tt{color:var(--text-primary)}
.today-tag{background:var(--accent-gold);color:var(--bg-deep)}
</style>
</head>
<body>
<template id="chart">
<div class="stage">
  <div class="orb" style="width:620px;height:620px;background:var(--accent-cyan);opacity:.12;left:-300px;top:-300px"></div>
  <div class="orb" style="width:620px;height:620px;background:var(--accent-green);opacity:.06;left:620px;top:1460px"></div>

  <div class="head"><h1>From a livestream to the queues</h1><div class="divider"></div></div>

  <svg class="wires" width="1080" height="1920" viewBox="0 0 1080 1920">
    <path class="wr" data-k="w-ls-in" d="M540,464 L540,505"/>
    <!-- the fan-out: a bracket from INTAKE down the left side, one tooth per lane. The teeth come first and the
         shared trunk last, so in lanes-2-3 the lit trunk draws over the root of lane 1's resting tooth -->
    <path class="wr" data-k="fan b1" d="M110,756 Q110,772 126,772 L146,772"/>
    <path class="wr" data-k="fan b2" d="M110,888 Q110,904 126,904 L146,904"/>
    <path class="wr" data-k="fan b3" d="M126,1036 L146,1036"/>
    <path class="wr nohead" data-k="fan b2 b3" d="M540,664 L540,690 L126,690 Q110,690 110,706 L110,1020 Q110,1036 126,1036 L130,1036"/>
    <!-- the fan-in: each lane into a bracket down the right side, into the queues -->
    <path class="wr nohead" data-k="fanin" d="M932,772 L954,772 Q970,772 970,788"/>
    <path class="wr nohead" data-k="fanin" d="M932,904 L970,904"/>
    <path class="wr nohead" data-k="fanin" d="M932,1036 L970,1036"/>
    <path class="wr" data-k="fanin" d="M970,788 L970,1104 Q970,1120 954,1120 L556,1120 Q540,1120 540,1136 L540,1149"/>
    <path class="wr" data-k="w-q-ps" d="M540,1246 L540,1287"/>
  </svg>

  <div class="node flex" data-k="ls" style="left:290px;top:372px;width:500px;height:90px">
    <div class="tt">LIVESTREAM</div>
  </div>

  <div class="node flex" data-k="in" style="left:72px;top:508px;width:936px;height:154px">
    <div class="tt">INTAKE</div>
    <div class="ichips">
      <span class="pill chip" data-k="in">re-encode</span>
      <span class="pill chip" data-k="in">vertical version</span>
      <span class="pill chip" data-k="in">transcript</span>
    </div>
  </div>

  <div class="node lane" data-k="l1" style="left:150px;top:716px;width:780px;height:112px">
    <div class="tt">LANE 1</div><div class="st">long-form video</div>
    <svg class="ico lico" width="72" height="72" viewBox="0 0 72 72" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="14" width="64" height="40" rx="6"/><path d="M30 26.5 L44 34 L30 41.5 Z" fill="currentColor" stroke="none"/><path d="M24 62 H48"/></svg>
  </div>
  <div class="node lane" data-k="l2" style="left:150px;top:848px;width:780px;height:112px">
    <div class="tt">LANE 2</div><div class="st">vertical shorts, the clips</div>
    <svg class="ico lico" width="72" height="72" viewBox="0 0 72 72" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="21" y="3" width="30" height="66" rx="6"/><path d="M32 28.5 L43 36 L32 43.5 Z" fill="currentColor" stroke="none"/><path d="M32 9.5 H40"/></svg>
  </div>
  <div class="pill tag today-tag ap" data-k="today" style="left:770px;top:828px">TODAY</div>
  <div class="node lane" data-k="l3" style="left:150px;top:980px;width:780px;height:112px">
    <div class="tt">LANE 3</div><div class="st">text and images: tweets, threads, posts</div>
    <svg class="ico lico" width="72" height="72" viewBox="0 0 72 72" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 10 H62 A6 6 0 0 1 68 16 V44 A6 6 0 0 1 62 50 H32 L19 61 V50 H10 A6 6 0 0 1 4 44 V16 A6 6 0 0 1 10 10 Z"/><path d="M15 24 H57 M15 35 H44"/></svg>
  </div>

  <div class="node flex" data-k="q" style="left:290px;top:1152px;width:500px;height:92px">
    <div class="tt">QUEUES</div>
  </div>
  <div class="node flex" data-k="ps" style="left:290px;top:1290px;width:500px;height:92px">
    <div class="tt">POSTING SCRIPTS</div>
  </div>
</div>
</template>
<script src="chart.js"></script>
<script>
buildChart({
  "pipeline-intake":    { on: ["ls", "in", "w-ls-in"] },
  "pipeline-lane-1":    { on: ["fan", "l1"] },
  "pipeline-lanes-2-3": { on: ["l2", "l3", "b2", "b3"] },
  "pipeline-queues":    { on: ["q", "ps", "fanin", "w-q-ps"], show: ["today"], cls: { l2: "today" } }
}, { portrait: true });
</script>
</body>
</html>
