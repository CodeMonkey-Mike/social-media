<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>livestream-aws chart: today-pc (one state)</title>
<!--
  SYSTEM-DESIGN CHART, full-frame cover, 1920x1080, ONE state. SCRIPT.md CARDS row `today-pc`, CH1:
    "Today, everything lives in one box: the graph and its checkpoints, 7 agents in Claude Code, one browser for the
     images, Whisper on my GPU, the renders and the posting scripts."
  One box labelled ONE PC (lit: it is the point of the line) with every piece of the pipeline inside it, each piece
  in its "present" (white) look. Facts: RESEARCH.md section 2 (one Windows PC, every step local; the graph and its
  SQLite checkpoints, SqliteSaver; 7 agents, headless Claude Code; one ChatGPT browser makes the images; Whisper on
  the local GPU; Remotion renders; posting scripts). The graph is drawn as the real one: 14 steps in the clip-evals
  snake, the 2 human gates in gold (the number 14 is NOT printed here: this card's numbers are 7 and 1).
  Shoot (from this folder): python shoot.py today-pc.html --out ../../diagrams
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400;1,500&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="chart.css">
<link rel="stylesheet" href="group1.css">
<style>
/* the pieces inside the PC: white "present" look, cyan icons */
.pc .node.td.on .ico{color:var(--accent-cyan)}
.pt{font-family:'DM Sans';font-weight:700;font-size:32px;line-height:1.15}
.ps{font-family:'DM Sans';font-weight:500;font-size:25px;line-height:1.3;color:var(--lit-sub);margin-top:8px}
.tile{display:flex;flex-direction:column;align-items:center;justify-content:flex-start;text-align:center;padding:74px 12px 0}
.tile .ib{height:76px;display:flex;align-items:center;justify-content:center;gap:9px;margin-bottom:24px}
.wide{display:flex;align-items:center;gap:30px;padding:0 40px}
.wide .tx{display:flex;flex-direction:column;align-items:flex-start;text-align:left}
.zhead{display:flex;align-items:center;gap:16px}
.zhead .zl{font-size:32px;letter-spacing:.12em}
.zhead .st{font-size:26px}
.zhead .ico{color:var(--accent-cyan)}
/* the mini graph: 14 steps, the 2 gates in gold */
.mg circle{fill:var(--bg-deep);stroke:var(--text-primary);stroke-width:2.6}
.mg circle.g{stroke:var(--accent-gold);fill:rgba(255,215,0,.16)}
.mg path{stroke:rgba(232,234,240,.55);stroke-width:2.4;fill:none;stroke-linecap:round}
</style>
</head>
<body>
<template id="chart"></template>
<script src="chart.js"></script>
<script src="group1.js"></script>
<script>
(function () {
  var h = [];
  h.push('<div class="stage pc">');
  h.push('<div class="orb" style="width:640px;height:640px;background:var(--accent-cyan);opacity:.12;left:-300px;top:-320px"></div>');
  h.push('<div class="orb" style="width:620px;height:620px;background:var(--accent-green);opacity:.06;left:1520px;top:760px"></div>');
  h.push('<div class="head"><h1>Today, it all runs on one PC</h1><div class="divider"></div></div>');

  // THE BOX: one PC
  h.push('<div class="zone" data-k="box" style="left:120px;top:212px;width:1680px;height:744px"></div>');
  h.push('<div class="zhead" data-own style="left:164px;top:240px">' + ICO("pc", 40, "", 2.2) +
    '<span class="zl" data-k="box">ONE PC</span><span class="st" data-k="box">one Windows PC, every step local</span></div>');

  // the mini graph (the real 14 steps, clip-evals snake: 1..7 left to right, 8..14 back right to left)
  var X0 = 14, DX = 66, YT = 22, YB = 102, gates = { 6: 1, 9: 1 }, pts = {};
  for (var n = 1; n <= 14; n++) pts[n] = n <= 7 ? [X0 + (n - 1) * DX, YT] : [X0 + (14 - n) * DX, YB];
  var g = ['<svg class="mg" width="430" height="124" viewBox="0 0 430 124">'];
  var d = 'M' + pts[1][0] + ',' + YT + ' L' + pts[7][0] + ',' + YT + ' L' + pts[8][0] + ',' + YB + ' L' + pts[14][0] + ',' + YB;
  g.push('<path d="' + d + '"/>');
  for (n = 1; n <= 14; n++) g.push('<circle class="' + (gates[n] ? 'g' : '') + '" cx="' + pts[n][0] + '" cy="' + pts[n][1] + '" r="11"/>');
  g.push('</svg>');

  // row 1: the graph and its checkpoints
  h.push('<svg class="wires" width="1920" height="1080" viewBox="0 0 1920 1080">' +
    WIRE("box", "M1092,426 L1246,426") + '</svg>');
  h.push('<div class="wl" data-k="box" style="left:1092px;width:154px;top:378px;text-align:center">saves state</div>');
  h.push('<div class="node td wide" data-k="box" style="left:164px;top:322px;width:928px;height:208px">' +
    '<div class="tx"><div class="pt">The LangGraph graph</div><div class="ps">runs every step</div></div>' +
    '<div style="margin-left:auto">' + g.join('') + '</div></div>');
  h.push('<div class="node td wide" data-k="box" style="left:1248px;top:322px;width:508px;height:208px">' + ICO("db", 64, "", 1.9) +
    '<div class="tx"><div class="pt">SQLite checkpoints</div><div class="ps">the graph\'s saved state</div></div></div>');

  // row 2: what the graph works with
  var T = [
    { w: 340, ib: (function () { var s = ''; for (var i = 0; i < 7; i++) s += ICO("star", 34); return s; })(),
      t: '<span class="mono">7</span> agents', s: 'in Claude Code' },
    { w: 290, ib: ICO("browser", 70, "", 1.8), t: '<span class="mono">1</span> browser', s: 'makes the images' },
    { w: 290, ib: ICO("wave", 70, "", 2.1), t: 'Whisper', s: 'on the GPU' },
    { w: 290, ib: ICO("film", 70, "", 1.8), t: 'Remotion', s: 'the renders' },
    { w: 290, ib: ICO("send", 66, "", 1.9), t: 'Posting scripts', s: 'post from the queues' }
  ];
  var x = 164;
  T.forEach(function (t) {
    h.push('<div class="node td tile" data-k="box" style="left:' + x + 'px;top:582px;width:' + t.w + 'px;height:330px">' +
      '<div class="ib">' + t.ib + '</div><div class="pt">' + t.t + '</div><div class="ps">' + t.s + '</div></div>');
    x += t.w + 24;
  });
  h.push('</div>');
  document.getElementById("chart").innerHTML = h.join("");

  buildChart({ "today-pc": { on: ["box"] } });
})();
</script>
</body>
</html>
