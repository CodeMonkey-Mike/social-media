<!--
  SYSTEM-DESIGN CHART STILLS, full-frame covers, 1920x1080. SCRIPT.md CARDS rows images, batch-spot, render-fanout,
  publish, watch (group 2 of 2; group 1 = today-pc, aws-map, ingest, graph-home, gate, agents, another file).
  Every number and AWS fact is from RESEARCH.md. The look is the house chart kit (chart.css / chart.js / shoot.py in
  this folder, shared with group 1 and NOT edited): the rest muted but readable, red = the problem, green = the good
  result, gold = a caveat.

  The TODAY / ON AWS conventions are group 1's (group1.css), so the whole video reads as one set; their values are
  COPIED into the <style> below, not linked, so an edit to group1.css never moves these layouts:
    - TODAY beside ON AWS: TODAY on the left in a dashed, flatter zone, its head a PC icon + "my PC", ON AWS on the right. A
      TODAY piece is neutral: lit = WHITE, never cyan. An AWS piece lights cyan. A TODAY piece and the AWS piece that
      would replace it sit on the same row and light together; side by side, a dashed "swap" arrow joins them.
    - An AWS box: an icon, the product name as AWS writes it (never uppercased), its plain one-line description under
      it in small caps (cyan when lit; the CARDS wording, Remotion Lambda's = group 1's aws-map wording), then what it
      does here. TODAY boxes are plain (no icon).
    - A state lights its parts; anything a state REVEALS (the cost line, the retried job, the 2-MINUTE WARNING) is
      laid out in every state and hidden (.ap), so the states are the same pixels except for what is lit.

  images (CH5)        before  "Now the bottleneck from my last video: one browser making the images, busy for 3.9
                               hours of a 4 hour 38 minute build."           -> TODAY lit (white): 7 shorts funnel into 1 lock,
                               1 browser, the busy bar (3.9 h of 4 h 38 min = 84.2% of the bar, red)
                      after   "On AWS, I'd drop the browser and call an image model on Bedrock. Stable Image Core ...
                               41 images come to 1.64 dollars." / "And the 7 shorts stop taking turns. No browser, no
                               lock."                                         -> ON AWS lit: 7 shorts side by side, 7
                               straight calls into Stable Image Core; the cost line appears; the swap arrow lights
  batch-spot (CH6)    reclaim "Those servers are EC2 Spot instances ... 2 minutes' warning." / "That's fine here,
                               because every step reads what's already done and skips it. On AWS, what's done lives in
                               S3."                                           -> the Spot instances lit, one taken back
                               (red, 2-MINUTE WARNING), its job back on the Batch queue (retried), S3 and TODAY's disk lit
                      gpu     "Whisper ... needs a GPU. On AWS, that's a G6 instance, an EC2 server with an NVIDIA L4."
                                                                              -> TODAY Whisper on my GPU and the G6 lit
  render-fanout (CH6) (one still) "Today, Remotion renders on my PC in 1-minute chunks. On AWS, Remotion Lambda splits
                               a render across up to 200 Lambda functions at once, at least 20 frames each." / "Remotion's
                               own example ..."                               -> both sides lit (TODAY white, AWS cyan): one render,
                               Remotion Lambda,
                               200 functions (40 x 5, drawn), stitched, S3; Remotion's example and limit in the gold note
                               ("REMOTION'S LIMIT", never a Lambda limit: RESEARCH.md do-not-air)
  publish (CH7)       schedule "Each post gets a one-time schedule in EventBridge Scheduler ... fires a Lambda function
                               that posts it."                                -> JSON queue files beside DynamoDB ->
                               Scheduler -> Lambda, lit
                      browser "YouTube and X go through their APIs. The platforms with no posting API go through
                               AgentCore Browser ..." (not in the recording; built so the set is complete)
                                                                              -> TODAY's posting scripts beside the APIs
                               and AgentCore Browser with the kept login, lit
  watch (CH8)         (one still) "Today I read log files. On AWS, every agent run is traced into CloudWatch ...:
                               latency, token usage and errors, per session." -> both sides lit (TODAY white, AWS cyan): the 7
                               agents' runs traced
                               into CloudWatch, its 3 readings
  Shoot (from this folder): python shoot.py group2.html --out ../../diagrams
-->

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400;1,500&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">

<style>
/* ===== group 2 only (chart.css is the shared kit and stays as it is) ===== */
/* Playfair's default digits are old-style (EC2 read as EC with a low 2): lining figures, as the text cards do */
.head h1{font-variant-numeric:lining-nums}

/* ---- the TODAY / ON AWS look the whole video shares: group 1's values (group1.css), COPIED here, not linked, so a
   later edit there never moves these layouts. TODAY is neutral (lit = white); cyan stays on AWS. ---- */
.colh{display:flex;align-items:center;gap:14px;font-family:'DM Sans';font-weight:700;font-size:28px;letter-spacing:.16em;
  text-transform:uppercase;white-space:nowrap}
.colh.today{color:var(--text-secondary)}
.colh.aws{color:var(--text-primary)}
.colh .ico{color:currentColor;opacity:1}
.colh .hs{font-weight:500;font-size:24px;letter-spacing:0;text-transform:none;color:var(--text-muted)}
.zone.tz{border-style:dashed;border-color:rgba(136,146,164,.30);background:rgba(18,21,28,.35)}
.zone.tz.on{border-color:rgba(232,234,240,.42);background:rgba(18,21,28,.45);box-shadow:none}
.node.td{background:rgba(18,21,28,.92)}
.node.td.on{border-color:rgba(232,234,240,.66);color:var(--text-primary);background:var(--bg-card-hover);
  box-shadow:0 0 0 1px rgba(232,234,240,.10),0 0 34px rgba(232,234,240,.07)}
.node.td.on .st{color:var(--lit-sub)}
.node.td .ico{color:var(--text-secondary)}
.node.td.on .ico{color:var(--text-primary);opacity:1}
/* the swap: a TODAY piece and the AWS piece that would replace it (dashed) */
.wr.swap{stroke-dasharray:8 9}
/* a TODAY wire, lit: white, its arrowhead white (chart.js defines #ah-white) */
.wr.tw.on{stroke:var(--text-primary);marker-end:url(#ah-white)}
.wr.tw.on.nohead{marker-end:none}

/* a box: name (as AWS writes it, never uppercased), its one-line description under it, what it does here */
.zh{display:flex;align-items:baseline;gap:18px}
.node.bx{display:flex;flex-direction:column;justify-content:center;align-items:flex-start;padding:14px 26px}
.node.bx.c{align-items:center;text-align:center}
.node.bx.top{justify-content:flex-start;padding-top:20px}
.nm{display:flex;align-items:center;gap:12px;font-family:'DM Sans';font-weight:700;font-size:28px;line-height:1.15;
  white-space:nowrap}
.nm .ico{flex:0 0 auto}
.gh .nm{color:var(--rest-title)} .gh .nm.on{color:var(--text-primary)}
.ds{font-family:'DM Sans';font-weight:600;font-size:22px;line-height:1.32;letter-spacing:.07em;text-transform:uppercase;
  color:var(--text-secondary);margin-top:8px}
.node.on .ds,.ds.on{color:var(--accent-cyan)}
.bx .st{margin-top:8px}
.ct{font-family:'DM Sans';font-weight:700;font-size:28px;line-height:1.15;letter-spacing:.06em;text-transform:uppercase}
.ct .mono{letter-spacing:0}
.lbl{font-family:'DM Sans';font-weight:700;font-size:22px;line-height:1.2;letter-spacing:.12em;text-transform:uppercase;
  color:var(--text-secondary);white-space:nowrap}
.lbl.on{color:var(--accent-cyan)}
.lbl.td.on{color:var(--text-primary)}
.lbl .mono,.ds .mono{letter-spacing:0}

/* images: the 7 shorts (each tile is a phone), the busy bar, the cost line */
.node.tile{width:72px;height:104px;border-radius:14px}
.node.tile.on{box-shadow:0 0 0 1px rgba(0,194,255,.30),0 0 22px rgba(0,194,255,.24)}
.node.tile.td.on{box-shadow:0 0 0 1px rgba(232,234,240,.10),0 0 20px rgba(232,234,240,.08)}
.node.tile svg{display:block}
.metric .mt{font-family:'DM Sans';font-weight:700;font-size:24px;line-height:1.3;letter-spacing:.08em;text-transform:uppercase;
  color:var(--text-secondary);text-align:center;white-space:nowrap}
.metric .mt .mono{font-size:28px;letter-spacing:0}
.metric.on .mt{color:var(--text-primary)}
.metric.on .bad{color:var(--accent-red)}
.metric.on .gd{color:var(--accent-green)}
.metric.big .mt{font-size:26px}
.metric.big .mt .mono{font-size:32px}
.bar{margin-top:14px;height:14px;border-radius:7px;background:rgba(136,146,164,.16)}
.bar .fill{height:100%;border-radius:7px;background:rgba(255,64,96,.36)}
.metric.on .bar .fill{background:var(--accent-red);box-shadow:0 0 18px rgba(255,64,96,.45)}
.bdk{font-size:22px;border:1.5px solid var(--rest-edge);color:var(--text-secondary);margin-left:4px}
.node.on .bdk{border-color:rgba(0,194,255,.70);color:var(--accent-cyan)}

/* batch-spot: the instance taken back (red), its warning, the job back on the queue */
.node.taken,.node.taken.on{border-color:var(--accent-red);border-style:dashed;
  background:linear-gradient(180deg,rgba(255,64,96,.13),rgba(255,64,96,.04)),var(--bg-card);
  box-shadow:0 0 0 1px rgba(255,64,96,.26),0 0 40px rgba(255,64,96,.24)}
.node.taken .ico,.node.taken.on .ico{color:var(--accent-red);opacity:1}
.node.taken .chip,.node.taken .chip.on{border-color:rgba(255,64,96,.45);background:rgba(255,64,96,.06);color:rgba(232,234,240,.55)}
.pill.tag.warn{background:var(--accent-red);color:var(--bg-deep);letter-spacing:.06em;font-size:22px;margin-left:auto}
.pill.tag.warn .mono{letter-spacing:0}
.node.row{width:700px;height:62px;display:flex;align-items:center;gap:16px;padding:0 10px 0 22px;border-radius:14px}
.tb{font-family:'DM Sans';font-weight:700;font-size:24px;color:var(--accent-red);white-space:nowrap}
.s3r{position:absolute;left:330px;top:36px;white-space:nowrap}

/* render-fanout: the chunks, the 200 functions, Remotion's note (a caveat: gold) */
.chunk{width:200px;height:56px;border-radius:10px;border:2px solid var(--rest-edge);
  background:repeating-linear-gradient(90deg,rgba(136,146,164,.10) 0 14px,transparent 14px 22px) top/100% 9px no-repeat,
             repeating-linear-gradient(90deg,rgba(136,146,164,.10) 0 14px,transparent 14px 22px) bottom/100% 9px no-repeat,
             var(--bg-card)}
.chunk.on{border-color:rgba(232,234,240,.66);box-shadow:0 0 0 1px rgba(232,234,240,.10),0 0 22px rgba(232,234,240,.06);
  background:repeating-linear-gradient(90deg,rgba(232,234,240,.26) 0 14px,transparent 14px 22px) top/100% 9px no-repeat,
             repeating-linear-gradient(90deg,rgba(232,234,240,.26) 0 14px,transparent 14px 22px) bottom/100% 9px no-repeat,
             var(--bg-card-hover)}
.fgrid rect{fill:rgba(136,146,164,.10);stroke:rgba(136,146,164,.36);stroke-width:1.5}
.fgrid.on rect{fill:rgba(0,194,255,.16);stroke:rgba(0,194,255,.85)}
.fgrid.on{filter:drop-shadow(0 0 7px rgba(0,194,255,.35))}
.node.pl{display:block;padding:0}
.note{border:2px solid rgba(255,215,0,.42);border-radius:18px;display:flex;align-items:center;justify-content:center;gap:72px;
  background:linear-gradient(180deg,rgba(255,215,0,.07),rgba(255,215,0,.02)),rgba(18,21,28,.62)}
.note .it{display:flex;flex-direction:column;align-items:flex-start;gap:6px;white-space:nowrap}
.note .sep{width:2px;height:54px;background:rgba(255,215,0,.30)}
.note .nl{font-family:'DM Sans';font-weight:700;font-size:22px;line-height:1.2;letter-spacing:.14em;text-transform:uppercase;color:var(--accent-gold)}
.note .nv{font-family:'DM Sans';font-weight:700;font-size:26px;line-height:1.2;letter-spacing:.06em;text-transform:uppercase;color:var(--text-primary)}
.note .nv .mono{font-size:29px;letter-spacing:0}

/* publish */
.chip .ico{margin-right:10px}
.chip.key{display:inline-flex;align-items:center}

/* watch: the agents (white when lit, never cyan), the readings */
.chip.agent{font-family:'JetBrains Mono',monospace;font-weight:600;font-size:24px;width:320px;height:50px;padding:0}
.node.rd{display:flex;align-items:center;gap:14px;padding:0 22px}
.rd.errs .ico{color:rgba(255,64,96,.62)} .rd.errs.on .ico{color:var(--accent-red)}
</style>
</head>

<script>
// chart.js builds a chart from ONE <template id="chart"> per buildChart() call. This file holds five charts, so each
// chart's template takes that id for its own call (chart.js is shared with group 1 and stays untouched).
function build(tid, states, opts) {
  var t = document.getElementById(tid);
  t.id = "chart";
  buildChart(states, opts);
  t.id = tid;
}
// render-fanout: up to 200 Lambda functions, drawn as 200 tiles (40 x 5), before the template is cloned
(function () {
  var NS = "http://www.w3.org/2000/svg", g = document.getElementById("t-render-fanout").content.querySelector(".fgrid");
  for (var r = 0; r < 5; r++) for (var c = 0; c < 40; c++) {
    var e = document.createElementNS(NS, "rect");
    e.setAttribute("x", c * 27 + 1); e.setAttribute("y", r * 27 + 1);
    e.setAttribute("width", 21); e.setAttribute("height", 21); e.setAttribute("rx", 4);
    g.appendChild(e);
  }
})();

build("t-images", {
  "images-before": { on: ["today"] },
  "images-after":  { on: ["aws", "swap", "cost"], show: ["cost"] }
});
build("t-batch-spot", {
  "batch-spot-reclaim": { on: ["spot", "w-spot", "retry", "s3", "w-s3spot", "disk", "sw-disk"],
                          show: ["retry", "warn"], cls: { taken: "taken" } },
  "batch-spot-gpu":     { on: ["g6", "w-g6", "whisper", "sw-gpu"] }
});
build("t-render-fanout", { "render-fanout": { on: ["aws", "today"] } });
build("t-publish", {
  "publish-schedule": { on: ["json", "sw1", "ddb", "w1", "sch", "w2", "lam"] },
  "publish-browser":  { on: ["scripts", "sw2", "br", "w-br", "api", "w-api"] }
});
build("t-watch", { "watch": { on: ["aws", "today"] } });
</script>
