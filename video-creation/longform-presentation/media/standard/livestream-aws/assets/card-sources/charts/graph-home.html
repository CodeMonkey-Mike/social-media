<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>livestream-aws chart: graph-home (runtime, checkpoint)</title>
<!--
  SYSTEM-DESIGN CHART, full-frame cover, 1920x1080, 2 states. SCRIPT.md CARDS row `graph-home`, CH3, TODAY beside ON AWS:
    runtime    "Each run gets its own microVM, a small, isolated virtual machine, for up to 8 hours. It bills by the
               second, and the CPU charge drops to zero while it waits on a model."
               -> TODAY a Python process, ON AWS AgentCore Runtime > a microVM > the graph's 14 nodes, UP TO 8 HOURS,
                  CPU BILLED AT ZERO WHILE IT WAITS, lit
    checkpoint "The checkpoints move too. Today they're in a SQLite file. On AWS, they go to DynamoDB, Amazon's managed
               database, through a LangGraph package called langgraph-checkpoint-aws."
               -> TODAY a SQLite file, ON AWS DynamoDB through langgraph-checkpoint-aws, lit
  The same graph sits in both columns (the real 14 steps, the clip-evals snake, the 2 human gates in gold): only its
  home changes. Facts: RESEARCH.md section 2 (14 nodes, SqliteSaver) and 3 (a dedicated microVM per session, up to
  8 hours; CPU scales to zero during I/O wait; langgraph-checkpoint-aws, DynamoDBSaver).
  Shoot (from this folder): python shoot.py graph-home.html --out ../../diagrams
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400;1,500&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="chart.css">
<link rel="stylesheet" href="group1.css">
<style>
.tn{font-family:'DM Sans';font-weight:700;font-size:28px;line-height:1.15}
.ts{font-family:'DM Sans';font-weight:500;font-size:24px;line-height:1.25;color:var(--rest-sub);margin-top:5px}
.td.on .ts{color:var(--lit-sub)}
.side{display:flex;align-items:center;gap:18px;padding:0 24px}
.tx{display:flex;flex-direction:column}
/* a box that holds other boxes: its name + description sit top-left */
.hold{display:block;padding:0}
.hold .hh{position:absolute;left:24px;top:16px;display:flex;align-items:baseline;gap:16px;white-space:nowrap}
.hold .hh .sd{margin-top:0}
.node.vm{background:var(--bg-card-hover)}
.node.vm.on{background:linear-gradient(180deg,rgba(0,194,255,.10),rgba(0,194,255,.03)),var(--bg-card-hover)}
/* the graph glyph */
.mg circle{fill:var(--bg-deep);stroke:rgba(232,234,240,.55);stroke-width:2.6}
.mg circle.g{stroke:rgba(255,215,0,.6);fill:rgba(255,215,0,.10)}
.mg path{stroke:rgba(136,146,164,.6);stroke-width:2.4;fill:none;stroke-linecap:round}
.on .mg circle{stroke:var(--text-primary)}
.on .mg circle.g{stroke:var(--accent-gold);fill:rgba(255,215,0,.18)}
.on .mg path{stroke:rgba(232,234,240,.7)}
.gl{position:absolute;font-family:'DM Sans';font-weight:600;font-size:24px;color:var(--rest-sub);white-space:nowrap}
.on .gl{color:var(--text-primary)}
/* the time tag on the microVM */
.ttag{position:absolute;right:18px;top:16px;display:flex;align-items:center;gap:10px;padding:8px 14px;border-radius:999px;
  border:1.5px solid var(--rest-edge);font-family:'DM Sans';font-weight:700;font-size:22px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--rest-sub);background:rgba(10,12,16,.6);white-space:nowrap}
.ttag .mono{font-size:24px;letter-spacing:0}
.ttag .ico{color:currentColor;opacity:1}
.on .ttag{border-color:var(--accent-cyan);color:var(--accent-cyan);background:rgba(0,194,255,.10)}
/* CPU billed at zero */
.cpu{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:16px;padding:0 20px}
.cpu .ib{display:flex;align-items:center;gap:12px}
.cpu .ico{color:var(--text-secondary)}
.cpu.on .ico{color:var(--accent-cyan)}
.cpu .lab{white-space:normal;text-wrap:balance;font-size:24px;line-height:1.3;color:var(--rest-sub)}
.cpu.on .lab{color:var(--accent-cyan)}
/* the CPU over time: busy segments filled, the waits on a model hollow */
.cbar{display:flex;gap:6px;height:22px;width:272px}
.cbar i{display:block;height:22px;border-radius:5px}
.cbar i.b{background:rgba(136,146,164,.45)}
.cbar i.w{border:2px dashed rgba(136,146,164,.45)}
.cpu.on .cbar i.b{background:var(--accent-cyan)}
.cpu.on .cbar i.w{border-color:rgba(0,194,255,.55)}
</style>
</head>
<body>
<template id="chart"></template>
<script src="chart.js"></script>
<script src="group1.js"></script>
<script>
(function () {
  function graphGlyph(dx, r, cls) {        // the real 14 steps: 1..7 left to right, 8..14 back; gates 6 and 9
    var X0 = r + 3, YT = r + 3, YB = r + 3 + Math.round(dx * 1.25), pts = {}, n;
    for (n = 1; n <= 14; n++) pts[n] = n <= 7 ? [X0 + (n - 1) * dx, YT] : [X0 + (14 - n) * dx, YB];
    var W = X0 * 2 + 6 * dx, H = YB + r + 3;
    var g = ['<svg class="mg' + (cls ? ' ' + cls : '') + '" width="' + W + '" height="' + H + '" viewBox="0 0 ' + W + ' ' + H + '">'];
    g.push('<path d="M' + pts[1][0] + ',' + YT + ' L' + pts[7][0] + ',' + YT + ' L' + pts[8][0] + ',' + YB + ' L' + pts[14][0] + ',' + YB + '"/>');
    for (n = 1; n <= 14; n++) g.push('<circle class="' + (n === 6 || n === 9 ? 'g' : '') + '" cx="' + pts[n][0] + '" cy="' + pts[n][1] + '" r="' + r + '"/>');
    g.push('</svg>');
    return { svg: g.join(''), w: W, h: H };
  }
  var h = [];
  h.push('<div class="stage">');
  h.push('<div class="orb" style="width:640px;height:640px;background:var(--accent-cyan);opacity:.12;left:-300px;top:-320px"></div>');
  h.push('<div class="orb" style="width:620px;height:620px;background:var(--accent-green);opacity:.06;left:1520px;top:760px"></div>');
  h.push('<div class="head"><h1>Where the graph runs</h1><div class="divider"></div></div>');

  // columns
  h.push('<div class="zone tz" style="left:120px;top:202px;width:446px;height:790px"></div>');
  h.push('<div class="zone" style="left:610px;top:202px;width:1190px;height:790px"></div>');
  h.push('<div class="colh today" data-own style="left:146px;top:222px">' + ICO("pc", 32, "", 2.2) + 'TODAY<span class="hs">my PC</span></div>');
  h.push('<div class="colh aws" data-own style="left:640px;top:222px">ON AWS</div>');

  var R1 = 520, R2 = 900;      // row centres: the runtime, the checkpoints
  // wires
  var w = [];
  w.push(WIRE("runtime", 'M542,' + R1 + ' L' + (640 - 5) + ',' + R1, "swap"));
  w.push(WIRE("checkpoint", 'M542,' + R2 + ' L' + (668 - 5) + ',' + R2, "swap"));
  w.push(WIRE("checkpoint", 'M344,' + (R1 + 132) + ' L344,' + (R2 - 64 - 5)));                  // today: process -> SQLite
  w.push(WIRE("checkpoint", 'M840,' + (R1 - 166 + 376 + 3) + ' L840,' + (R2 - 64 - 5)));                         // AWS: microVM -> DynamoDB
  h.push('<svg class="wires" width="1920" height="1080" viewBox="0 0 1920 1080">' + w.join('') + '</svg>');
  h.push('<div class="wl" data-k="checkpoint" style="left:364px;top:' + Math.round((R1 + 132 + R2 - 64) / 2 - 15) + 'px">checkpoints</div>');
  h.push('<div class="cd" data-k="checkpoint" style="left:866px;top:' + (R2 - 64 - 74) + 'px">langgraph-checkpoint-aws</div>');

  // TODAY: a Python process (the same graph inside), a SQLite file
  var gs = graphGlyph(48, 10);
  h.push('<div class="node td" data-k="runtime" style="left:146px;top:' + (R1 - 132) + 'px;width:396px;height:264px">' +
    '<div class="side" style="position:absolute;left:0;top:22px;padding:0 24px">' + ICO("py", 40, "", 1.9) +
    '<div class="tx"><div class="tn">a Python process</div><div class="ts">on my PC</div></div></div>' +
    '<div style="position:absolute;left:' + Math.round((396 - gs.w) / 2) + 'px;top:124px">' + gs.svg + '</div>' +
    '<div class="gl" style="left:0;right:0;text-align:center;top:' + (124 + gs.h + 6) + 'px">the graph</div></div>');
  h.push('<div class="node td side" data-k="checkpoint" style="left:146px;top:' + (R2 - 64) + 'px;width:396px;height:128px">' +
    ICO("db", 44, "", 1.9) + '<div class="tx"><div class="tn">a SQLite file</div><div class="ts">the checkpoints</div></div></div>');

  // ON AWS: AgentCore Runtime > microVM > the graph; CPU billed at zero
  h.push('<div class="node svc hold" data-k="runtime" style="left:640px;top:' + (R1 - 236) + 'px;width:1130px;height:472px">' +
    '<div class="hh"><span class="sn">AgentCore Runtime</span><span class="sd">hosting for agents</span></div></div>');
  var gb = graphGlyph(70, 13);
  h.push('<div class="node svc hold vm" data-k="runtime" style="left:668px;top:' + (R1 - 166) + 'px;width:690px;height:376px">' +
    '<div class="hh"><span class="sn">microVM</span></div>' +
    '<div class="sd" style="position:absolute;left:24px;top:58px">a small, isolated virtual machine</div>' +
    '<div class="ttag">' + ICO("clock", 24, "", 2.2) + 'up to <span class="mono">8</span> hours</div>' +
    '<div style="position:absolute;left:' + Math.round((690 - gb.w) / 2) + 'px;top:136px">' + gb.svg + '</div>' +
    '<div class="gl" style="left:0;right:0;text-align:center;top:' + (136 + gb.h + 10) + 'px">the graph, <span class="mono">14</span> nodes</div></div>');
  h.push('<div class="node cpu" data-k="runtime" style="left:1388px;top:' + (R1 - 166) + 'px;width:354px;height:376px">' +
    '<div class="ib">' + ICO("cpu", 56, "", 1.8) + ICO("pause", 40, "", 1.8) + '</div>' +
    '<div class="cbar"><i class="b" style="width:34px"></i><i class="w" style="width:92px"></i><i class="b" style="width:24px"></i>' +
    '<i class="w" style="width:70px"></i><i class="b" style="width:28px"></i></div>' +
    '<div class="lab">CPU billed at zero while it waits</div></div>');
  // DynamoDB
  h.push(SVC({ k: "checkpoint", x: 668, y: R2 - 64, w: 344, h: 128, name: "DynamoDB", desc: "managed database" }));
  h.push('</div>');
  document.getElementById("chart").innerHTML = h.join("");

  buildChart({
    "graph-home-runtime":    { on: ["runtime"] },
    "graph-home-checkpoint": { on: ["checkpoint"] }
  });
})();
</script>
</body>
</html>
