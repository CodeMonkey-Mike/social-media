<svg id="scene" xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"></svg>
<script>
// Seven genuinely different ways to DRAW the same scene: a person, a horse, a vault, three coins, a tree.
// Each vocabulary is its own set of draw functions with its own natural pen. Layout is identical so
// the drawings are the only variable: person at x=380, horse centered ~900, vault at 1300, coins at
// 1620, tree at 1800, ground at y=880.
const V = /*VOCAB*/{}/*END*/;
const svg = document.getElementById('scene');
const NS = 'http://www.w3.org/2000/svg';
const GY = 880;

function el(tag, attrs, parent) {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) if (attrs[k] !== null && attrs[k] !== undefined) e.setAttribute(k, attrs[k]);
  (parent || svg).appendChild(e);
  return e;
}
const defs = el('defs', {});
function bg(color) { el('rect', { x: 0, y: 0, width: 1920, height: 1080, fill: color }); }
function rrect(x, y, w, h, rx, fill, stroke, sw, parent, extra) {
  return el('rect', Object.assign({ x, y, width: w, height: h, rx, fill: fill || 'none', stroke: stroke || null, 'stroke-width': stroke ? (sw || 4) : null, 'stroke-linejoin': 'round' }, extra || {}), parent);
}
function circ(cx, cy, r, fill, stroke, sw, parent) {
  return el('circle', { cx, cy, r, fill: fill || 'none', stroke: stroke || null, 'stroke-width': stroke ? (sw || 4) : null }, parent);
}
function ell(cx, cy, rx, ry, fill, stroke, sw, parent, extra) {
  return el('ellipse', Object.assign({ cx, cy, rx, ry, fill: fill || 'none', stroke: stroke || null, 'stroke-width': stroke ? (sw || 4) : null }, extra || {}), parent);
}
function pth(d, fill, stroke, sw, parent, extra) {
  return el('path', Object.assign({ d, fill: fill || 'none', stroke: stroke || null, 'stroke-width': stroke ? (sw || 4) : null, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }, extra || {}), parent);
}
function poly(pts, fill, stroke, sw, parent) {
  return el('polygon', { points: pts.map(p => p.join(',')).join(' '), fill: fill || 'none', stroke: stroke || null, 'stroke-width': stroke ? (sw || 4) : null, 'stroke-linejoin': 'round' }, parent);
}
function ln(x1, y1, x2, y2, stroke, sw, parent, extra) {
  return el('line', Object.assign({ x1, y1, x2, y2, stroke, 'stroke-width': sw || 4, 'stroke-linecap': 'round' }, extra || {}), parent);
}
function txt(x, y, str, size, font, color, anchor, weight, maxW) {
  const t = el('text', { x, y, 'font-family': `'${font}', sans-serif`, 'font-size': size, fill: color, 'text-anchor': anchor || 'middle', 'font-weight': weight || 'normal' });
  t.textContent = str;
  if (maxW) t.setAttribute('data-maxw', maxW);
  return t;
}
function fitTexts() {
  document.querySelectorAll('text[data-maxw]').forEach(t => {
    const maxW = +t.getAttribute('data-maxw'); const len = t.getComputedTextLength();
    if (len > maxW) t.setAttribute('font-size', (+t.getAttribute('font-size')) * maxW / len);
  });
}
function shadow(cx, cy, rx, ry, color, op) { ell(cx, cy, rx, ry, color || '#000', null, null, null, { opacity: op || 0.08 }); }
function heading(fontH, fontL, colorH, colorL, sizeH) {
  txt(960, 130, V.name, sizeH || 82, fontH, colorH, 'middle', '700', 1700);
  txt(960, 190, V.blurb, 32, fontL, colorL, 'middle', 'normal', 1700);
}
// The horse silhouette authored for vocab.html (400x300 local box), reused by two vocabularies.
const HORSE_SIL = 'M 120 104 C 160 90, 200 92, 236 98 C 262 74, 292 54, 318 44 C 334 30, 362 34, 378 50 C 390 62, 398 74, 392 86 C 388 94, 374 96, 362 90 C 352 86, 344 82, 338 76 C 320 92, 302 112, 290 136 C 292 158, 286 178, 272 190 C 230 198, 170 198, 130 194 C 104 190, 94 170, 96 146 C 98 124, 106 108, 120 104 Z';
const HORSE_MANE = 'M 318 44 C 292 54, 262 74, 236 98 L 226 86 C 252 60, 284 40, 312 30 Z';
const HORSE_TAIL = 'M 108 112 C 80 124, 62 172, 74 224 C 82 228, 88 224, 90 218 C 84 188, 88 156, 112 132 Z';
const HORSE_EAR = 'M 326 42 L 322 22 L 342 36 Z';
const HORSE_LEGS = ['M 112 184 L 132 184 L 128 262 L 114 262 Z', 'M 236 184 L 256 184 L 254 262 L 240 262 Z', 'M 136 188 L 160 188 L 154 262 L 138 262 Z', 'M 256 186 L 278 186 L 276 262 L 260 262 Z'];
const HORSE_HOOVES = [[112, 128], [136, 154], [238, 254], [258, 276]].map(([a, b]) => `M ${a} 258 L ${b} 258 L ${b} 272 L ${a} 272 Z`);

const VOCABS = {};

// =====================================================================================
// 1. HAND-DRAWN WITH HAIR (rough.js pen, paper, pastel fills) — the vocab.html drawings
// =====================================================================================
VOCABS['stick-hair'] = function () {
  const INK = '#222', BROWN = '#c9a27e', DARK = '#3a2414', P = { blue: '#9ec5e8', gold: '#f3d27a', red: '#e98b8b', green: '#a7d8a2', grey: '#d8d8d8' };
  bg('#ffffff'); el('rect', { x: 0, y: 660, width: 1920, height: 420, fill: '#f6f1e6' });
  heading('Gochi Hand', 'Shadows Into Light', INK, '#444');
  const rc = rough.svg(svg); let seed = 3;
  const o = (fill, extra) => Object.assign({ roughness: 1.2, bowing: 1, stroke: INK, strokeWidth: 2.4, fillStyle: 'solid', seed: seed++, fill }, extra || {});
  const sh = (d, fill, extra, parent) => (parent || svg).appendChild(rc.path(d, o(fill, extra)));
  const dt = (cx, cy, r, fill, parent) => (parent || svg).appendChild(rc.circle(cx, cy, r * 2, o(fill, { fill, roughness: 0.5 })));
  ln(120, GY, 1900, GY, INK, 2.5);
  // horse
  shadow(900, GY + 4, 250, 12);
  const g = el('g', { transform: `translate(560 ${GY - 544}) scale(2)` });
  const ho = (fill) => ({ roughness: 0.6, strokeWidth: 1.3 });
  sh(HORSE_LEGS[0], BROWN, ho(), g); sh(HORSE_LEGS[1], BROWN, ho(), g);
  sh(HORSE_TAIL, DARK, ho(), g); sh(HORSE_SIL, BROWN, ho(), g); sh(HORSE_EAR, BROWN, ho(), g); sh(HORSE_MANE, DARK, ho(), g);
  sh('M 316 42 C 304 38, 296 46, 302 58 C 310 54, 316 48, 316 42 Z', DARK, ho(), g);
  sh(HORSE_LEGS[2], BROWN, ho(), g); sh(HORSE_LEGS[3], BROWN, ho(), g);
  HORSE_HOOVES.forEach(d => sh(d, '#f4f4f4', ho(), g));
  dt(350, 56, 4, DARK, g); dt(384, 80, 2.5, DARK, g); sh('M 388 90 L 378 92', null, { strokeWidth: 1.2 }, g);
  // person
  const x = 380, ty = GY - 215, by = GY - 112, hy = ty - 42;
  shadow(x, GY + 4, 44, 8);
  sh(`M ${x - 10} ${by} L ${x - 14} ${GY - 4}`); sh(`M ${x + 10} ${by} L ${x + 14} ${GY - 4}`);
  sh(`M ${x - 22} ${GY - 4} L ${x - 6} ${GY - 4}`); sh(`M ${x + 6} ${GY - 4} L ${x + 24} ${GY - 4}`);
  sh(`M ${x - 30} ${ty + 10} C ${x - 32} ${ty + 2}, ${x - 24} ${ty - 2}, ${x - 16} ${ty} L ${x + 16} ${ty} C ${x + 24} ${ty - 2}, ${x + 32} ${ty + 2}, ${x + 30} ${ty + 10} L ${x + 23} ${by} L ${x - 23} ${by} Z`, P.blue);
  sh(`M ${x - 29} ${ty + 14} L ${x - 36} ${ty + 96}`); sh(`M ${x + 29} ${ty + 14} L ${x + 36} ${ty + 96}`);
  dt(x - 37, ty + 102, 6, '#fff'); dt(x + 37, ty + 102, 6, '#fff');
  sh(`M ${x - 5} ${ty + 2} L ${x + 5} ${ty + 2} L ${x + 3} ${ty + 46} L ${x} ${ty + 54} L ${x - 3} ${ty + 46} Z`, P.green);
  dt(x, hy, 34, '#fff');
  dt(x + 6, hy - 4, 3.2, DARK); dt(x + 20, hy - 4, 3.2, DARK); sh(`M ${x + 8} ${hy + 14} L ${x + 18} ${hy + 13}`, null, { strokeWidth: 2 });
  sh(`M ${x - 34} ${hy - 4} C ${x - 32} ${hy - 44}, ${x + 32} ${hy - 44}, ${x + 34} ${hy - 4} C ${x + 22} ${hy - 18}, ${x - 2} ${hy - 24}, ${x - 34} ${hy - 4} Z`, DARK);
  // vault
  shadow(1410, GY + 4, 130, 10);
  sh(`M 1300 ${GY - 220} L 1520 ${GY - 220} L 1520 ${GY - 10} L 1300 ${GY - 10} Z`, P.grey);
  dt(1410, GY - 115, 56, '#fff'); dt(1410, GY - 115, 22, P.gold); sh(`M 1410 ${GY - 171} L 1410 ${GY - 59}`); sh(`M 1354 ${GY - 115} L 1466 ${GY - 115}`);
  // coins
  shadow(1620, GY + 4, 70, 8);
  for (const [cx, cy] of [[1590, GY - 46], [1660, GY - 46], [1625, GY - 126]]) { dt(cx, cy, 46, P.gold); txt(cx, cy + 16, '₿', 48, 'Gochi Hand', INK); }
  // tree
  shadow(1800, GY + 4, 60, 8);
  sh(`M 1790 ${GY} L 1792 ${GY - 90} L 1808 ${GY - 90} L 1810 ${GY} Z`, BROWN);
  sh(`M 1800 ${GY - 230} C 1860 ${GY - 230}, 1890 ${GY - 180}, 1870 ${GY - 130} C 1860 ${GY - 95}, 1740 ${GY - 95}, 1730 ${GY - 130} C 1710 ${GY - 180}, 1740 ${GY - 230}, 1800 ${GY - 230} Z`, P.green);
};

// =====================================================================================

  bg('#fbf7f0');
  heading('Baloo 2', 'Nunito', INK, '#555');
  ln(120, GY, 1900, GY, INK, 4);
  // horse: plump
  const cx = 880;
  shadow(cx + 40, GY + 6, 290, 14);
  for (const lx of [cx - 150, cx - 86, cx + 70, cx + 134]) { rrect(lx - 24, GY - 150, 48, 150, 24, C.horse, INK, SW); rrect(lx - 24, GY - 28, 48, 28, 12, '#f4f4f4', INK, SW); }
  // tail tufts
  for (const [tx, ty, r] of [[cx - 232, GY - 250, 30], [cx - 250, GY - 198, 26], [cx - 244, GY - 150, 22]]) circ(tx, ty, r, C.dark, INK, SW);
  // neck (thick capsule) BEFORE the body so the body covers the join, then the body, then mane + head
  ln(cx + 150, GY - 290, cx + 250, GY - 430, INK, 104); ln(cx + 150, GY - 290, cx + 250, GY - 430, C.horse, 96);
  ell(cx, GY - 230, 220, 130, C.horse, INK, SW);
  for (const [mx, my] of [[cx + 150, GY - 352], [cx + 192, GY - 412], [cx + 236, GY - 470]]) circ(mx, my, 28, C.dark, INK, SW);
  ell(cx + 300, GY - 440, 96, 66, C.horse, INK, SW);
  ell(cx + 352, GY - 428, 44, 36, C.muzzle, INK, SW);
  circ(cx + 372, GY - 436, 5, INK); pth(`M ${cx + 346} ${GY - 410} Q ${cx + 358} ${GY - 400} ${cx + 370} ${GY - 412}`, null, INK, 4);
  ell(cx + 262, GY - 502, 16, 30, C.horse, INK, SW, null, { transform: `rotate(-15 ${cx + 262} ${GY - 502})` });
  ell(cx + 298, GY - 506, 16, 30, C.horse, INK, SW, null, { transform: `rotate(10 ${cx + 298} ${GY - 506})` });
  circ(cx + 286, GY - 456, 14, '#fff', INK, 3); circ(cx + 290, GY - 454, 7, INK); circ(cx + 293, GY - 458, 2.5, '#fff');
  // person: tall pill, face on the body
  const x = 380;
  shadow(x, GY + 6, 70, 10);
  rrect(x - 36, GY - 52, 30, 52, 15, C.pants, INK, SW); rrect(x + 6, GY - 52, 30, 52, 15, C.pants, INK, SW);
  ell(x - 24, GY - 4, 26, 10, INK); ell(x + 24, GY - 4, 26, 10, INK);
  rrect(x - 62, GY - 300, 124, 262, 62, C.shirt, INK, SW);
  el('rect', { x: x - 118, y: GY - 196, width: 66, height: 26, rx: 13, fill: C.shirt, stroke: INK, 'stroke-width': SW, transform: `rotate(28 ${x - 85} ${GY - 183})` });
  el('rect', { x: x + 52, y: GY - 196, width: 66, height: 26, rx: 13, fill: C.shirt, stroke: INK, 'stroke-width': SW, transform: `rotate(-28 ${x + 85} ${GY - 183})` });
  circ(x + 8, GY - 236, 5.5, INK); circ(x + 34, GY - 236, 5.5, INK);
  pth(`M ${x + 8} ${GY - 210} Q ${x + 21} ${GY - 198} ${x + 34} ${GY - 210}`, null, INK, 4);
  circ(x + 48, GY - 220, 8, C.cheek); circ(x - 8, GY - 220, 8, C.cheek);
  pth(`M ${x - 60} ${GY - 252} C ${x - 58} ${GY - 310}, ${x + 58} ${GY - 310}, ${x + 60} ${GY - 252} C ${x + 30} ${GY - 266}, ${x - 20} ${GY - 272}, ${x - 60} ${GY - 252} Z`, C.dark, INK, SW);
  // vault: rounded, big dial
  shadow(1410, GY + 6, 130, 12);
  rrect(1300, GY - 224, 220, 224, 44, C.grey, INK, SW);
  rrect(1320, GY - 204, 180, 184, 34, C.greyD, null, null, null, { opacity: 0.35 });
  circ(1410, GY - 112, 58, '#fff', INK, SW); circ(1410, GY - 112, 24, C.gold, INK, SW);
  for (let i = 0; i < 4; i++) { const a = i * Math.PI / 2; ln(1410 + Math.cos(a) * 30, GY - 112 + Math.sin(a) * 30, 1410 + Math.cos(a) * 50, GY - 112 + Math.sin(a) * 50, INK, 5); }
  // coins: fat
  shadow(1625, GY + 6, 80, 10);
  for (const [kx, ky] of [[1588, GY - 48], [1662, GY - 48], [1625, GY - 128]]) { circ(kx, ky, 48, C.gold, INK, SW); circ(kx, ky, 34, C.goldD, null); txt(kx, ky + 16, '₿', 46, 'Baloo 2', C.gold, 'middle', '800'); }
  // tree: cloud canopy

  rrect(1786, GY - 110, 28, 110, 12, C.dark, INK, SW);
  for (const [tx, ty, r] of [[1800, GY - 230, 70], [1748, GY - 170, 52], [1852, GY - 170, 52], [1800, GY - 150, 56]]) circ(tx, ty, r, C.green, INK, SW);
  circ(1800, GY - 225, 44, C.greenD, null, null, null); circ(1800, GY - 225, 44, 'none', null);
};

// =====================================================================================

// =====================================================================================
VOCABS['geo-flat'] = function () {
  const C = { skin: '#f1c7a8', hair: '#2f2a3a', shirt: '#3b5bdb', pants: '#2b2d42', shoe: '#1b1c28', horse: '#b07a4b', horseD: '#7a4e2a', gold: '#f5b301', goldD: '#c98f00', green: '#40c057', greenD: '#2f9e44', grey: '#adb5bd', greyD: '#868e96', ground: '#dde1e7' };
  bg('#f4f6fa');
  heading('Nunito', 'Nunito', '#1f2430', '#5c6370');
  rrect(100, GY - 6, 1760, 12, 6, C.ground);
  // horse from rounded blocks
  const cx = 880;
  shadow(cx + 30, GY + 10, 280, 12, '#1f2430', 0.06);
  for (const lx of [cx - 165, cx - 95, cx + 65, cx + 135]) { rrect(lx - 25, GY - 160, 50, 160, 20, C.horse); rrect(lx - 25, GY - 34, 50, 34, 12, C.horseD); }
  el('rect', { x: cx - 250, y: GY - 300, width: 40, height: 180, rx: 20, fill: C.horseD, transform: `rotate(18 ${cx - 230} ${GY - 300})` });
  rrect(cx - 210, GY - 310, 420, 210, 90, C.horse);
  poly([[cx + 110, GY - 300], [cx + 200, GY - 300], [cx + 318, GY - 452], [cx + 236, GY - 490]], C.horse);
  poly([[cx + 110, GY - 300], [cx + 146, GY - 300], [cx + 262, GY - 480], [cx + 236, GY - 490]], C.horseD);
  el('rect', { x: cx + 230, y: GY - 520, width: 180, height: 92, rx: 44, fill: C.horse, transform: `rotate(-12 ${cx + 230} ${GY - 474})` });
  poly([[cx + 250, GY - 512], [cx + 262, GY - 566], [cx + 292, GY - 520]], C.horseD);
  circ(cx + 376, GY - 494, 7, C.horseD); circ(cx + 300, GY - 512, 12, '#fff'); circ(cx + 303, GY - 510, 6, C.pants);
  // person: geometric, faceless
  const x = 380;
  shadow(x, GY + 10, 60, 8, '#1f2430', 0.06);
  ln(x - 20, GY - 120, x - 28, GY - 14, C.pants, 30); ln(x + 20, GY - 120, x + 28, GY - 14, C.pants, 30);
  rrect(x - 50, GY - 22, 40, 22, 8, C.shoe); rrect(x + 12, GY - 22, 44, 22, 8, C.shoe);
  rrect(x - 46, GY - 270, 92, 160, 34, C.shirt);
  ln(x - 44, GY - 246, x - 72, GY - 136, C.shirt, 26); ln(x + 44, GY - 246, x + 72, GY - 136, C.shirt, 26);
  circ(x - 74, GY - 128, 13, C.skin); circ(x + 74, GY - 128, 13, C.skin);
  rrect(x - 12, GY - 288, 24, 30, 8, C.skin);
  circ(x, GY - 320, 40, C.skin);
  pth(`M ${x - 40} ${GY - 326} C ${x - 36} ${GY - 372}, ${x + 36} ${GY - 372}, ${x + 40} ${GY - 326} C ${x + 24} ${GY - 338}, ${x - 4} ${GY - 344}, ${x - 40} ${GY - 326} Z`, C.hair);
  // vault: two tones, dial cut-out
  shadow(1410, GY + 10, 130, 10, '#1f2430', 0.06);
  rrect(1300, GY - 224, 220, 224, 24, C.grey);
  rrect(1322, GY - 202, 176, 180, 16, C.greyD);
  circ(1410, GY - 112, 50, '#f4f6fa'); circ(1410, GY - 112, 32, C.shirt); circ(1410, GY - 112, 10, '#f4f6fa');
  rrect(1312, GY - 8, 40, 8, 4, C.greyD); rrect(1468, GY - 8, 40, 8, 4, C.greyD);
  // coins: two tones
  shadow(1625, GY + 10, 80, 8, '#1f2430', 0.06);
  for (const [kx, ky] of [[1588, GY - 46], [1662, GY - 46], [1625, GY - 126]]) { circ(kx, ky, 46, C.gold); circ(kx, ky, 32, C.goldD); txt(kx, ky + 15, '₿', 42, 'Nunito', C.gold, 'middle', '800'); }
  // tree: circle + rect, offset highlight

  rrect(1788, GY - 110, 24, 110, 8, C.horseD);
  circ(1800, GY - 220, 108, C.greenD); circ(1780, GY - 236, 86, C.green);

// =====================================================================================

// =====================================================================================
// 5. ISOMETRIC BLOCKS (three-tone cuboids on an iso grid)
// =====================================================================================
VOCABS['isometric'] = function () {
  const BG = '#eef1f5';
  bg(BG);
  const pat = el('pattern', { id: 'iso', width: 48, height: 28, patternUnits: 'userSpaceOnUse' }, defs);
  circ(0, 0, 1.4, '#9aa3b2', null, null, pat); circ(24, 14, 1.4, '#9aa3b2', null, null, pat);
  el('rect', { x: 0, y: 230, width: 1920, height: 850, fill: 'url(#iso)', opacity: 0.8 });
  heading('Nunito', 'Nunito', '#1f2430', '#5c6370');
  const R = [0.866, -0.5], L = [-0.866, -0.5];
  const P = (o, r, l, h) => [o[0] + R[0] * r + L[0] * l, o[1] + R[1] * r + L[1] * l - (h || 0)];
  // cuboid at bottom-front corner o, extents w (right axis), d (left axis), h (up); tones [top,left,right]
  function cuboid(o, w, d, h, t) {
    poly([P(o, 0, 0), P(o, 0, d), P(o, 0, d, h), P(o, 0, 0, h)], t[1]);
    poly([P(o, 0, 0), P(o, w, 0), P(o, w, 0, h), P(o, 0, 0, h)], t[2]);
    poly([P(o, 0, 0, h), P(o, w, 0, h), P(o, w, d, h), P(o, 0, d, h)], t[0]);
  }
