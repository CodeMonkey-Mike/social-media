<!doctype html><html><head><meta charset="utf-8"><style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@700;800&family=Inter:wght@400;600;700;800&display=swap');
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1920px;height:1080px;overflow:hidden}
  body{background:radial-gradient(1200px 800px at 50% 28%,#0d1a2b 0%,#070b16 60%,#04060d 100%);
    font-family:Inter,system-ui,sans-serif;color:#e8eef6;display:flex;flex-direction:column;justify-content:center;padding:80px 110px}
  .eyebrow{font-size:26px;letter-spacing:.32em;text-transform:uppercase;color:#2dd4bf;font-weight:800;margin-bottom:14px}
  h1{font-size:56px;font-weight:800;letter-spacing:-.02em;margin-bottom:52px;line-height:1.1}h1 .g{color:#2dd4bf}
  .stats{display:grid;grid-template-columns:1fr 1fr;gap:44px;margin-bottom:50px}
  .stat{border-radius:22px;padding:48px 50px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.12);border-left:8px solid #2dd4bf}
  .stat.t{border-left-color:#ffd166}
  .k{font-size:24px;letter-spacing:.14em;text-transform:uppercase;color:#8aa0b6;font-weight:800;margin-bottom:18px}
  .v{font-family:'JetBrains Mono';font-weight:800;font-size:76px;color:#fff;line-height:1}
  .stat.t .v{color:#ffd166}
  .sub{font-size:23px;color:#9fb3c8;margin-top:14px}
  .foot{font-size:30px;color:#b7c7d8}.foot b{color:#fff}
</style></head><body>
  <div class="eyebrow">Split-adjusted, done right</div>
  <h1>Roughly where it <span class="g">first launched</span></h1>
  <div class="stats">
    <div class="stat"><div class="k">vs the 2022 launch</div><div class="v">~flat</div><div class="sub">$0.021 launch, split-adjusted</div></div>
    <div class="stat t"><div class="k">vs the 2022 peak</div><div class="v">~-58%</div><div class="sub">$0.053 peak, split-adjusted</div></div>
  </div>
  <div class="foot">The market has had <b>plenty of chances</b> to price it.</div>
</body></html>
