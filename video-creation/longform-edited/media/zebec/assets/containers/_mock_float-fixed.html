<!doctype html><html><head><meta charset="utf-8"><style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@700;800&family=Inter:wght@400;600;700;800&display=swap');
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1920px;height:1080px;overflow:hidden}
  body{background:radial-gradient(1200px 800px at 50% 30%,#0d1a2b 0%,#070b16 60%,#04060d 100%);
    font-family:Inter,system-ui,sans-serif;color:#e8eef6;display:flex;flex-direction:column;justify-content:center;padding:80px 110px}
  .eyebrow{font-size:26px;letter-spacing:.32em;text-transform:uppercase;color:#2dd4bf;font-weight:800;margin-bottom:26px}
  .gone{font-size:52px;font-weight:800;color:#e8eef6;margin-bottom:56px;line-height:1.15}
  .gone .x{color:#ff6b6b;text-transform:uppercase}
  .fixed{border-radius:22px;padding:56px 60px;background:rgba(45,212,191,.07);border:1px solid rgba(45,212,191,.32);border-left:10px solid #2dd4bf;text-align:center}
  .fixed .k{font-size:30px;letter-spacing:.24em;text-transform:uppercase;color:#2dd4bf;font-weight:800;margin-bottom:18px}
  .fixed .v{font-family:'JetBrains Mono';font-weight:800;font-size:110px;color:#fff;line-height:1}
  .fixed .s{font-size:30px;color:#bfeee6;margin-top:16px}
</style></head><body>
  <div class="eyebrow">Think about what that changes</div>
  <div class="gone">The one force guaranteed to push the price down, month over month, is <span class="x">gone.</span></div>
  <div class="fixed"><div class="k">The float is fixed</div><div class="v">100B</div><div class="s">No more unlocks. No more.</div></div>
</body></html>
