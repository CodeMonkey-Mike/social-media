<!doctype html><html><head><meta charset="utf-8"><style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap');
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1920px;height:1080px;overflow:hidden}
  body{background:radial-gradient(1200px 800px at 50% 28%,#0d1a2b 0%,#070b16 60%,#04060d 100%);
    font-family:Inter,system-ui,sans-serif;color:#e8eef6;display:flex;flex-direction:column;justify-content:center;padding:80px 110px}
  .eyebrow{font-size:28px;letter-spacing:.34em;text-transform:uppercase;color:#2dd4bf;font-weight:800;margin-bottom:40px}
  .row{display:flex;align-items:center;gap:26px;font-size:48px;font-weight:800;margin-bottom:30px}
  .row .x{color:#ff6b6b;font-size:46px}
  .row.dim{color:#9fb3c8}
  .row .ch{color:#2dd4bf;font-size:46px}
  .row.hit{color:#fff}
  .fin{margin-top:34px;font-size:96px;font-weight:800;color:#ffd166;letter-spacing:.02em;text-shadow:0 0 60px rgba(255,209,102,.35)}
</style></head><body>
  <div class="eyebrow">Why I am bullish</div>
  <div class="row dim"><span class="x">&#10007;</span>Not because it is cheap</div>
  <div class="row hit"><span class="ch">&#10003;</span>The one thing that was capping us is out of the way</div>
  <div class="fin">FINALLY.</div>
</body></html>
