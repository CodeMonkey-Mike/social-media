<!doctype html><html><head><meta charset="utf-8"><style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap');
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1920px;height:1080px;overflow:hidden}
  body{background:radial-gradient(1200px 800px at 50% 30%,#0d1a2b 0%,#070b16 60%,#04060d 100%);
    font-family:Inter,system-ui,sans-serif;color:#e8eef6;display:flex;flex-direction:column;justify-content:center;padding:80px 110px}
  .eyebrow{font-size:26px;letter-spacing:.32em;text-transform:uppercase;color:#ffd166;font-weight:800;margin-bottom:20px}
  h1{font-size:76px;font-weight:800;letter-spacing:-.02em;margin-bottom:56px;line-height:1.05}h1 .g{color:#ffd166}
  .ans{border-radius:20px;padding:46px 52px;background:rgba(255,209,102,.06);border:1px solid rgba(255,209,102,.28);border-left:8px solid #ffd166;font-size:44px;font-weight:800;color:#fff}
  .ans span{color:#ffd166}
</style></head><body>
  <div class="eyebrow">The bad</div>
  <h1>Why is this still a <span class="g">penny stock?</span></h1>
  <div class="ans">Part of the answer: this is <span>not a fresh launch.</span></div>
</body></html>
