<!doctype html><html><head><meta charset="utf-8"><style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap');
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1920px;height:1080px;overflow:hidden}
  body{background:radial-gradient(1200px 800px at 50% 30%,#0d1a2b 0%,#070b16 60%,#04060d 100%);
    font-family:Inter,system-ui,sans-serif;color:#e8eef6;display:flex;flex-direction:column;justify-content:center;padding:80px 110px}
  .eyebrow{font-size:26px;letter-spacing:.32em;text-transform:uppercase;color:#2dd4bf;font-weight:800;margin-bottom:14px}
  h1{font-size:58px;font-weight:800;letter-spacing:-.02em;margin-bottom:64px;line-height:1.1}h1 .g{color:#2dd4bf}
  svg{width:100%}
  .node{fill:rgba(45,212,191,.08);stroke:#2dd4bf;stroke-width:3}
  .nt{fill:#fff;font-weight:800;font-size:38px;text-anchor:middle}
  .ns{fill:#bfeee6;font-size:22px;text-anchor:middle}
  .lk{stroke:#2dd4bf;stroke-width:8;fill:none}
  .breaker{fill:rgba(255,107,107,.06);stroke:#ff6b6b;stroke-width:2.5;stroke-dasharray:8 7}
  .bt{fill:#ff8a8a;font-size:26px;text-anchor:middle;font-weight:700}
  .gone{fill:#ff6b6b;font-size:40px;font-weight:800;text-anchor:middle;letter-spacing:.06em}
  .cross{stroke:#ff6b6b;stroke-width:6}
</style></head><body>
  <div class="eyebrow">The thing that always broke the link</div>
  <h1>Endless new supply is <span style="color:#ff8a8a">gone</span></h1>
  <svg viewBox="0 0 1520 420">
    <rect class="node" x="60" y="120" width="420" height="180" rx="20"/>
    <text class="nt" x="270" y="210">BUSINESS</text><text class="ns" x="270" y="248">real, measurable</text>
    <path class="lk" d="M 480 210 L 1040 210"/>
    <rect class="node" x="1040" y="120" width="420" height="180" rx="20"/>
    <text class="nt" x="1250" y="210">TOKEN</text><text class="ns" x="1250" y="248">fixed 100B float</text>
    <rect class="breaker" x="620" y="150" width="280" height="120" rx="14"/>
    <text class="bt" x="760" y="205">endless new supply</text>
    <line class="cross" x1="640" y1="165" x2="880" y2="255"/><line class="cross" x1="880" y1="165" x2="640" y2="255"/>
    <text class="gone" x="760" y="345">GONE</text>
  </svg>
</body></html>
