<!doctype html><html><head><meta charset="utf-8"><style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap');
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1920px;height:1080px;overflow:hidden}
  body{background:radial-gradient(1200px 800px at 50% 28%,#0d1a2b 0%,#070b16 60%,#04060d 100%);
    font-family:Inter,system-ui,sans-serif;color:#e8eef6;display:flex;flex-direction:column;justify-content:center;padding:80px 110px}
  .eyebrow{font-size:26px;letter-spacing:.32em;text-transform:uppercase;color:#2dd4bf;font-weight:800;margin-bottom:26px}
  .struck{font-size:44px;font-weight:800;color:#6b7f99;margin-bottom:56px}
  .struck s{text-decoration-color:#ff6b6b;text-decoration-thickness:5px}
  .struck .no{color:#ff6b6b}
  .chips{display:flex;gap:34px}
  .chip{flex:1;border-radius:20px;padding:52px 40px;text-align:center;background:rgba(45,212,191,.06);border:1px solid rgba(45,212,191,.3);border-top:6px solid #2dd4bf}
  .chip .m{font-size:56px;color:#2dd4bf;font-weight:800;line-height:1}
  .chip .n{font-size:34px;font-weight:800;color:#fff;margin-top:18px}
</style></head><body>
  <div class="eyebrow">Not a mystery project</div>
  <div class="struck"><s>Anonymous team?</s> &nbsp;<span class="no">NO.</span></div>
  <div class="chips">
    <div class="chip"><div class="m">&#10003;</div><div class="n">Real project</div></div>
    <div class="chip"><div class="m">&#10003;</div><div class="n">Real backing</div></div>
    <div class="chip"><div class="m">&#10003;</div><div class="n">Real utility</div></div>
  </div>
</body></html>
