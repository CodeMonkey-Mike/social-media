<!doctype html><html><head><meta charset="utf-8"><style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@700;800&family=Inter:wght@400;600;700;800&display=swap');
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1920px;height:1080px;overflow:hidden}
  body{background:radial-gradient(1200px 800px at 50% 28%,#0d1a2b 0%,#070b16 60%,#04060d 100%);
    font-family:Inter,system-ui,sans-serif;color:#e8eef6;display:flex;flex-direction:column;justify-content:center;padding:80px 110px}
  .eyebrow{font-size:26px;letter-spacing:.32em;text-transform:uppercase;color:#2dd4bf;font-weight:800;margin-bottom:14px}
  h1{font-size:58px;font-weight:800;letter-spacing:-.02em;margin-bottom:58px;line-height:1.1}h1 .g{color:#2dd4bf}
  .chips{display:flex;gap:34px;margin-bottom:56px}
  .chip{flex:1;border-radius:20px;padding:50px 40px;text-align:center;background:rgba(45,212,191,.06);border:1px solid rgba(45,212,191,.3);border-left:6px solid #2dd4bf}
  .chip .n{font-size:36px;font-weight:800;color:#fff}
  .chip .s{font-size:22px;color:#8aa0b6;margin-top:12px}
  .fig{text-align:center}
  .fig .big{font-family:'JetBrains Mono';font-weight:800;font-size:118px;color:#2dd4bf;line-height:1;text-shadow:0 0 60px rgba(45,212,191,.35)}
  .fig .cap{font-size:28px;color:#b7c7d8;margin-top:18px}
</style></head><body>
  <div class="eyebrow">Serious names attached</div>
  <h1>Blue-chip <span class="g">backers</span></h1>
  <div class="chips">
    <div class="chip"><div class="n">Circle</div><div class="s">USDC issuer</div></div>
    <div class="chip"><div class="n">Solana Ventures</div><div class="s">L1 backer</div></div>
    <div class="chip"><div class="n">Coinbase Ventures</div><div class="s">exchange arm</div></div>
  </div>
  <div class="fig"><div class="big">$28M+</div><div class="cap">raised across the three</div></div>
</body></html>
