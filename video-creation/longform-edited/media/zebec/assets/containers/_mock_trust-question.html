<!doctype html><html><head><meta charset="utf-8"><style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap');
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1920px;height:1080px;overflow:hidden}
  body{background:radial-gradient(1200px 800px at 50% 30%,#0d1a2b 0%,#070b16 60%,#04060d 100%);
    font-family:Inter,system-ui,sans-serif;color:#e8eef6;display:flex;flex-direction:column;justify-content:center;padding:80px 110px}
  .eyebrow{font-size:26px;letter-spacing:.32em;text-transform:uppercase;color:#ffd166;font-weight:800;margin-bottom:34px}
  .quote{border-radius:20px;padding:50px 56px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.14);border-left:8px solid #ffd166;margin-bottom:44px}
  .quote .q{font-size:60px;font-weight:800;color:#fff;line-height:1.1}
  .quote .src{font-size:26px;color:#9fb3c8;margin-top:18px}
  .me{font-size:40px;font-weight:800;color:#e8eef6}
  .me span{color:#2dd4bf}
</style></head><body>
  <div class="eyebrow">Attributed, not asserted</div>
  <div class="quote"><div class="q">&ldquo;A rug.&rdquo;</div><div class="src">some critics of ZBC</div></div>
  <div class="me">I am not saying that. <span>But there is history.</span></div>
</body></html>
