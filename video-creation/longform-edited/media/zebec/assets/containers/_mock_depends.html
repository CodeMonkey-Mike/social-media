<!doctype html><html><head><meta charset="utf-8"><style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap');
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1920px;height:1080px;overflow:hidden}
  body{background:radial-gradient(1200px 800px at 50% 28%,#0d1a2b 0%,#070b16 60%,#04060d 100%);
    font-family:Inter,system-ui,sans-serif;color:#e8eef6;display:flex;flex-direction:column;justify-content:center;padding:80px 110px}
  .eyebrow{font-size:26px;letter-spacing:.32em;text-transform:uppercase;color:#2dd4bf;font-weight:800;margin-bottom:14px}
  h1{font-size:58px;font-weight:800;letter-spacing:-.02em;margin-bottom:58px;line-height:1.1}h1 .g{color:#2dd4bf}
  .chips{display:flex;gap:34px}
  .chip{flex:1;border-radius:20px;padding:56px 38px;text-align:center;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.12);border-left:6px solid #ffd166}
  .chip .n{font-size:32px;letter-spacing:.08em;text-transform:uppercase;font-weight:800;color:#ffd166}
  .chip .d{font-size:23px;color:#9fb3c8;margin-top:14px;line-height:1.35}
</style></head><body>
  <div class="eyebrow">A matter of time...</div>
  <h1>But it <span class="g">depends</span></h1>
  <div class="chips">
    <div class="chip"><div class="n">The Market</div><div class="d">broad risk appetite for crypto</div></div>
    <div class="chip"><div class="n">The Bear Market</div><div class="d">how and when this cycle turns</div></div>
    <div class="chip"><div class="n">Outside Factors</div><div class="d">things none of us control</div></div>
  </div>
</body></html>
