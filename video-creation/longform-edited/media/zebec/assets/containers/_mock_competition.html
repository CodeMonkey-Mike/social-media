<!doctype html><html><head><meta charset="utf-8"><style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap');
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1920px;height:1080px;overflow:hidden}
  body{background:radial-gradient(1200px 800px at 50% 30%,#0d1a2b 0%,#070b16 60%,#04060d 100%);
    font-family:Inter,system-ui,sans-serif;color:#e8eef6;display:flex;flex-direction:column;justify-content:center;padding:80px 110px}
  .eyebrow{font-size:26px;letter-spacing:.32em;text-transform:uppercase;color:#2dd4bf;font-weight:800;margin-bottom:12px}
  h1{font-size:56px;font-weight:800;letter-spacing:-.02em;margin-bottom:60px}h1 .g{color:#2dd4bf}
  svg{width:100%}
  .machine{fill:rgba(120,140,170,.06);stroke:#6b7f99;stroke-width:2.5}
  .cog{fill:rgba(120,140,170,.1);stroke:#8aa0b6;stroke-width:2}
  .mt{fill:#dfe7f0;font-weight:800;font-size:32px;text-anchor:middle}.ms{fill:#8aa0b6;font-size:21px;text-anchor:middle}
  .zebec{fill:rgba(45,212,191,.1);stroke:#2dd4bf;stroke-width:3}
  .zt{fill:#2dd4bf;font-weight:800;font-size:28px;text-anchor:middle}.zs{fill:#bfeee6;font-size:19px;text-anchor:middle}
  .rail{stroke:#2dd4bf;stroke-width:4;stroke-dasharray:10 8;marker-end:url(#a)}
  .cap{fill:#b7c7d8;font-size:24px;text-anchor:middle}.cap b{fill:#fff}
</style></head><body>
  <div class="eyebrow">Who owns payroll already</div>
  <h1>Not killing ADP, <span class="g">becoming a rail inside it</span></h1>
  <svg viewBox="0 0 1520 470">
    <defs><marker id="a" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#2dd4bf"/></marker></defs>
    <!-- big incumbent machine -->
    <rect class="machine" x="470" y="40" width="1010" height="380" rx="22"/>
    <text class="mt" x="975" y="95">ADP  +  Microsoft</text>
    <text class="ms" x="975" y="130">full enterprise software + cloud + payroll bundle</text>
    <circle class="cog" cx="700" cy="270" r="70"/><text class="ms" x="700" y="277">HR / cloud</text>
    <circle class="cog" cx="975" cy="300" r="85"/><text class="ms" x="975" y="307">enterprise payroll</text>
    <circle class="cog" cx="1270" cy="270" r="70"/><text class="ms" x="1270" y="277">benefits</text>
    <!-- tiny zebec node plugging in -->
    <rect class="zebec" x="60" y="180" width="300" height="120" rx="16"/>
    <text class="zt" x="210" y="230">Zebec</text><text class="zs" x="210" y="262">a small crypto rail</text>
    <path class="rail" d="M 360 240 L 468 240"/>
    <text class="cap" x="760" y="455">The realistic path: <b>plug INTO the giants, not replace them.</b></text>
  </svg>
</body></html>
