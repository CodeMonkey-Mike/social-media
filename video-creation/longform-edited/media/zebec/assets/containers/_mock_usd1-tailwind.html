<!doctype html><html><head><meta charset="utf-8"><style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap');
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1920px;height:1080px;overflow:hidden}
  body{background:radial-gradient(1200px 800px at 50% 28%,#0d1a2b 0%,#070b16 60%,#04060d 100%);
    font-family:Inter,system-ui,sans-serif;color:#e8eef6;display:flex;flex-direction:column;justify-content:center;padding:80px 110px}
  .eyebrow{font-size:26px;letter-spacing:.32em;text-transform:uppercase;color:#2dd4bf;font-weight:800;margin-bottom:14px}
  h1{font-size:58px;font-weight:800;letter-spacing:-.02em;margin-bottom:60px;line-height:1.1}h1 .g{color:#2dd4bf}
  .chips{display:flex;gap:36px}
  .chip{flex:1;border-radius:20px;padding:60px 40px;text-align:center;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.12);border-bottom:6px solid #2dd4bf}
  .chip .n{font-size:38px;letter-spacing:.1em;text-transform:uppercase;font-weight:800;color:#fff}
  .chip .d{font-size:23px;color:#9fb3c8;margin-top:16px;line-height:1.35}
  .chip.hot .n{color:#ffd166}.chip.hot{border-bottom-color:#ffd166}
  .foot{margin-top:56px;font-size:28px;color:#b7c7d8;text-align:center}.foot b{color:#fff}
</style></head><body>
  <div class="eyebrow">Whatever you think of it politically</div>
  <h1>A stablecoin with <span class="g">that name</span> is a tailwind</h1>
  <div class="chips">
    <div class="chip"><div class="n">Distribution</div><div class="d">USD1 payroll reaches tens of thousands</div></div>
    <div class="chip"><div class="n">Narrative</div><div class="d">a story the market pays attention to</div></div>
    <div class="chip hot"><div class="n">Tailwind</div><div class="d">right market, right moment</div></div>
  </div>
  <div class="foot">It is <b>distribution</b>. It is a <b>narrative</b>. And right now, that is a tailwind.</div>
</body></html>
