<!doctype html><html><head><meta charset="utf-8"><style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap');
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1920px;height:1080px;overflow:hidden}
  body{background:radial-gradient(1200px 800px at 50% 30%,#0d1a2b 0%,#070b16 60%,#04060d 100%);
    font-family:Inter,system-ui,sans-serif;color:#e8eef6;display:flex;flex-direction:column;justify-content:center;padding:80px 110px}
  .eyebrow{font-size:26px;letter-spacing:.32em;text-transform:uppercase;color:#2dd4bf;font-weight:800;margin-bottom:26px}
  .flow{display:flex;align-items:center;gap:44px;margin-bottom:64px}
  .word{font-size:82px;font-weight:800;letter-spacing:-.02em}
  .old{color:#6b7f99}
  .arr{font-size:70px;color:#2dd4bf;font-weight:800}
  .new{color:#2dd4bf}
  .gloss{border-radius:20px;padding:44px 50px;background:rgba(45,212,191,.06);border:1px solid rgba(45,212,191,.28);border-left:8px solid #2dd4bf;font-size:34px;color:#dbe6f0}
  .gloss b{color:#fff;font-weight:800}
</style></head><body>
  <div class="eyebrow">The pivot</div>
  <div class="flow"><span class="word old">Streaming</span><span class="arr">&rarr;</span><span class="word new">PayFi</span></div>
  <div class="gloss"><b>PayFi</b> = payment-focused crypto finance: real payroll, a card, and an app.</div>
</body></html>
