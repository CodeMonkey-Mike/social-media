<!doctype html><html><head><meta charset="utf-8"><style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap');
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1920px;height:1080px;overflow:hidden}
  body{background:radial-gradient(1200px 800px at 50% 30%,#0d1a2b 0%,#070b16 60%,#04060d 100%);
    font-family:Inter,system-ui,sans-serif;color:#e8eef6;display:flex;flex-direction:column;justify-content:center;padding:80px 110px}
  .eyebrow{font-size:26px;letter-spacing:.32em;text-transform:uppercase;color:#2dd4bf;font-weight:800;margin-bottom:26px}
  h1{font-size:66px;font-weight:800;letter-spacing:-.02em;margin-bottom:56px;line-height:1.1}h1 .g{color:#ffd166}
  .warn{display:inline-flex;align-items:center;gap:22px;border-radius:18px;padding:34px 44px;background:rgba(255,107,107,.08);border:1px solid rgba(255,107,107,.35);border-left:8px solid #ff6b6b}
  .warn .ic{font-size:44px}
  .warn .t{font-size:36px;font-weight:800;color:#ffb3b3}
</style></head><body>
  <div class="eyebrow">Bullish, but honest</div>
  <h1>I should not have to <span class="g">squint</span> to see who is in charge.</h1>
  <div class="warn"><span class="ic">&#9888;</span><span class="t">A type of discrepancy I do not care for.</span></div>
</body></html>
