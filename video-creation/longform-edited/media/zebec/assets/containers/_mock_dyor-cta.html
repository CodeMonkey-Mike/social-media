<!doctype html><html><head><meta charset="utf-8"><style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap');
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1920px;height:1080px;overflow:hidden}
  body{background:radial-gradient(1200px 800px at 50% 30%,#0d1a2b 0%,#070b16 60%,#04060d 100%);
    font-family:Inter,system-ui,sans-serif;color:#e8eef6;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:80px 110px}
  .eyebrow{font-size:26px;letter-spacing:.32em;text-transform:uppercase;color:#2dd4bf;font-weight:800;margin-bottom:30px}
  .chips{display:flex;gap:34px;margin-bottom:70px}
  .chip{border-radius:16px;padding:28px 48px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.16);border-bottom:5px solid #2dd4bf;font-size:34px;font-weight:800;letter-spacing:.08em;color:#fff}
  .like{display:inline-flex;align-items:center;gap:30px;background:rgba(45,212,191,.1);border:2px solid #2dd4bf;border-radius:26px;padding:38px 70px;box-shadow:0 0 70px rgba(45,212,191,.35)}
  .thumb{font-size:96px;line-height:1;filter:drop-shadow(0 0 20px rgba(45,212,191,.5))}
  .like .t{font-size:52px;font-weight:800;color:#2dd4bf}
</style></head><body>
  <div class="eyebrow">Nothing here is financial advice</div>
  <div class="chips"><div class="chip">NFA</div><div class="chip">DYOR</div></div>
  <div class="like"><span class="thumb">&#128077;</span><span class="t">Click that Like button</span></div>
</body></html>
