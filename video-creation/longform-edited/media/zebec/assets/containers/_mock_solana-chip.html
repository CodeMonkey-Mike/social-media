<!doctype html><html><head><meta charset="utf-8"><style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap');
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1920px;height:1080px;overflow:hidden}
  body{background:radial-gradient(1200px 800px at 50% 30%,#0d1a2b 0%,#070b16 60%,#04060d 100%);
    font-family:Inter,system-ui,sans-serif;color:#e8eef6;display:flex;flex-direction:column;justify-content:center;padding:80px 110px}
  .eyebrow{font-size:26px;letter-spacing:.32em;text-transform:uppercase;color:#2dd4bf;font-weight:800;margin-bottom:14px}
  h1{font-size:58px;font-weight:800;letter-spacing:-.02em;margin-bottom:50px;line-height:1.1}h1 .g{color:#2dd4bf}
  .card{border-radius:22px;padding:52px 56px;background:rgba(45,212,191,.06);border:1px solid rgba(45,212,191,.3);border-left:8px solid #2dd4bf;display:flex;align-items:center;gap:40px;margin-bottom:44px}
  .mark{width:120px;height:120px;border-radius:24px;background:linear-gradient(135deg,#9945FF,#14F195);flex:none;box-shadow:0 0 50px rgba(20,241,149,.3)}
  .card .n{font-size:46px;font-weight:800;color:#fff}
  .card .s{font-size:26px;color:#bfeee6;margin-top:10px}
  .struck{font-size:34px;color:#6b7f99;text-decoration:line-through;text-decoration-color:#ffd166;text-decoration-thickness:4px}
</style></head><body>
  <div class="eyebrow">Why Solana</div>
  <h1>Built on <span class="g">Solana</span></h1>
  <div class="card"><div class="mark"></div><div><div class="n">Cheap, fast rails</div><div class="s">you need it cheap to stream pay by the second</div></div></div>
  <div class="struck">But streaming pay by itself never really caught on.</div>
</body></html>
