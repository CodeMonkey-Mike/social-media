<!doctype html><html><head><meta charset="utf-8"><style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap');
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1920px;height:1080px;overflow:hidden}
  body{background:radial-gradient(1200px 800px at 50% 30%,#0d1a2b 0%,#070b16 60%,#04060d 100%);
    font-family:Inter,system-ui,sans-serif;color:#e8eef6;display:flex;flex-direction:column;justify-content:center;padding:80px 110px}
  .eyebrow{font-size:26px;letter-spacing:.32em;text-transform:uppercase;color:#ffd166;font-weight:800;margin-bottom:26px}
  .lead{font-size:38px;color:#9fb3c8;margin-bottom:40px}
  h1{font-size:72px;font-weight:800;letter-spacing:-.02em;margin-bottom:44px;line-height:1.06}h1 .g{color:#ffd166}
  .ans{font-size:44px;font-weight:800;color:#fff}
  .ans span{color:#ffd166}
</style></head><body>
  <div class="eyebrow">One last thing... it bugs me</div>
  <div class="lead">When I went digging on who actually runs this company,</div>
  <h1>Who actually <span class="g">runs</span> this company?</h1>
  <div class="ans">I got <span>different answers.</span></div>
</body></html>
