<!doctype html><html><head><meta charset="utf-8"><style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap');
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1920px;height:1080px;overflow:hidden}
  body{background:radial-gradient(1200px 800px at 50% 28%,#0d1a2b 0%,#070b16 60%,#04060d 100%);
    font-family:Inter,system-ui,sans-serif;color:#e8eef6;display:flex;flex-direction:column;justify-content:center;padding:80px 110px}
  .eyebrow{font-size:26px;letter-spacing:.32em;text-transform:uppercase;color:#2dd4bf;font-weight:800;margin-bottom:34px}
  h1{font-size:60px;font-weight:800;letter-spacing:-.02em;margin-bottom:48px;line-height:1.08}h1 .g{color:#2dd4bf}
  .row{display:flex;align-items:center;gap:24px;border-radius:18px;padding:34px 44px;background:rgba(255,255,255,.03);border-left:8px solid #2dd4bf;font-size:38px;font-weight:800;color:#fff;margin-bottom:26px}
  .row .n{font-family:'JetBrains Mono';color:#2dd4bf;font-weight:800}
  .row.q{border-left-color:#ffd166}
  .row.q .n{color:#ffd166}
  .row span{color:#2dd4bf}
</style></head><body>
  <div class="eyebrow">Here it is the other way around</div>
  <h1>The business is <span class="g">real.</span></h1>
  <div class="row"><span class="n">01</span>Not even debatable</div>
  <div class="row q"><span class="n">02</span>&nbsp;The only question left: does it pull the <span style="color:#ffd166">&nbsp;token&nbsp;</span> up?</div>
</body></html>
