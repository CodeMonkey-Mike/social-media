<!doctype html><html><head><meta charset="utf-8"><style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap');
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1920px;height:1080px;overflow:hidden}
  body{background:radial-gradient(1200px 800px at 50% 28%,#0d1a2b 0%,#070b16 60%,#04060d 100%);
    font-family:Inter,system-ui,sans-serif;color:#e8eef6;display:flex;flex-direction:column;justify-content:center;padding:80px 110px}
  .eyebrow{font-size:26px;letter-spacing:.32em;text-transform:uppercase;color:#2dd4bf;font-weight:800;margin-bottom:14px}
  h1{font-size:58px;font-weight:800;letter-spacing:-.02em;margin-bottom:58px;line-height:1.1}h1 .g{color:#2dd4bf}
  .chips{display:flex;gap:36px}
  .chip{flex:1;border-radius:20px;padding:52px 44px;text-align:center;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.12)}
  .chip .n{font-size:30px;letter-spacing:.16em;text-transform:uppercase;font-weight:800;margin-bottom:16px}
  .chip .d{font-size:24px;color:#9fb3c8;line-height:1.35}
  .chip.g1{border-color:rgba(45,212,191,.35);border-top:6px solid #2dd4bf}.chip.g1 .n{color:#2dd4bf}
  .chip.b1{border-color:rgba(255,209,102,.35);border-top:6px solid #ffd166}.chip.b1 .n{color:#ffd166}
  .chip.w1{border-color:rgba(147,197,253,.35);border-top:6px solid #93c5fd}.chip.w1 .n{color:#93c5fd}
  .foot{margin-top:56px;font-size:40px;font-weight:800;text-align:center;color:#e8eef6}
  .foot .a{color:#2dd4bf}
</style></head><body>
  <div class="eyebrow">Here is the plan</div>
  <h1>The good, the bad, and the <span class="g">why</span></h1>
  <div class="chips">
    <div class="chip g1"><div class="n">The Good</div><div class="d">real revenue, real adoption, blue-chip backers</div></div>
    <div class="chip b1"><div class="n">The Bad</div><div class="d">penny-stock history, VC insiders, open questions</div></div>
    <div class="chip w1"><div class="n">The Why</div><div class="d">the unlocks are finally over</div></div>
  </div>
  <div class="foot">And honestly... I am <span class="a">BULLISH.</span></div>
</body></html>
