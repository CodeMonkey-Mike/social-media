<!doctype html><html><head><meta charset="utf-8"><style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap');
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1920px;height:1080px;overflow:hidden}
  body{background:radial-gradient(1200px 800px at 50% 30%,#0d1a2b 0%,#070b16 60%,#04060d 100%);
    font-family:Inter,system-ui,sans-serif;color:#e8eef6;display:flex;flex-direction:column;justify-content:center;padding:80px 110px}
  .eyebrow{font-size:26px;letter-spacing:.32em;text-transform:uppercase;color:#ffd166;font-weight:800;margin-bottom:24px}
  h1{font-size:56px;font-weight:800;letter-spacing:-.02em;margin-bottom:50px;line-height:1.1}h1 .g{color:#ffd166}
  .old{font-size:30px;color:#8aa0b6;margin-bottom:40px}
  .card{border-radius:20px;padding:50px 56px;background:rgba(45,212,191,.07);border:1px solid rgba(45,212,191,.32);border-left:8px solid #2dd4bf}
  .card .big{font-size:48px;font-weight:800;color:#fff;line-height:1.15}
  .card .big span{color:#2dd4bf}
  .card .sub{font-size:30px;color:#bfeee6;margin-top:16px}
</style></head><body>
  <div class="eyebrow">Older reports</div>
  <h1>Even the app and <span class="g">code activity</span> got questioned</h1>
  <div class="old">App health, GitHub activity, on-chain flags, all from older teardowns.</div>
  <div class="card"><div class="big">Do not repeat old flags. <span>CHECK them.</span></div><div class="sub">And so should you.</div></div>
</body></html>
