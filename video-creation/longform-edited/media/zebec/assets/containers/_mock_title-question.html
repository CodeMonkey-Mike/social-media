<!doctype html><html><head><meta charset="utf-8"><style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap');
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1920px;height:1080px;overflow:hidden}
  body{background:radial-gradient(1200px 800px at 50% 30%,#0d1a2b 0%,#070b16 60%,#04060d 100%);
    font-family:Inter,system-ui,sans-serif;color:#e8eef6;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:80px 120px}
  .pre{font-size:34px;color:#9fb3c8;margin-bottom:36px}
  .pre b{color:#2dd4bf;font-weight:800}
  .eyebrow{font-size:28px;letter-spacing:.34em;text-transform:uppercase;color:#2dd4bf;font-weight:800;margin-bottom:26px}
  .ticker{display:inline-flex;align-items:center;gap:22px;margin-bottom:30px}
  .logo{width:96px;height:96px;border-radius:50%;background:linear-gradient(135deg,#2dd4bf,#0f7d70);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:46px;color:#04121a;box-shadow:0 0 60px rgba(45,212,191,.4)}
  h1{font-size:104px;font-weight:800;letter-spacing:-.02em;line-height:1.02}
  h1 .a{color:#ffd166}
</style></head><body>
  <div class="pre">Is this real? &nbsp;&rarr;&nbsp; <b>It IS real.</b></div>
  <div class="eyebrow">The real question</div>
  <div class="ticker"><div class="logo">Z</div><div style="font-size:56px;font-weight:800;color:#2dd4bf;letter-spacing:.04em">ZBCN</div></div>
  <h1>About to go <span class="a">vertical?</span></h1>
</body></html>
