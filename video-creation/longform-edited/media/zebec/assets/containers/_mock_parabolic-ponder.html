<!doctype html><html><head><meta charset="utf-8"><style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap');
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1920px;height:1080px;overflow:hidden}
  body{background:radial-gradient(1200px 800px at 50% 40%,#0d1a2b 0%,#070b16 60%,#04060d 100%);
    font-family:Inter,system-ui,sans-serif;color:#e8eef6;position:relative;padding:80px 110px}
  .txt{position:absolute;top:110px;left:110px;z-index:2}
  .eyebrow{font-size:26px;letter-spacing:.32em;text-transform:uppercase;color:#2dd4bf;font-weight:800;margin-bottom:16px}
  h1{font-size:60px;font-weight:800;letter-spacing:-.02em;line-height:1.1;max-width:1100px}h1 .g{color:#ffd166}
  svg{position:absolute;inset:0;width:1920px;height:1080px;z-index:1}
</style></head><body>
  <svg viewBox="0 0 1920 1080" preserveAspectRatio="none">
    <defs><linearGradient id="c" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#2dd4bf"/><stop offset="1" stop-color="#ffd166"/></linearGradient>
    <filter id="gl"><feGaussianBlur stdDeviation="10" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
    <path d="M 120 960 C 900 940, 1350 860, 1600 200 C 1650 80, 1680 60, 1720 40" fill="none" stroke="url(#c)" stroke-width="10" stroke-linecap="round" filter="url(#gl)"/>
  </svg>
  <div class="txt">
    <div class="eyebrow">When everything goes parabolic</div>
    <h1>A question to <span class="g">ponder</span></h1>
  </div>
</body></html>
