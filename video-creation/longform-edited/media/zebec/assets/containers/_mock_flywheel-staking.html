<!doctype html><html><head><meta charset="utf-8"><style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap');
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1920px;height:1080px;overflow:hidden}
  body{background:radial-gradient(1200px 800px at 50% 30%,#0d1a2b 0%,#070b16 60%,#04060d 100%);
    font-family:Inter,system-ui,sans-serif;color:#e8eef6;display:flex;flex-direction:column;justify-content:center;padding:80px 110px}
  .eyebrow{font-size:26px;letter-spacing:.32em;text-transform:uppercase;color:#2dd4bf;font-weight:800;margin-bottom:14px}
  h1{font-size:58px;font-weight:800;letter-spacing:-.02em;margin-bottom:70px;line-height:1.1}h1 .g{color:#2dd4bf}
  svg{width:100%}
  .node{fill:rgba(45,212,191,.08);stroke:#2dd4bf;stroke-width:3}
  .nt{fill:#fff;font-weight:800;font-size:34px;text-anchor:middle}
  .ns{fill:#9fb3c8;font-size:22px;text-anchor:middle}
  .flow{stroke:#2dd4bf;stroke-width:5;fill:none}
</style></head><body>
  <div class="eyebrow">Stake it in the app</div>
  <h1>Rewards on your <span class="g">card spending</span> pull more off the market</h1>
  <svg viewBox="0 0 1520 380">
    <defs><marker id="a" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#2dd4bf"/></marker></defs>
    <rect class="node" x="30" y="120" width="380" height="150" rx="18"/>
    <text class="nt" x="220" y="185">Stake ZBCN</text><text class="ns" x="220" y="222">in the SuperApp</text>
    <path class="flow" d="M 410 195 L 560 195" marker-end="url(#a)"/>
    <rect class="node" x="560" y="120" width="380" height="150" rx="18"/>
    <text class="nt" x="750" y="185">Card rewards</text><text class="ns" x="750" y="222">on real spending</text>
    <path class="flow" d="M 940 195 L 1090 195" marker-end="url(#a)"/>
    <rect class="node" x="1090" y="120" width="380" height="150" rx="18"/>
    <text class="nt" x="1280" y="180">Supply off</text><text class="nt" x="1280" y="220">the market</text>
  </svg>
</body></html>
