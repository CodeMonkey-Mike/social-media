<!doctype html><html><head><meta charset="utf-8"><style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap');
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1920px;height:1080px;overflow:hidden}
  body{background:radial-gradient(1200px 800px at 50% 26%,#0d1a2b 0%,#070b16 60%,#04060d 100%);
    font-family:Inter,system-ui,sans-serif;color:#e8eef6;display:flex;flex-direction:column;justify-content:center;padding:76px 110px}
  .eyebrow{font-size:26px;letter-spacing:.32em;text-transform:uppercase;color:#ffd166;font-weight:800;margin-bottom:14px}
  h1{font-size:54px;font-weight:800;letter-spacing:-.02em;margin-bottom:40px;line-height:1.1}h1 .g{color:#2dd4bf}
  .names{display:flex;gap:22px;margin-bottom:48px;flex-wrap:wrap}
  .name{border-radius:14px;padding:22px 34px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.16);font-size:30px;font-weight:800;color:#dfe7f0}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:40px}
  .box{border-radius:20px;padding:44px 46px;border:1px solid rgba(255,255,255,.12)}
  .box.good{background:rgba(45,212,191,.07);border-color:rgba(45,212,191,.32)}
  .box.bad{background:rgba(255,107,107,.07);border-color:rgba(255,107,107,.32)}
  .box .m{font-size:44px;font-weight:800;line-height:1}
  .box.good .m{color:#2dd4bf}.box.bad .m{color:#ff6b6b}
  .box .t{font-size:30px;color:#e8eef6;margin-top:16px;font-weight:600}
</style></head><body>
  <div class="eyebrow">Hold that thought</div>
  <h1>Some <span class="g">serious names</span> attached to it</h1>
  <div class="names"><div class="name">Circle</div><div class="name">Solana Ventures</div><div class="name">Coinbase Ventures</div></div>
  <div class="two">
    <div class="box good"><div class="m">&#10003;</div><div class="t">The best thing about it</div></div>
    <div class="box bad"><div class="m">&#9888;</div><div class="t">And one of the problems</div></div>
  </div>
</body></html>
