<!doctype html><html><head><meta charset="utf-8"><style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap');
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1920px;height:1080px;overflow:hidden}
  body{background:radial-gradient(1200px 800px at 50% 28%,#0d1a2b 0%,#070b16 60%,#04060d 100%);
    font-family:Inter,system-ui,sans-serif;color:#e8eef6;display:flex;flex-direction:column;justify-content:center;padding:80px 110px}
  .eyebrow{font-size:26px;letter-spacing:.32em;text-transform:uppercase;color:#2dd4bf;font-weight:800;margin-bottom:34px}
  .check{display:flex;align-items:center;gap:24px;font-size:40px;font-weight:700;color:#dbe6f0;margin-bottom:26px}
  .check .b{width:44px;height:44px;border-radius:10px;border:3px solid #2dd4bf;flex:none;display:flex;align-items:center;justify-content:center;color:#2dd4bf;font-size:30px;font-weight:800}
  .looks{font-size:46px;font-weight:800;color:#fff;margin:38px 0 30px}
  .looks span{color:#2dd4bf}
  .up{display:inline-flex;align-items:center;gap:20px;font-size:56px;font-weight:800;color:#ffd166}
  .up .arr{font-size:56px}
</style></head><body>
  <div class="eyebrow">Keeping it honest</div>
  <div class="check"><span class="b">&#10003;</span>Revenue still has to grow</div>
  <div class="check"><span class="b">&#10003;</span>The company still has to execute</div>
  <div class="looks">But it looks good, and <span>crypto is the future.</span></div>
  <div class="up"><span class="arr">&rarr;</span> upside</div>
</body></html>
