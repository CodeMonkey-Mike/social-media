<!doctype html><html><head><meta charset="utf-8"><style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap');
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1920px;height:1080px;overflow:hidden}
  body{background:radial-gradient(1200px 800px at 50% 26%,#241016 0%,#140a10 55%,#0a0608 100%);
    font-family:Inter,system-ui,sans-serif;color:#f4e8ec;display:flex;flex-direction:column;justify-content:center;padding:76px 110px}
  .eyebrow{font-size:26px;letter-spacing:.32em;text-transform:uppercase;color:#ff6b6b;font-weight:800;margin-bottom:14px}
  h1{font-size:56px;font-weight:800;letter-spacing:-.02em;margin-bottom:40px;line-height:1.1}h1 .g{color:#ff8a8a}
  .names{display:flex;gap:22px;margin-bottom:48px;flex-wrap:wrap}
  .name{border-radius:14px;padding:22px 34px;background:rgba(255,107,107,.08);border:1px solid rgba(255,107,107,.3);font-size:30px;font-weight:800;color:#ffd3d3}
  .row{border-radius:18px;padding:34px 44px;background:rgba(255,255,255,.03);border-left:8px solid #ff6b6b;font-size:38px;font-weight:800;color:#fff;margin-bottom:26px}
  .row.dim{color:#e7c9cf;font-weight:700}
  .row span{color:#ff8a8a}
</style></head><body>
  <div class="eyebrow">Remember those serious names</div>
  <h1>The opposite of a <span class="g">fair launch</span></h1>
  <div class="names"><div class="name">Circle</div><div class="name">Coinbase</div><div class="name">Solana Ventures</div></div>
  <div class="row">Insiders have a <span>cost basis you and I will never see.</span></div>
  <div class="row dim">The exact opposite of the coins I usually care about.</div>
</body></html>
