<!doctype html><html><head><meta charset="utf-8"><style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800&display=swap');
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1920px;height:1080px;overflow:hidden}
  body{background:radial-gradient(1200px 800px at 50% 30%,#0d1a2b 0%,#070b16 60%,#04060d 100%);
    font-family:Inter,system-ui,sans-serif;color:#e8eef6;display:flex;flex-direction:column;align-items:center;padding:64px 90px}
  .eyebrow{font-size:26px;letter-spacing:.32em;text-transform:uppercase;color:#2dd4bf;font-weight:800;margin-bottom:10px}
  h1{font-size:56px;font-weight:800;letter-spacing:-.02em;margin-bottom:6px;text-align:center}
  h1 .g{color:#2dd4bf}.sub{font-size:24px;color:#8aa0b6;margin-bottom:20px}
  svg{flex:1}
  .axis{stroke:#33465e;stroke-width:2}
  .axlbl{fill:#7d92aa;font-size:22px;font-weight:600}
  .demand{fill:none;stroke:#2dd4bf;stroke-width:6}
  .float{fill:none;stroke:#5f728a;stroke-width:4;stroke-dasharray:12 10}
  .price{fill:none;stroke:#ffd166;stroke-width:7}
  .tag{font-size:24px;font-weight:800}
  .note{fill:#9fb3c8;font-size:22px}
</style></head><body>
  <div class="eyebrow">Demand rising against a supply that cannot grow</div>
  <h1>When demand meets a <span class="g">fixed float</span></h1>
  <div class="sub">conceptual, not a price prediction</div>
  <svg viewBox="0 0 1400 720" width="1400">
    <!-- axes -->
    <line class="axis" x1="120" y1="620" x2="1320" y2="620"/>
    <line class="axis" x1="120" y1="60" x2="120" y2="620"/>
    <text class="axlbl" x="1180" y="660">time / adoption &#8594;</text>
    <!-- fixed float (flat) -->
    <line class="float" x1="120" y1="430" x2="1320" y2="430"/>
    <text class="tag" fill="#8aa0b6" x="150" y="410">FIXED FLOAT (100B, no more unlocks)</text>
    <!-- demand curve rising -->
    <path class="demand" d="M 120 560 C 480 545, 760 470, 980 360 C 1120 290, 1230 210, 1320 150"/>
    <text class="tag" fill="#2dd4bf" x="1000" y="330">DEMAND</text>
    <!-- price line: drifts, then kinks vertical -->
    <path class="price" d="M 120 590 C 500 585, 900 565, 1080 540 L 1150 250 L 1180 120"/>
    <text class="tag" fill="#ffd166" x="1120" y="110">PRICE</text>
    <text class="note" x="1000" y="470">it doesn&#39;t drift up.</text>
    <text class="note" x="1000" y="500" style="fill:#ffd166;font-weight:800">it moves fast.</text>
  </svg>
</body></html>
