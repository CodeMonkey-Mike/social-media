<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Bittensor — logo reveal</title>
<!--
  bittensor-logo-reveal.html — full-screen TAO/Bittensor logo reveal container (the τ mark Mike supplied,
  recolored white-on-transparent at assets/brand/tao-logo-white.png). For the cold-open "This is Bittensor"
  beat + the CH4 "it's called Bittensor" beat. House deck-navy/cyan aesthetic, code-rendered for brand
  accuracy (logos are NEVER AI-gen). Deterministic seek for screenshot/render: ?t=<ms>.
-->
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@600;800;900&display=swap');
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:100%; height:100%; background:#04060d; overflow:hidden;
              display:flex; align-items:center; justify-content:center; font-family:'Inter',system-ui,sans-serif; }
  .stage { position:relative; width:1920px; height:1080px; background:#04060d; overflow:hidden;
           display:flex; flex-direction:column; align-items:center; justify-content:center; transform-origin:center; }
  @media (max-aspect-ratio:16/9){ .stage{ transform:scale(calc(100vw/1920)); } }
  @media (min-aspect-ratio:16/9){ .stage{ transform:scale(calc(100vh/1080)); } }
  /* glow orb behind the mark */
  .orb { position:absolute; top:42%; left:50%; width:760px; height:760px; border-radius:50%;
         transform:translate(-50%,-50%); background:radial-gradient(circle, rgba(95,224,238,0.22), transparent 62%);
         filter:blur(20px); }
  .logo { width:300px; will-change:transform,opacity;
          filter:drop-shadow(0 0 36px rgba(95,224,238,0.55)) drop-shadow(0 0 90px rgba(95,224,238,0.30)); }
  .word { margin-top:48px; font-weight:900; font-size:104px; letter-spacing:0.14em; color:#eaf3f7;
          will-change:transform,opacity; text-shadow:0 0 50px rgba(0,0,0,0.6); }
  .ticker { margin-top:14px; font-weight:800; font-size:38px; letter-spacing:0.42em; color:#5fe0ee;
            will-change:opacity; }
</style>
</head>
<body>
  <div class="stage" id="stage">
    <div class="orb" id="orb"></div>
    <img class="logo" id="logo" src="../assets/brand/tao-logo-white.png" alt="" />
    <div class="word" id="word">BITTENSOR</div>
    <div class="ticker" id="ticker">$TAO</div>
  </div>
<script>
  const logo = document.getElementById('logo'), word = document.getElementById('word'),
        ticker = document.getElementById('ticker'), orb = document.getElementById('orb');
  const clamp = (v,a,b)=>Math.max(a,Math.min(b,v));
  const ease = t => 1-Math.pow(1-t,3);                 // ease-out cubic
  const seg  = (t,a,b)=>clamp((t-a)/(b-a),0,1);

  // deterministic reveal, t in ms
  function render(t){
    const li = ease(seg(t,0,620));                     // logo fade+scale in
    logo.style.opacity = li.toFixed(3);
    logo.style.transform = `scale(${(0.84+0.16*li).toFixed(4)})`;
    orb.style.opacity = (0.25+0.75*li).toFixed(3);
    const wi = ease(seg(t,420,1040));                  // wordmark up
    word.style.opacity = wi.toFixed(3);
    word.style.transform = `translateY(${(26*(1-wi)).toFixed(1)}px)`;
    ticker.style.opacity = ease(seg(t,860,1340)).toFixed(3);
  }

  const qs = new URLSearchParams(location.search);
  if (qs.has('t')) {
    render(+qs.get('t'));
  } else {
    const start = performance.now();
    (function loop(now){ const t=now-start; render(t > 3200 ? 3200 : t); requestAnimationFrame(loop); })(start);
  }
</script>
</body>
</html>
