<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Bittensor — Subnet topology</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:100%; height:100%; background:#04060d;
              display:flex; align-items:center; justify-content:center; font-family:'Inter',system-ui,sans-serif; }
  .stage { position:relative; width:1920px; height:1080px; transform-origin:center center;
    background:
      radial-gradient(900px 700px at 50% 52%, rgba(33,170,190,0.18), transparent 68%),
      radial-gradient(1000px 700px at 85% 92%, rgba(60,90,200,0.10), transparent 70%),
      linear-gradient(180deg,#070c18 0%,#04060d 100%);
    overflow:hidden; }
  @media (max-aspect-ratio:16/9){ .stage{ transform:scale(calc(100vw/1920)); } }
  @media (min-aspect-ratio:16/9){ .stage{ transform:scale(calc(100vh/1080)); } }
  .stage::before{ content:""; position:absolute; inset:0;
    background-image:radial-gradient(rgba(120,200,220,0.05) 1.4px, transparent 1.6px);
    background-size:48px 48px;
    mask-image:radial-gradient(820px 560px at 50% 52%, #000 35%, transparent 82%); }
  svg{ position:absolute; inset:0; }

  .eyebrow{ font-size:22px; font-weight:600; letter-spacing:.4em; fill:#4fd6e6; text-transform:uppercase; }
  .htitle { font-size:46px; font-weight:800; fill:#eef6f9; }
  .caption{ font-size:25px; font-weight:400; fill:#8aa0ad; }
  .caption b{ fill:#cfe4eb; font-weight:600; }

  .hub-tau  { font-size:84px; font-weight:800; fill:#eafcff; }
  .hub-name { font-size:25px; font-weight:700; fill:#bff0f8; letter-spacing:.16em; }
  .hub-sub  { font-size:17px; font-weight:500; fill:#6fb8c6; letter-spacing:.06em; }

  .node-name{ font-size:26px; font-weight:700; fill:#f1f8fb; }
  .node-sub { font-size:16px; font-weight:500; fill:#7f97a4; letter-spacing:.04em; }
  .more-name{ font-size:25px; font-weight:700; fill:#7fe3f0; }
</style>
</head>
<body>
  <div class="stage">
    <svg viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <radialGradient id="hubFill" cx="50%" cy="38%" r="70%">
          <stop offset="0%"  stop-color="#23788a"/>
          <stop offset="100%" stop-color="#0a1f29"/>
        </radialGradient>
        <linearGradient id="nodeFill" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="rgba(22,38,56,0.92)"/>
          <stop offset="100%" stop-color="rgba(11,19,31,0.92)"/>
        </linearGradient>
        <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
          <feGaussianBlur stdDeviation="7" result="b"/>
          <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
        <filter id="softglow" x="-80%" y="-80%" width="260%" height="260%">
          <feGaussianBlur stdDeviation="16"/>
        </filter>
      </defs>

      <!-- header -->
      <text class="eyebrow" x="120" y="88">The Bittensor network</text>
      <text class="htitle"  x="120" y="140">One network, 100+ subnets</text>

      <!-- ===== connection lines (drawn first, under nodes) ===== -->
      <g stroke="#3fd3e6" fill="none" opacity="0.55">
        <line x1="960" y1="580" x2="960"  y2="300"/>
        <line x1="960" y1="580" x2="1445" y2="405"/>
        <line x1="960" y1="580" x2="1560" y2="650"/>
        <line x1="960" y1="580" x2="1229" y2="838"/>
        <line x1="960" y1="580" x2="691"  y2="838"/>
        <line x1="960" y1="580" x2="360"  y2="650"/>
        <line x1="960" y1="580" x2="475"  y2="405"/>
      </g>
      <g stroke="#bdf3fb" stroke-width="1.4" fill="none" opacity="0.9" stroke-dasharray="2 9" stroke-linecap="round">
        <line x1="960" y1="580" x2="960"  y2="300"/>
        <line x1="960" y1="580" x2="1445" y2="405"/>
        <line x1="960" y1="580" x2="1560" y2="650"/>
        <line x1="960" y1="580" x2="1229" y2="838"/>
        <line x1="960" y1="580" x2="691"  y2="838"/>
        <line x1="960" y1="580" x2="360"  y2="650"/>
        <line x1="960" y1="580" x2="475"  y2="405"/>
      </g>

      <!-- ===== hub ===== -->
      <circle cx="960" cy="580" r="120" fill="#2fd6e6" opacity="0.16" filter="url(#softglow)"/>
      <circle cx="960" cy="580" r="96"  fill="url(#hubFill)" stroke="#5fe0ee" stroke-width="2.5" filter="url(#glow)"/>
      <circle cx="960" cy="580" r="96"  fill="none" stroke="#bff6ff" stroke-width="1" opacity="0.45"/>
      <text class="hub-tau"  x="960" y="572" text-anchor="middle">&#964;</text>
      <text class="hub-name" x="960" y="612" text-anchor="middle">BITTENSOR</text>
      <text class="hub-sub"  x="960" y="636" text-anchor="middle">root chain</text>

      <!-- ===== subnet nodes ===== -->
      <!-- node template: box 268x92 centered on (cx,cy); name + "miners · validators" -->
      <g>
        <!-- 1 top: Text generation -->
        <rect x="826" y="254" width="268" height="92" rx="16" fill="url(#nodeFill)" stroke="rgba(110,190,210,0.30)" stroke-width="1.5"/>
        <text class="node-name" x="960" y="296" text-anchor="middle">Text generation</text>
        <text class="node-sub"  x="960" y="322" text-anchor="middle">miners &#183; validators</text>

        <!-- 2: Image generation -->
        <rect x="1311" y="359" width="268" height="92" rx="16" fill="url(#nodeFill)" stroke="rgba(110,190,210,0.30)" stroke-width="1.5"/>
        <text class="node-name" x="1445" y="401" text-anchor="middle">Image generation</text>
        <text class="node-sub"  x="1445" y="427" text-anchor="middle">miners &#183; validators</text>

        <!-- 3: Financial prediction -->
        <rect x="1426" y="604" width="268" height="92" rx="16" fill="url(#nodeFill)" stroke="rgba(110,190,210,0.30)" stroke-width="1.5"/>
        <text class="node-name" x="1560" y="646" text-anchor="middle">Financial prediction</text>
        <text class="node-sub"  x="1560" y="672" text-anchor="middle">miners &#183; validators</text>

        <!-- 4: Protein folding -->
        <rect x="1095" y="792" width="268" height="92" rx="16" fill="url(#nodeFill)" stroke="rgba(110,190,210,0.30)" stroke-width="1.5"/>
        <text class="node-name" x="1229" y="834" text-anchor="middle">Protein folding</text>
        <text class="node-sub"  x="1229" y="860" text-anchor="middle">miners &#183; validators</text>

        <!-- 5: Deepfake detection -->
        <rect x="557" y="792" width="268" height="92" rx="16" fill="url(#nodeFill)" stroke="rgba(110,190,210,0.30)" stroke-width="1.5"/>
        <text class="node-name" x="691" y="834" text-anchor="middle">Deepfake detection</text>
        <text class="node-sub"  x="691" y="860" text-anchor="middle">miners &#183; validators</text>

        <!-- 6: Model training -->
        <rect x="226" y="604" width="268" height="92" rx="16" fill="url(#nodeFill)" stroke="rgba(110,190,210,0.30)" stroke-width="1.5"/>
        <text class="node-name" x="360" y="646" text-anchor="middle">Model training</text>
        <text class="node-sub"  x="360" y="672" text-anchor="middle">miners &#183; validators</text>

        <!-- 7: + more (scale node) -->
        <rect x="341" y="359" width="268" height="92" rx="16" fill="none" stroke="rgba(95,224,238,0.55)" stroke-width="1.6" stroke-dasharray="7 7"/>
        <text class="more-name" x="475" y="403" text-anchor="middle">+ 90 more subnets</text>
        <text class="node-sub"  x="475" y="429" text-anchor="middle">each its own marketplace</text>
      </g>

      <!-- caption -->
      <text class="caption" x="120" y="1006">Every subnet is its own marketplace of <tspan fill="#cfe4eb" font-weight="600">miners</tspan> and <tspan fill="#cfe4eb" font-weight="600">validators</tspan>, competing to be the best at one job. The best work earns the most <tspan fill="#cfe4eb" font-weight="600">TAO</tspan>.</text>
    </svg>
  </div>
</body>
</html>
