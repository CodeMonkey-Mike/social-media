<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Bittensor — Yuma Consensus</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:100%; height:100%; background:#04060d;
              display:flex; align-items:center; justify-content:center; font-family:'Inter',system-ui,sans-serif; }
  .stage { position:relative; width:1920px; height:1080px; transform-origin:center center;
    background:
      radial-gradient(1000px 720px at 50% 46%, rgba(33,170,190,0.14), transparent 70%),
      linear-gradient(180deg,#070c18 0%,#04060d 100%); overflow:hidden; }
  @media (max-aspect-ratio:16/9){ .stage{ transform:scale(calc(100vw/1920)); } }
  @media (min-aspect-ratio:16/9){ .stage{ transform:scale(calc(100vh/1080)); } }
  .stage::before{ content:""; position:absolute; inset:0;
    background-image:radial-gradient(rgba(120,200,220,0.045) 1.4px, transparent 1.6px);
    background-size:48px 48px; mask-image:radial-gradient(1000px 620px at 50% 48%, #000 40%, transparent 86%); }
  svg{ position:absolute; inset:0; }
  .eyebrow{ font-size:22px; font-weight:600; letter-spacing:.4em; fill:#4fd6e6; text-transform:uppercase; }
  .htitle { font-size:46px; font-weight:800; fill:#eef6f9; }
  .nlabel { font-size:24px; font-weight:700; fill:#e7eff3; }
  .nsub   { font-size:17px; font-weight:500; fill:#8a9fad; }
  .eng-h  { font-size:34px; font-weight:800; fill:#bff6ff; letter-spacing:.05em; }
  .eng-s  { font-size:22px; font-weight:500; fill:#bdd6df; }
  .rew-h  { font-size:27px; font-weight:800; fill:#1a1407; }
  .clip   { font-size:19px; font-weight:700; fill:#ff8a8a; letter-spacing:.08em; }
  .chip-h { font-size:24px; font-weight:700; fill:#eaf3f7; }
  .chip-s { font-size:18px; font-weight:500; fill:#90a4b0; }
</style>
</head>
<body>
  <div class="stage">
    <svg viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="nodeFill" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="rgba(22,38,56,0.92)"/><stop offset="100%" stop-color="rgba(11,19,31,0.92)"/>
        </linearGradient>
        <linearGradient id="engFill" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#13414e"/><stop offset="100%" stop-color="#0b232c"/>
        </linearGradient>
        <linearGradient id="rewFill" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%" stop-color="#f7d488"/><stop offset="100%" stop-color="#e7a83f"/>
        </linearGradient>
        <marker id="aCyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6fd8e6"/></marker>
        <marker id="aAmber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#e7a83f"/></marker>
      </defs>

      <text class="eyebrow" x="120" y="90">Proof of Intelligence</text>
      <text class="htitle"  x="120" y="144">Yuma Consensus: how a network with no boss agrees who is best</text>

      <!-- validators row -->
      <g>
        <rect x="240" y="206" width="300" height="96" rx="16" fill="url(#nodeFill)" stroke="rgba(157,180,255,0.40)" stroke-width="1.5"/>
        <text class="nlabel" x="390" y="248" text-anchor="middle">Validator</text>
        <text class="nsub"   x="390" y="276" text-anchor="middle">scores honestly</text>

        <rect x="620" y="206" width="300" height="96" rx="16" fill="url(#nodeFill)" stroke="rgba(157,180,255,0.40)" stroke-width="1.5"/>
        <text class="nlabel" x="770" y="248" text-anchor="middle">Validator</text>
        <text class="nsub"   x="770" y="276" text-anchor="middle">scores honestly</text>

        <rect x="1000" y="206" width="300" height="96" rx="16" fill="url(#nodeFill)" stroke="rgba(157,180,255,0.40)" stroke-width="1.5"/>
        <text class="nlabel" x="1150" y="248" text-anchor="middle">Validator</text>
        <text class="nsub"   x="1150" y="276" text-anchor="middle">scores honestly</text>

        <!-- rogue -->
        <rect x="1380" y="206" width="300" height="96" rx="16" fill="rgba(46,16,18,0.7)" stroke="#ff7b7b" stroke-width="1.6" stroke-dasharray="7 6"/>
        <text class="nlabel" x="1530" y="248" text-anchor="middle" fill="#ffd2d2">Rogue validator</text>
        <text class="nsub"   x="1530" y="276" text-anchor="middle" fill="#ff9d9d">inflates a friend</text>
      </g>

      <!-- arrows validators -> consensus -->
      <g stroke="#6fd8e6" stroke-width="2.4" fill="none">
        <line x1="390"  y1="302" x2="540"  y2="424" marker-end="url(#aCyan)"/>
        <line x1="770"  y1="302" x2="800"  y2="424" marker-end="url(#aCyan)"/>
        <line x1="1150" y1="302" x2="1080" y2="424" marker-end="url(#aCyan)"/>
      </g>
      <!-- rogue arrow CLIPPED -->
      <line x1="1530" y1="302" x2="1430" y2="392" stroke="#ff7b7b" stroke-width="2.4" stroke-dasharray="6 7"/>
      <g transform="translate(1455,402)">
        <circle r="22" fill="rgba(46,16,18,0.9)" stroke="#ff7b7b" stroke-width="2"/>
        <path d="M-9 -9 L9 9 M9 -9 L-9 9" stroke="#ff7b7b" stroke-width="2.6"/>
      </g>
      <text class="clip" x="1486" y="408">CLIPPED</text>

      <!-- consensus engine -->
      <rect x="360" y="430" width="1200" height="150" rx="22" fill="url(#engFill)" stroke="#5fe0ee" stroke-width="2.2"/>
      <text class="eng-h" x="960" y="496" text-anchor="middle">YUMA CONSENSUS</text>
      <text class="eng-s" x="960" y="534" text-anchor="middle">blends every validator's scores, weighted by stake, into one agreed-upon truth</text>

      <!-- consensus -> rewards -->
      <line x1="960" y1="580" x2="960" y2="648" stroke="#e7a83f" stroke-width="2.6" marker-end="url(#aAmber)"/>

      <!-- rewards -->
      <rect x="560" y="652" width="800" height="92" rx="18" fill="url(#rewFill)"/>
      <text class="rew-h" x="960" y="708" text-anchor="middle">&#964; Miners paid in proportion to the consensus</text>

      <!-- property chips -->
      <g>
        <rect x="120" y="812" width="540" height="150" rx="18" fill="rgba(14,24,34,0.6)" stroke="rgba(110,190,210,0.22)"/>
        <text class="chip-h" x="150" y="862">You cannot rig it</text>
        <text class="chip-s" x="150" y="898">one rogue vote gets clipped and</text>
        <text class="chip-s" x="150" y="922">thrown out, no single validator pays</text>

        <rect x="690" y="812" width="540" height="150" rx="18" fill="rgba(14,24,34,0.6)" stroke="rgba(110,190,210,0.22)"/>
        <text class="chip-h" x="720" y="862">The judges are judged</text>
        <text class="chip-s" x="720" y="898">stay near consensus, earn more;</text>
        <text class="chip-s" x="720" y="922">deviate or lie, get penalized</text>

        <rect x="1260" y="812" width="540" height="150" rx="18" fill="rgba(14,24,34,0.6)" stroke="rgba(110,190,210,0.22)"/>
        <text class="chip-h" x="1290" y="862">Skin in the game</text>
        <text class="chip-s" x="1290" y="898">validators stake TAO to play, so</text>
        <text class="chip-s" x="1290" y="922">cheating costs real money</text>
      </g>
    </svg>
  </div>
</body>
</html>
