<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Bittensor — TAO token</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:100%; height:100%; background:#04060d;
              display:flex; align-items:center; justify-content:center; font-family:'Inter',system-ui,sans-serif; }
  .stage { position:relative; width:1920px; height:1080px; transform-origin:center center;
    background:
      radial-gradient(900px 700px at 30% 46%, rgba(33,170,190,0.14), transparent 70%),
      radial-gradient(800px 600px at 88% 86%, rgba(231,168,63,0.10), transparent 72%),
      linear-gradient(180deg,#070c18 0%,#04060d 100%); overflow:hidden; }
  @media (max-aspect-ratio:16/9){ .stage{ transform:scale(calc(100vw/1920)); } }
  @media (min-aspect-ratio:16/9){ .stage{ transform:scale(calc(100vh/1080)); } }
  .stage::before{ content:""; position:absolute; inset:0;
    background-image:radial-gradient(rgba(120,200,220,0.045) 1.4px, transparent 1.6px);
    background-size:48px 48px; mask-image:radial-gradient(1000px 640px at 40% 50%, #000 40%, transparent 86%); }
  svg{ position:absolute; inset:0; }
  .eyebrow{ font-size:22px; font-weight:600; letter-spacing:.4em; fill:#4fd6e6; text-transform:uppercase; }
  .htitle { font-size:46px; font-weight:800; fill:#eef6f9; }
  .coin-t { font-size:120px; font-weight:800; fill:#eafcff; }
  .coin-l { font-size:38px; font-weight:800; fill:#bff0f8; letter-spacing:.14em; }
  .supnum { font-size:62px; font-weight:800; fill:#ffffff; }
  .suplbl { font-size:24px; font-weight:500; fill:#9fb4c0; }
  .use-h  { font-size:30px; font-weight:800; letter-spacing:.04em; }
  .use-s  { font-size:22px; font-weight:500; fill:#9fb4c0; }
  .tl-d   { font-size:22px; font-weight:700; fill:#dfeef3; }
  .tl-s   { font-size:18px; font-weight:500; fill:#8a9fad; }
</style>
</head>
<body>
  <div class="stage">
    <svg viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <radialGradient id="coinFill" cx="50%" cy="36%" r="72%">
          <stop offset="0%" stop-color="#2c93a6"/><stop offset="100%" stop-color="#0a2530"/>
        </radialGradient>
        <linearGradient id="useFill" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="rgba(22,38,56,0.92)"/><stop offset="100%" stop-color="rgba(11,19,31,0.92)"/>
        </linearGradient>
        <filter id="g2" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="14"/></filter>
        <marker id="aC" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6fd8e6"/></marker>
      </defs>

      <text class="eyebrow" x="120" y="90">The TAO token</text>
      <text class="htitle"  x="120" y="144">TAO: the money of the network</text>

      <!-- coin -->
      <circle cx="430" cy="455" r="172" fill="#2fd6e6" opacity="0.14" filter="url(#g2)"/>
      <circle cx="430" cy="455" r="140" fill="url(#coinFill)" stroke="#5fe0ee" stroke-width="3"/>
      <circle cx="430" cy="455" r="140" fill="none" stroke="#bff6ff" stroke-width="1" opacity="0.4"/>
      <text class="coin-t" x="430" y="497" text-anchor="middle">&#964;</text>
      <text class="coin-l" x="430" y="652" text-anchor="middle">TAO</text>

      <!-- supply -->
      <text class="supnum" x="430" y="752" text-anchor="middle">21,000,000</text>
      <text class="suplbl" x="430" y="792" text-anchor="middle">max supply, capped exactly like Bitcoin</text>

      <!-- use cards -->
      <g>
        <rect x="980" y="276" width="820" height="150" rx="20" fill="url(#useFill)" stroke="rgba(95,224,238,0.40)" stroke-width="1.6"/>
        <text class="use-h" x="1014" y="338" fill="#5fe0ee">EARN it</text>
        <text class="use-s" x="1014" y="378">do real work for the network and get paid</text>

        <rect x="980" y="452" width="820" height="150" rx="20" fill="url(#useFill)" stroke="rgba(157,180,255,0.40)" stroke-width="1.6"/>
        <text class="use-h" x="1014" y="514" fill="#9db4ff">STAKE it</text>
        <text class="use-s" x="1014" y="554">lock it up to secure the network and back validators</text>

        <rect x="980" y="628" width="820" height="150" rx="20" fill="url(#useFill)" stroke="rgba(126,222,160,0.40)" stroke-width="1.6"/>
        <text class="use-h" x="1014" y="690" fill="#7ede9f">SPEND it</text>
        <text class="use-s" x="1014" y="730">use it to access the AI the network produces</text>
      </g>

      <!-- arrows coin -> uses -->
      <g fill="none" stroke="#6fd8e6" stroke-width="2.2" opacity="0.8">
        <line x1="572" y1="430" x2="978" y2="351" marker-end="url(#aC)"/>
        <line x1="572" y1="455" x2="978" y2="527" marker-end="url(#aC)"/>
        <line x1="572" y1="500" x2="978" y2="703" marker-end="url(#aC)"/>
      </g>

      <!-- halving timeline -->
      <line x1="200" y1="900" x2="1720" y2="900" stroke="rgba(110,190,210,0.4)" stroke-width="2"/>
      <g>
        <circle cx="300" cy="900" r="9" fill="#5fe0ee"/>
        <text class="tl-d" x="300" y="952" text-anchor="middle">Fair launch</text>
        <text class="tl-s" x="300" y="978" text-anchor="middle">Jan 2021 &#183; no VC, no premine</text>

        <circle cx="960" cy="900" r="9" fill="#f5c96b"/>
        <text class="tl-d" x="960" y="952" text-anchor="middle">1st halving</text>
        <text class="tl-s" x="960" y="978" text-anchor="middle">Dec 2025</text>

        <circle cx="1620" cy="900" r="9" fill="#9db4ff"/>
        <text class="tl-d" x="1620" y="952" text-anchor="middle">Next halving</text>
        <text class="tl-s" x="1620" y="978" text-anchor="middle">~2029</text>
      </g>
    </svg>
  </div>
</body>
</html>
