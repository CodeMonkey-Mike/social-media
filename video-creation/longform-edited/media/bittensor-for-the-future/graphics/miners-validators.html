<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Bittensor — Miners &amp; Validators</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:100%; height:100%; background:#04060d;
              display:flex; align-items:center; justify-content:center; font-family:'Inter',system-ui,sans-serif; }
  .stage { position:relative; width:1920px; height:1080px; transform-origin:center center;
    background:
      radial-gradient(1000px 720px at 50% 50%, rgba(33,170,190,0.13), transparent 70%),
      linear-gradient(180deg,#070c18 0%,#04060d 100%);
    overflow:hidden; }
  @media (max-aspect-ratio:16/9){ .stage{ transform:scale(calc(100vw/1920)); } }
  @media (min-aspect-ratio:16/9){ .stage{ transform:scale(calc(100vh/1080)); } }
  .stage::before{ content:""; position:absolute; inset:0;
    background-image:radial-gradient(rgba(120,200,220,0.045) 1.4px, transparent 1.6px);
    background-size:48px 48px; mask-image:radial-gradient(1000px 640px at 50% 52%, #000 40%, transparent 85%); }
  svg{ position:absolute; inset:0; }

  .eyebrow{ font-size:22px; font-weight:600; letter-spacing:.4em; fill:#4fd6e6; text-transform:uppercase; }
  .htitle { font-size:46px; font-weight:800; fill:#eef6f9; }
  .caption{ font-size:25px; font-weight:500; fill:#9fb4c0; }

  .panel-h{ font-size:30px; font-weight:800; letter-spacing:.04em; }
  .panel-s{ font-size:19px; font-weight:500; fill:#88a0ad; }
  .node-t { font-size:21px; font-weight:600; fill:#dfeef3; }
  .flow-lbl{ font-size:19px; font-weight:600; fill:#7f97a4; letter-spacing:.06em; text-transform:uppercase; }
  .bar-t  { font-size:20px; font-weight:700; fill:#0d1118; }
  .rank-t { font-size:19px; font-weight:600; fill:#cdd9e0; }
</style>
</head>
<body>
  <div class="stage">
    <svg viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="nodeFill" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="rgba(22,38,56,0.92)"/>
          <stop offset="100%" stop-color="rgba(11,19,31,0.92)"/>
        </linearGradient>
        <linearGradient id="goldBar" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%" stop-color="#f7d488"/><stop offset="100%" stop-color="#e7a83f"/>
        </linearGradient>
        <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
          <path d="M0 0 L10 5 L0 10 z" fill="#6fd8e6"/>
        </marker>
        <marker id="arrowDim" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
          <path d="M0 0 L10 5 L0 10 z" fill="#5a7280"/>
        </marker>
      </defs>

      <text class="eyebrow" x="120" y="92">Inside one subnet</text>
      <text class="htitle"  x="120" y="146">Miners produce. Validators score. The best work wins.</text>

      <!-- ===== Panel 1: MINERS (cyan) ===== -->
      <rect x="120" y="300" width="470" height="430" rx="22" fill="rgba(10,24,34,0.55)" stroke="rgba(95,224,238,0.45)" stroke-width="1.6"/>
      <text class="panel-h" x="150" y="360" fill="#5fe0ee">MINERS</text>
      <text class="panel-s" x="150" y="392">run the AI models, produce the work</text>
      <g>
        <rect x="150" y="430" width="410" height="60" rx="12" fill="url(#nodeFill)" stroke="rgba(95,224,238,0.30)"/>
        <text class="node-t" x="172" y="467">Miner &#183; runs a model</text>
        <rect x="150" y="502" width="410" height="60" rx="12" fill="url(#nodeFill)" stroke="rgba(95,224,238,0.30)"/>
        <text class="node-t" x="172" y="539">Miner &#183; runs a model</text>
        <rect x="150" y="574" width="410" height="60" rx="12" fill="url(#nodeFill)" stroke="rgba(95,224,238,0.30)"/>
        <text class="node-t" x="172" y="611">Miner &#183; runs a model</text>
        <rect x="150" y="646" width="410" height="60" rx="12" fill="url(#nodeFill)" stroke="rgba(95,224,238,0.30)"/>
        <text class="node-t" x="172" y="683">Miner &#183; runs a model</text>
      </g>

      <!-- flow arrow 1 -->
      <line x1="600" y1="515" x2="690" y2="515" stroke="#6fd8e6" stroke-width="2.4" marker-end="url(#arrow)"/>
      <text class="flow-lbl" x="645" y="498" text-anchor="middle">outputs</text>

      <!-- ===== Panel 2: VALIDATORS (indigo) ===== -->
      <rect x="700" y="300" width="470" height="430" rx="22" fill="rgba(14,18,40,0.55)" stroke="rgba(157,180,255,0.45)" stroke-width="1.6"/>
      <text class="panel-h" x="730" y="360" fill="#9db4ff">VALIDATORS</text>
      <text class="panel-s" x="730" y="392">score every output for quality</text>
      <g>
        <rect x="730" y="445" width="410" height="74" rx="12" fill="url(#nodeFill)" stroke="rgba(157,180,255,0.30)"/>
        <text class="node-t" x="752" y="481">Validator</text>
        <text class="panel-s" x="752" y="505" fill="#7e8fc2">grades the answers it sees</text>
        <rect x="730" y="535" width="410" height="74" rx="12" fill="url(#nodeFill)" stroke="rgba(157,180,255,0.30)"/>
        <text class="node-t" x="752" y="571">Validator</text>
        <text class="panel-s" x="752" y="595" fill="#7e8fc2">grades the answers it sees</text>
        <rect x="730" y="625" width="410" height="74" rx="12" fill="url(#nodeFill)" stroke="rgba(157,180,255,0.30)"/>
        <text class="node-t" x="752" y="661">Validator</text>
        <text class="panel-s" x="752" y="685" fill="#7e8fc2">grades the answers it sees</text>
      </g>

      <!-- flow arrow 2 -->
      <line x1="1180" y1="515" x2="1270" y2="515" stroke="#6fd8e6" stroke-width="2.4" marker-end="url(#arrow)"/>
      <text class="flow-lbl" x="1225" y="498" text-anchor="middle">ranked</text>

      <!-- ===== Panel 3: TAO REWARDS (amber) ===== -->
      <rect x="1280" y="300" width="520" height="430" rx="22" fill="rgba(34,26,10,0.5)" stroke="rgba(245,201,107,0.45)" stroke-width="1.6"/>
      <text class="panel-h" x="1310" y="360" fill="#f5c96b">TAO REWARDS</text>
      <text class="panel-s" x="1310" y="392">the best output earns the most TAO</text>
      <!-- ranked bars -->
      <g>
        <rect x="1310" y="440" width="450" height="58" rx="10" fill="url(#goldBar)"/>
        <text class="bar-t" x="1332" y="476">&#964; Best output</text>
        <text class="rank-t" x="1740" y="476" text-anchor="end" fill="#3a2c0c">most</text>

        <rect x="1310" y="518" width="300" height="58" rx="10" fill="url(#goldBar)" opacity="0.72"/>
        <text class="bar-t" x="1332" y="554">&#964; 2nd best</text>

        <rect x="1310" y="596" width="180" height="58" rx="10" fill="url(#goldBar)" opacity="0.5"/>
        <text class="bar-t" x="1332" y="632">&#964; 3rd</text>

        <rect x="1310" y="674" width="90" height="40" rx="8" fill="#5a4a26" opacity="0.8"/>
        <text class="rank-t" x="1418" y="700" fill="#9a8a66">least &#183; poor work earns little</text>
      </g>

      <!-- ===== feedback loop ===== -->
      <path d="M1540 730 L1540 800 L355 800 L355 732" fill="none" stroke="#5a7280" stroke-width="2" stroke-dasharray="3 8" marker-end="url(#arrowDim)"/>
      <text class="caption" x="960" y="855" text-anchor="middle">A constant, global competition, repeating every step. No boss decides who gets paid.</text>
    </svg>
  </div>
</body>
</html>
