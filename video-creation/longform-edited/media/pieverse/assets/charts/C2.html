    const last = pts[pts.length-1];
    g.push(`<defs><linearGradient id="fill" x1="0" y1="${P.yTop}" x2="0" y2="${P.yBot}" gradientUnits="userSpaceOnUse">
              <stop offset="0" stop-color="rgba(0,230,138,.26)"/><stop offset="1" stop-color="rgba(0,230,138,0)"/></linearGradient></defs>`);
    g.push(`<path d="${d} L${f2(last.x)},${P.yBot} L${f2(pts[0].x)},${P.yBot} Z" fill="url(#fill)"/>`);
    g.push(`<path d="${d}" fill="none" stroke="var(--lit)" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>`);
    // leaders + marker rings for every landed marker
    const landed = GEO.markers.filter(m => m.t_utc <= head);
    for (const m of landed){
      const on = lv[m.key] === 'lit';
      const op = on ? 1 : .55;
      g.push(leader(m, op));
      if (on) g.push(`<circle cx="${m.x}" cy="${m.y}" r="22" fill="rgba(0,230,138,.20)"/>`);
      g.push(`<circle cx="${m.x}" cy="${m.y}" r="9" fill="#0a0c10" stroke="${on?'var(--lit)':'#c9cfdb'}" stroke-width="3.5" opacity="${op}"/>`);
    }
    if (lv.end){
      const e = GEO.end;
      g.push(`<circle cx="${e.x}" cy="${e.y}" r="24" fill="rgba(0,230,138,.22)"/><circle cx="${e.x}" cy="${e.y}" r="10" fill="var(--lit)"/>`);
    }
  }
  return `<svg class="plot" viewBox="0 0 1920 1080">${g.join('')}</svg>`;
}
// leader from a marker dot to its callout (elbow), per GEO.callouts
function leader(m, op){
  const c = GEO.callouts[m.key], s = `stroke="#8892a4" stroke-width="1.6" stroke-dasharray="3 5" opacity="${op}" fill="none"`;
  if (m.key === 'atl')   return `<path d="M${m.x-12},${m.y} L${c.gutter_x},${m.y} L${c.gutter_x},${c.y+c.h/2} L${c.x},${c.y+c.h/2}" ${s}/>`; // left, up the gutter, right
  if (m.key === 'upbit') return `<path d="M${m.x},${m.y-12} L${m.x},${c.y+c.h}" ${s}/>`;               // straight up
  if (m.key === 'ath')   return `<path d="M${m.x-12},${m.y} L${c.x+c.w},${m.y}" ${s}/>`;               // straight left
  return '';
}
function callout(m, level){
  const c = GEO.callouts[m.key];
  return `<div class="co ${level}" style="left:${c.x}px;top:${c.y}px;width:${c.w}px;height:${c.h}px">
            <div class="l">${m.label}</div><div class="r"><span class="v">${m.value_text}</span><span class="d">${m.date_text.toUpperCase()}</span></div></div>`;
}
const ORB = '<div class="orb" style="width:820px;height:820px;right:-340px;top:-420px;background:#00e68a;opacity:.20"></div>'
          + '<div class="orb" style="width:560px;height:560px;left:-300px;bottom:-360px;background:#0b3a66;opacity:.30"></div>';

function frame(name, head, lv){
  let stage = plotSvg(head, lv);
  if (head) for (const m of GEO.markers) if (m.t_utc <= head && lv[m.key]) stage += callout(m, lv[m.key]);
  if (lv.end){
    const e = GEO.end;
    stage += `<div class="endl" style="left:${P.x1+34}px;top:${e.y-62}px"><div class="l">At recording</div><div class="v">${e.value_text}</div>
                <div class="d">${e.date_text.toUpperCase()}</div><div class="t">14:15 UTC</div></div>`;
  }
  const html = ORB
    + `<div class="ey">One year of trading, in USD</div><h1 class="sm">The <span class="tl">PIEVERSE</span> price</h1><div class="divider"></div>`
    + `<div class="pill">Read <span class="mono">14 NOV 2026</span></div>`
    + `<div class="stage">${stage}</div>`
    + `<div class="src">Source: CoinGecko, daily prints at 00:00 UTC plus its intraday all-time low and high and the 14:15 UTC print of 14 Nov 2026 · read 14 Nov 2026</div>`;
  const f = document.createElement('div');
  f.className = 'frame'; f.id = 'C2-' + name; f.innerHTML = html;
  return f;
}
const root = document.getElementById('frames');
for (const [n, h, lv] of STATES) root.appendChild(frame(n, h, lv));
window.FRAME_IDS = STATES.map(([n]) => 'C2-' + n);
</script>
</body></html>
