<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700;900&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{width:1920px;height:1080px;background:#05070a;display:flex;align-items:center;justify-content:center;font-family:'DM Sans',sans-serif}
.card{width:1820px;height:980px;background:#0d1015;border:1px solid #1e2330;border-radius:28px;padding:64px 72px;display:flex;flex-direction:column}
h1{font-size:52px;font-weight:900;color:#e8eaf0;letter-spacing:-0.01em}
.sub{font-size:24px;color:#8892a4;margin-top:14px;font-weight:400}
.chartarea{flex:1;margin-top:36px;display:flex;align-items:center;justify-content:center}
.takeaway{font-size:30px;margin-top:20px}
.takeaway b{color:#ff4060;font-weight:700}
.takeaway span{color:#8892a4;font-weight:400}
.source{font-size:17px;color:#505a6e;margin-top:16px;font-family:'JetBrains Mono',monospace}
</style></head>
<body>
<div class="card">
  <h1>Bitcoin, August 2&ndash;5, 2024</h1>
  <div class="sub">The 48 hours the carry-trade unwind reached crypto</div>
  <div class="chartarea">
    <svg viewBox="0 0 1680 600" width="1680" height="600">
      <line x1="100" y1="40" x2="100" y2="520" stroke="#1e2330" stroke-width="2"/>
      <line x1="100" y1="520" x2="1620" y2="520" stroke="#1e2330" stroke-width="2"/>
      <text x="70" y="110" fill="#8892a4" font-family="JetBrains Mono" font-size="22" text-anchor="end">$64K</text>
      <text x="70" y="300" fill="#8892a4" font-family="JetBrains Mono" font-size="22" text-anchor="end">$57K</text>
      <text x="70" y="440" fill="#8892a4" font-family="JetBrains Mono" font-size="22" text-anchor="end">$50K</text>
      <polyline fill="none" stroke="#ff4060" stroke-width="5" points="100,100 480,110 850,180 1160,360 1450,455 1620,430"/>
      <circle cx="100" cy="100" r="10" fill="#00e68a"/>
      <text x="150" y="70" fill="#00e68a" font-family="JetBrains Mono" font-size="26">~$64,000</text>
      <circle cx="1450" cy="455" r="10" fill="#ff4060"/>
      <text x="1430" y="500" fill="#ff4060" font-family="JetBrains Mono" font-size="26" text-anchor="middle">sub-$50,000</text>
      <text x="100" y="560" fill="#505a6e" font-family="JetBrains Mono" font-size="20">Aug 2</text>
      <text x="1560" y="560" fill="#505a6e" font-family="JetBrains Mono" font-size="20">Aug 5</text>
    </svg>
  </div>
  <div class="takeaway"><b>&minus;$14,000 in about 48 hours</b><span> &mdash; and priced in yen, it fell even harder than in dollars</span></div>
  <div class="source">SOURCE: BIS BULLETIN NO. 90 + COINDESK (2024-08-05). SCHEMATIC FROM CONFIRMED ENDPOINTS, NOT A FULL TICK SERIES. VERIFY AT RENDER.</div>
</div>
</body></html>
