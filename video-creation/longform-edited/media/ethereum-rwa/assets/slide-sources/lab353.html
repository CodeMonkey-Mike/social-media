<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@900&family=DM+Sans:wght@400;700&family=JetBrains+Mono:wght@800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1920px;height:1080px;background:#0a0c10;overflow:hidden}
.frame{width:1920px;height:1080px;position:relative;display:flex;flex-direction:column;
 justify-content:center;padding:0 150px;font-family:'DM Sans',sans-serif;
 background:radial-gradient(1200px 700px at 22% 42%, rgba(0,230,138,.10), transparent 62%),#0a0c10}
.eyebrow{color:#505a6e;font-size:28px;letter-spacing:8px;font-weight:700;margin-bottom:26px}
.row{display:flex;align-items:center;gap:64px}
.mark{width:250px;height:auto;filter:drop-shadow(0 0 34px rgba(0,230,138,.42))}
.big{font-family:'JetBrains Mono',monospace;font-weight:800;font-size:300px;line-height:.9;
 color:#00e68a;text-shadow:0 0 70px rgba(0,230,138,.36)}
.sub{font-family:'Playfair Display',serif;font-weight:900;font-size:74px;color:#fff;margin-top:34px}
.tag{margin-top:30px;display:inline-block;border:2px solid #00e68a;color:#00e68a;
 padding:12px 30px;border-radius:44px;font-size:29px;font-weight:700;letter-spacing:2px;width:fit-content}
.src{position:absolute;left:150px;bottom:52px;color:#3d4657;font-size:20px;letter-spacing:1px}
</style></head><body>
<div class="frame">
  <div class="eyebrow">A RECENT CALL</div>
  <div class="row"><img class="mark" src="LAB.png"><div class="big">353X</div></div>
  <div class="sub">on the LAB token</div>
  <div class="tag">TWO MONTHS AGO</div>
  <div class="src">Verify the multiplier against reality at publish (persona: verified_claims_only)</div>
</div></body></html>
