:root{--bg-deep:#0a0c10;--bg-card:#12151c;--bg-card-hover:#181c26;--accent-green:#00e68a;--accent-cyan:#00c2ff;

  --r-kas:73,224,200;--r-vp:168,85,247;--r-pr:255,215,0;--r-us:0,194,255;--r-ok:0,230,138;--r-bad:255,64,96}
*{margin:0;padding:0;box-sizing:border-box}
body{background:#04060d;font-family:'DM Sans',sans-serif}
.frame{width:1080px;height:1920px;background:var(--bg-deep);position:relative;overflow:hidden;color:var(--text-primary);margin-bottom:40px}
.frame::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:9;opacity:.03;

.orb{position:absolute;border-radius:50%;filter:blur(120px);opacity:.30;pointer-events:none;z-index:0}
.hdr{position:absolute;left:72px;right:72px;top:130px;z-index:2}
.ey{font-size:28px;font-weight:600;letter-spacing:.18em;color:var(--text-muted);margin-bottom:22px;line-height:1.3} /* caps typed literally: keeps "vPROG" */
h1{font-family:'Playfair Display',serif;font-weight:900;font-size:90px;line-height:1.05;letter-spacing:-.02em;color:var(--text-primary)}
.divider{width:76px;height:5px;border-radius:3px;background:linear-gradient(90deg,var(--accent-green),var(--accent-cyan));margin-top:32px}

.g{color:var(--accent-green)}.c{color:var(--accent-cyan)}.go{color:var(--accent-gold)}.re{color:var(--accent-red)}.pu{color:var(--accent-purple)}.tl{color:var(--accent-teal)}
svg.wires{position:absolute;inset:0;width:1080px;height:1920px;z-index:1;overflow:visible}
/* NODE: resting = readable (titles text-secondary, subs muted); .on = lit in its role color */
.node{position:absolute;z-index:2;background:var(--bg-card);border:2px solid var(--border);border-radius:24px;padding:32px 38px}
.node .top{position:absolute;inset:-2px;border-radius:24px;overflow:hidden;pointer-events:none;opacity:0} /* clip box = the card's OUTER shape */
.node .top::before{content:"";position:absolute;left:0;right:0;top:0;height:5px}
.node .nt{font-weight:700;font-size:38px;letter-spacing:.08em;color:var(--text-secondary)}
.node .ns{font-weight:500;font-size:29px;color:var(--text-muted);margin-top:8px}
.node.on{border-color:rgba(var(--r),.85);background:linear-gradient(160deg,rgba(var(--r),.13),rgba(18,21,28,.97) 62%);
  box-shadow:0 0 0 1px rgba(var(--r),.25),0 0 70px rgba(var(--r),.26)}
.node.on .top{opacity:1}.node.on .top::before{background:linear-gradient(90deg,rgb(var(--r)),transparent)}
.node.on .nt{color:rgb(var(--r))}.node.on .ns{color:var(--text-primary)}
/* EDGE: resting muted wire; .on = role color + glow */
.edge path,.edge line{stroke:#283042;stroke-width:5;fill:none;stroke-linecap:round}
.edge polygon{fill:#283042}
.edge.on{filter:drop-shadow(0 0 8px rgba(var(--r),.75))}
.edge.on path,.edge.on line{stroke:rgb(var(--r))}.edge.on polygon{fill:rgb(var(--r))}
.rv{opacity:0}.rv.on{opacity:1}
/* ==== CHART-SPECIFIC ==== */
h1{font-size:92px}
.node{padding:30px 38px}
.node .nt{font-size:38px}
.srv{display:flex;flex-wrap:wrap;gap:20px 20px;margin-top:26px;align-items:center}

.srv i::before,.srv i::after{content:"";position:absolute;left:14px;right:14px;height:7px;border-radius:4px;background:#2a3140}

.badge{padding:12px 24px;border-radius:100px;border:2px solid rgba(168,85,247,.85);background:rgba(168,85,247,.14);

.acc .ah .ap sub{font-size:26px}
.acc .as{font-size:27px;color:var(--text-muted);margin-top:4px;font-weight:500}
.chips{display:grid;grid-template-columns:1fr 1fr;gap:16px 18px;margin-top:22px}
.ac{height:78px;border-radius:14px;border:2px solid #262c3a;background:#10131a;display:flex;align-items:center;gap:16px;padding:0 22px;color:#3a4254}
.ac span{display:block;height:9px;border-radius:5px;background:#232937}
.acc.on{border-color:rgba(168,85,247,.7);background:linear-gradient(160deg,rgba(168,85,247,.12),rgba(168,85,247,.02));box-shadow:0 0 40px rgba(168,85,247,.2)}
.acc.on .ah{color:#c89bff}.acc.on .as{color:var(--text-primary)}
.acc.on .ac{border-color:rgba(168,85,247,.5);color:#c89bff}.acc.on .ac span{background:rgba(168,85,247,.45)}
.lock{position:absolute;display:flex;align-items:center;gap:16px;padding:14px 22px;border-radius:14px;

.lock .lk{color:#c89bff;flex:none}
.lock .lt{font-weight:700;font-size:26px;letter-spacing:.07em;line-height:1.35;color:var(--text-primary);white-space:nowrap}

.elabel{position:absolute;z-index:3;display:flex;align-items:center;gap:10px;padding:9px 18px;border-radius:100px;font-weight:700;font-size:25px;letter-spacing:.12em;

.el-r{color:var(--accent-green);border-color:rgba(0,230,138,.8)}
.el-w{color:var(--accent-red);border-color:rgba(255,64,96,.8)}
.bx{position:absolute;z-index:3;width:50px;height:50px;border-radius:50%;background:#12151c;border:3px solid var(--accent-red);opacity:0;display:flex;align-items:center;justify-content:center}
.bx.on{opacity:1}
.edge.rv{opacity:0}.edge.rv.on{opacity:1}

<script>
const CHART='c1-vprog-nodes';
const STATES=[
  {id:'entry',    on:[]},                                                         // 100.42 entry
  {id:'nodes',    on:['.b-own']},                                                 // 'nodes' 101.70
  {id:'accounts', on:['.b-own','.a-acc']},                                        // 'accounts' 104.00
  {id:'lock',     on:['.b-own','.a-acc','.k-lock','.e-rd','.e-wr','.l-rd','.l-wr','.x-bx']}, // 'write' 106.34
];
const tpl=document.getElementById('tpl');
for(const s of STATES){const f=document.createElement('div');f.className='frame';f.id=CHART+'-'+s.id;
  f.appendChild(tpl.content.cloneNode(true));
  s.on.forEach(q=>f.querySelectorAll(q).forEach(e=>e.classList.add('on')));
  (s.hot||[]).forEach(q=>f.querySelectorAll(q).forEach(e=>e.classList.add('hot')));document.body.appendChild(f);}
